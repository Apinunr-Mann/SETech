<title>SETech Sales Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with view tabs; each view is a stack of panels on a cool paper ground.
   Summary first, detail below. Sales colours follow the person (Bee = slot 1, Nungning = slot 2). */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --panel2:#f8f9f7; --ink:#15191b; --ink2:#4b5356; --muted:#7c8487; --line:#dde1dc;
  --accent:#0d675e; --accent-soft:#e1efec; --on-accent:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6; --s-other:#a3a9a6; --fc:#86b6ef; --target:#4b5356;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#17701a; --crit-ink:#b42f2f; --warn-ink:#8a5c00;
  --hot:#d03b3b; --warm:#d98a00; --cold:#3d7fc4;
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,28,.06),0 4px 14px rgba(20,30,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111413; --panel:#191d1c; --panel2:#1f2422; --ink:#eef1ef; --ink2:#bac2bf; --muted:#8a928f; --line:#2c3230;
  --accent:#43b3a5; --accent-soft:#1d3532; --on-accent:#08201d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --s-other:#5f6663; --fc:#184f95; --target:#bac2bf;
  --good-ink:#4cc44c; --crit-ink:#ee7a7a; --warn-ink:#f2c050;
  --hot:#ee6a6a; --warm:#e6a63a; --cold:#6aa5e6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --panel:#191d1c; --panel2:#1f2422; --ink:#eef1ef; --ink2:#bac2bf; --muted:#8a928f; --line:#2c3230;
  --accent:#43b3a5; --accent-soft:#1d3532; --on-accent:#08201d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --s-other:#5f6663; --fc:#184f95; --target:#bac2bf;
  --good-ink:#4cc44c; --crit-ink:#ee7a7a; --warn-ink:#f2c050;
  --hot:#ee6a6a; --warm:#e6a63a; --cold:#6aa5e6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);white-space:nowrap;font-weight:500}
.tab:hover{background:var(--panel2)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.who select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-size:13px}
.banner.warn{background:color-mix(in srgb,var(--warn) 18%,var(--panel))}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ph p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.viewhead h1{font-size:24px;font-weight:700}
.viewhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{font-size:12px;color:var(--ink2);letter-spacing:.01em}
.tile .val{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile.hero .lbl,.tile.hero .sub{color:inherit;opacity:.85}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.tile.hero .bar{background:rgba(255,255,255,.25)}.tile.hero .bar>i{background:var(--on-accent)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.t-Hot .dot{background:var(--hot)}.t-Warm .dot{background:var(--warm)}.t-Cold .dot{background:var(--cold)}
.st{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.st.won{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.st.lost{color:var(--muted);text-decoration:line-through}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;white-space:nowrap}
.flag.crit{color:var(--crit-ink)}.flag.warn{color:var(--warn-ink)}.flag.good{color:var(--good-ink)}
.owner{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
/* tables */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel2)}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
.cname{font-weight:500}
.small{font-size:12px}
/* buttons, forms */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;color:var(--ink2);font-weight:500}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);width:100%}
.fld textarea{min-height:64px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--warn-ink)}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.colh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.colh b{font-family:var(--f-display);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;border-left:3px solid var(--owner,var(--s-other))}
.card:hover{border-color:var(--ink2);border-left-color:var(--owner,var(--s-other))}
.card .t{font-weight:600;font-size:13px;line-height:1.35}
.card .m{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main .t{font-weight:500}
.li.click{cursor:pointer}.li.click:hover .t{color:var(--accent)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}
.daygrp{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--ink2);padding:12px 0 2px;border-bottom:1px solid var(--line)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.line{height:0;border-top:2px dashed var(--target);border-radius:0}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:8px;max-width:260px;box-shadow:var(--shadow)}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .trk{height:14px;background:var(--panel2);border-radius:0 4px 4px 0;position:relative}
.hbar .trk i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0}
details summary{cursor:pointer;color:var(--ink2);font-size:12px;margin-top:8px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.42);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);width:min(640px,100%);height:100%;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh h2{font-size:20px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.sect{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.confirm{background:color-mix(in srgb,var(--crit) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--crit) 35%,var(--line));border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:70;box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:640px){.viewhead h1{font-size:20px}.tile .val{font-size:22px}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><b>SETech Sales Desk</b><span id="yearLbl">ปี 2026</span></div>
  <nav class="tabs" id="tabs" aria-label="มุมมอง"></nav>
  <div class="who"><label for="meSel">ฉันคือ</label><select id="meSel"></select></div>
</div></header>
<div class="wrap"><main id="main"><div class="empty">กำลังโหลดข้อมูลการขาย…</div></main></div>
<datalist id="acctList"></datalist><datalist id="prodList"></datalist>
<div id="tip" class="tip" hidden></div>
<div id="layer"></div>

<script>
"use strict";
/* ---------- constants ---------- */
const STAGES=[{k:"Prospect",p:10},{k:"Lead In",p:20},{k:"Proposal Sent",p:40},{k:"Quotation Sent",p:60},{k:"Negotiation",p:80},{k:"Closed Won",p:100},{k:"Closed Lost",p:0}];
const OPEN=STAGES.slice(0,5).map(s=>s.k);
const STAGE_TH={"Prospect":"Prospect","Lead In":"Lead In","Proposal Sent":"ส่ง Proposal","Quotation Sent":"ส่งใบเสนอราคา","Negotiation":"ต่อรอง","Closed Won":"ปิดได้ (Won)","Closed Lost":"ไม่ได้ (Lost)"};
const TEMPS=["Hot","Warm","Cold"];
const CHANNELS=["Call","Relationship","Old Customer","Martech","Referral","Inbound","Event"];
const ACT_TYPES=["โทร","ประชุม","นำเสนองาน","ส่ง Proposal","ส่งใบเสนอราคา","อีเมล / LINE","เยี่ยมลูกค้า","อื่น ๆ"];
const MTH=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const DEFAULT_CFG={year:2026,newAcctPerMonth:2,actPerWeek:15,
  sales:[{name:"Bee",active:true,monthly:Array(12).fill(800000)},{name:"Nungning",active:true,monthly:Array(12).fill(800000)}],
  bus:["SETech","TPS","TPM","Goodtech","GGEZ","Code Play","Snaptech","SYD"],
  products:["MA","KOL","Ads","Event","Production","Campaign","CRM","PR","Live","Fandom Marketing","IP Collab","Games","Management Fee 10%","Management Fee 15%","Strategy","Seeding","Website","AI"]};
const VIEWS=[["summary","ภาพรวมผู้บริหาร"],["my","งานของฉัน"],["pipeline","Pipeline"],["accounts","ลูกค้า"],["activities","กิจกรรม"],["settings","ตั้งค่า"]];

/* ---------- state ---------- */
const S={deals:new Map(),accounts:new Map(),acts:new Map(),cfg:DEFAULT_CFG,me:"",uid:null,db:null,dl:null,
  ready:{deals:false,accounts:false,acts:false,cfg:false},noDb:false,readOnly:false,slow:false,
  view:"summary",sumOwner:"all",pipe:{mode:"board",owner:"",bu:"",temp:"",q:"",period:"open",sort:"close",dir:1},
  acc:{q:"",list:"",owner:"",status:""},act:{owner:"",range:"7"}};
try{const m=localStorage.getItem("sd.me");if(m)S.me=m;const v=localStorage.getItem("sd.pipe");if(v)Object.assign(S.pipe,JSON.parse(v));}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=v=>{const x=Number(v);return isFinite(x)?x:0};
const fmt=v=>Math.round(n(v)).toLocaleString("th-TH");
const fmtM=v=>{v=n(v);const a=Math.abs(v);if(a>=1e6)return(v/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+"M";if(a>=1e3)return Math.round(v/1e3)+"K";return fmt(v)};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const curYM=()=>today().slice(0,7);
const ymLabel=ym=>{if(!ym)return"—";const[y,m]=ym.split("-");return MTH[+m-1]+" "+String((+y+543)%100).padStart(2,"0")};
const dLabel=d=>{if(!d)return"—";const[y,m,dd]=d.split("-");return +dd+" "+MTH[+m-1]};
const addDays=(d,k)=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isOpen=d=>OPEN.includes(d.stage);
const won=d=>d.stage==="Closed Won";
const lost=d=>d.stage==="Closed Lost";
const salesNames=()=>S.cfg.sales.map(s=>s.name);
const activeSales=()=>S.cfg.sales.filter(s=>s.active).map(s=>s.name);
const allOwners=()=>{const set=new Set(salesNames());S.deals.forEach(d=>d.owner&&set.add(d.owner));S.accounts.forEach(a=>a.owner&&set.add(a.owner));return[...set]};
const ownerColor=o=>{const i=salesNames().indexOf(o);const act=S.cfg.sales[i]?.active;return act?["var(--s1)","var(--s2)","var(--s3)","var(--s4)"][i]||"var(--s-other)":"var(--s-other)"};
const ownerTag=o=>`<span class="owner"><span class="dot" style="background:${ownerColor(o)}"></span>${esc(o||"—")}</span>`;
const tempPill=t=>t?`<span class="pill t-${esc(t)}"><span class="dot"></span>${esc(t)}</span>`:"";
const stagePill=s=>`<span class="st ${s==="Closed Won"?"won":s==="Closed Lost"?"lost":""}">${esc(STAGE_TH[s]||s)}</span>`;
const accName=d=>S.accounts.get(d.accountId)?.name||d.customer||"(ไม่ระบุลูกค้า)";
const targetOf=(owner,m)=>{const ss=owner==="all"?S.cfg.sales:S.cfg.sales.filter(s=>s.name===owner);return ss.reduce((t,s)=>t+n((s.monthly||[])[m]),0)};
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

/* GP recognition: GP lands in gpMonth (defaults to close month), optionally spread over N months */
function alloc(d){const start=d.gpMonth||d.closeMonth;if(!start)return[];const k=Math.max(1,n(d.spread)||1);const out=[];let[y,m]=start.split("-").map(Number);for(let i=0;i<k;i++){out.push({ym:y+"-"+String(m).padStart(2,"0"),gp:n(d.gp)/k});m++;if(m>12){m=1;y++}}return out}
function monthly(deals,year,fn){const a=Array(12).fill(0);deals.forEach(d=>{if(!fn(d))return;alloc(d).forEach(x=>{const[y,m]=x.ym.split("-").map(Number);if(y===year)a[m-1]+=x.gp*(won(d)?1:n(d.prob)/100)})});return a}

/* ---------- metrics ---------- */
function metrics(owner){
  const Y=n(S.cfg.year),cym=curYM(),[cy,cm]=cym.split("-").map(Number);
  const curIdx=cy===Y?cm-1:(cy>Y?11:-1);
  const ds=[...S.deals.values()].filter(d=>owner==="all"||d.owner===owner);
  const wonM=monthly(ds,Y,won);
  const fcM=monthly(ds,Y,d=>isOpen(d));
  const tgtM=Array.from({length:12},(_,i)=>targetOf(owner,i));
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const ytdWon=sum(wonM.slice(0,curIdx+1)),fullWon=sum(wonM);
  const ytdTgt=sum(tgtM.slice(0,curIdx+1)),yearTgt=sum(tgtM);
  const restFc=sum(fcM.slice(Math.max(0,curIdx)));
  const open=ds.filter(isOpen);
  const openGP=open.reduce((t,d)=>t+n(d.gp),0);
  const weighted=open.reduce((t,d)=>t+n(d.gp)*n(d.prob)/100,0);
  const inYear=d=>(d.closeMonth||"").startsWith(String(Y));
  const wonY=ds.filter(d=>won(d)&&inYear(d)),lostY=ds.filter(d=>lost(d)&&inYear(d));
  const winRate=pct(wonY.length,wonY.length+lostY.length);
  const winRateV=pct(wonY.reduce((t,d)=>t+n(d.billing),0),wonY.concat(lostY).reduce((t,d)=>t+n(d.billing),0));
  const gap=Math.max(0,yearTgt-fullWon);
  const remainingOpenGP=open.filter(d=>!d.closeMonth||d.closeMonth.slice(0,4)<=String(Y)).reduce((t,d)=>t+n(d.gp),0);
  // new customers: first won deal (by close month) in year, account not flagged existing
  const firstWon=new Map();[...S.deals.values()].filter(won).forEach(d=>{const k=d.accountId||d.customer;const c=d.closeMonth||"9999";if(!firstWon.has(k)||firstWon.get(k).cm>c)firstWon.set(k,{cm:c,owner:d.owner})});
  let newAcc=0;firstWon.forEach((v,k)=>{const a=S.accounts.get(k);if(a?.existing)return;if(!v.cm.startsWith(String(Y)))return;if(owner!=="all"&&v.owner!==owner)return;newAcc++});
  const nSales=owner==="all"?activeSales().length:1;
  const newAccTgt=n(S.cfg.newAcctPerMonth)*nSales*(curIdx+1);
  const wk=addDays(today(),-6);
  const acts7=[...S.acts.values()].filter(a=>(owner==="all"||a.owner===owner)&&a.date>=wk&&a.date<=today()).length;
  const actTgt=n(S.cfg.actPerWeek)*nSales;
  const thisM=curIdx>=0?{won:wonM[curIdx],tgt:tgtM[curIdx],fc:fcM[curIdx]}:{won:0,tgt:0,fc:0};
  return{Y,curIdx,wonM,fcM,tgtM,ytdWon,fullWon,ytdTgt,yearTgt,restFc,open,openGP,weighted,winRate,winRateV,wonCount:wonY.length,lostCount:lostY.length,gap,coverage:gap>0?remainingOpenGP/gap:null,newAcc,newAccTgt,acts7,actTgt,thisM,forecastYear:fullWon+restFc,ds};
}
function flagsOf(d){const f=[],t=today(),cym=curYM();if(!isOpen(d))return f;
  if(d.closeMonth&&d.closeMonth<cym)f.push(["crit","เลยเดือนที่คาดว่าจะปิด"]);
  if(n(d.prob)<70&&!String(d.action||"").trim())f.push(["warn","โอกาส < 70% แต่ยังไม่มี Action Plan"]);
  if(d.nextDate&&d.nextDate<t)f.push(["crit","เลยวันนัดติดตาม"]);
  if(!d.nextStep&&!d.nextDate)f.push(["warn","ยังไม่มีขั้นตอนถัดไป"]);
  if(!n(d.gp))f.push(["warn","ยังไม่ใส่มูลค่า GP"]);
  const last=d.updatedAt?d.updatedAt.slice(0,10):"";if(last&&last<addDays(t,-14))f.push(["warn","ไม่มีความเคลื่อนไหว 14 วัน"]);
  return f}

async function boot(){
  renderChrome();render();
  const slow=setTimeout(()=>{S.slow=true;render()},10000);
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude?.use?window.claude.use("db"):null,window.claude?.use?window.claude.use("user"):null])}catch(e){}
  if(!db){clearTimeout(slow);S.noDb=true;Object.keys(S.ready).forEach(k=>S.ready[k]=true);render();return}
  S.db=db;
  if(user){try{S.uid=await user.id();const cw=await user.can("data.write");if(cw===false)S.readOnly=true}catch(e){}}
  window.claude.use("downloads").then(d=>{S.dl=d}).catch(()=>{});
  const done=k=>{S.ready[k]=true;if(Object.values(S.ready).every(Boolean))clearTimeout(slow)};
  const sub=(col,map,key)=>db.collection(col).onSnapshot(snap=>{map.clear();snap.docs.forEach(x=>map.set(x.id,{id:x.id,...x.data()}));if(!snap.metadata.fromCache)done(key);schedule()},err=>{done(key);console.warn(col,err);schedule()});
  sub("deals",S.deals,"deals");sub("accounts",S.accounts,"accounts");
  db.collection("activities").orderBy("date","desc").limit(1000).onSnapshot(snap=>{S.acts.clear();snap.docs.forEach(x=>S.acts.set(x.id,{id:x.id,...x.data()}));if(!snap.metadata.fromCache)done("acts");schedule()},()=>{done("acts");schedule()});
  db.doc("config/settings").onSnapshot(s=>{if(s.exists)S.cfg={...DEFAULT_CFG,...s.data()};if(!s.metadata.fromCache)done("cfg");renderChrome();schedule()},()=>{done("cfg");schedule()});
  if(S.uid){try{const p=await db.doc("data/users/"+S.uid+"/prefs").get();if(p.exists&&p.data().me&&!localStorage.getItem("sd.me")){S.me=p.data().me;renderChrome();schedule()}}catch(e){}}
}
let rq=0,pend=false;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;const ae=document.activeElement;if(S.view==="settings"&&Object.values(S.ready).every(Boolean)&&$("#main .panel")){pend=true;return}if(ae&&ae.closest&&ae.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)){pend=true;return}render()})}

function statusOf(p){return p>=100?`<span class="flag good">● ถึงเป้า</span>`:p>=80?`<span class="flag warn">▲ ใกล้เป้า</span>`:`<span class="flag crit">▼ ต่ำกว่าเป้า</span>`}

/* ---------- views: pipeline ---------- */
function pipeDeals(){const P=S.pipe,q=P.q.trim().toLowerCase(),cym=curYM(),Y=String(S.cfg.year);
  return[...S.deals.values()].filter(d=>{
    if(P.owner&&d.owner!==P.owner)return false;if(P.bu&&d.bu!==P.bu)return false;if(P.temp&&d.temp!==P.temp)return false;
    if(P.period==="open"&&!isOpen(d))return false;
    if(P.period==="month"&&d.closeMonth!==cym)return false;
    if(P.period==="quarter"){const qq=Math.floor((n(cym.slice(5))-1)/3);const m=n((d.closeMonth||"").slice(5));if(!(d.closeMonth||"").startsWith(cym.slice(0,4))||Math.floor((m-1)/3)!==qq)return false}
    if(P.period==="year"&&!(d.closeMonth||"").startsWith(Y))return false;
    if(q&&!(accName(d)+" "+(d.product||"")+" "+(d.note||"")).toLowerCase().includes(q))return false;return true})}
function vPipeline(){
  const P=S.pipe,ds=pipeDeals();
  const sel=(k,arr,all)=>`<select data-pf="${k}" aria-label="${all}"><option value="">${all}</option>${arr.map(x=>`<option ${P[k]===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
  const totGP=ds.reduce((t,d)=>t+n(d.gp),0),totW=ds.filter(isOpen).reduce((t,d)=>t+n(d.gp)*n(d.prob)/100,0);
  const head=`<div class="viewhead"><div><h1>Pipeline</h1><p>${ds.length} ดีล · GP รวม ฿${fmtM(totGP)} · ถ่วงน้ำหนัก ฿${fmtM(totW)}</p></div><div class="row"><div class="seg" role="group" aria-label="รูปแบบ"><button data-pmode="board" aria-pressed="${P.mode==="board"}">บอร์ด</button><button data-pmode="table" aria-pressed="${P.mode==="table"}">ตาราง</button></div><button class="btn" data-export="">ส่งออก CSV</button><button class="btn pri" data-newdeal="">+ ดีลใหม่</button></div></div>
  <div class="filters"><input type="search" data-pf="q" placeholder="ค้นหาลูกค้า / สินค้า" value="${esc(P.q)}" aria-label="ค้นหา">${sel("owner",allOwners(),"เซลส์ทุกคน")}${sel("bu",S.cfg.bus,"ทุกบริษัท")}${sel("temp",TEMPS,"ทุกระดับ")}
  <select data-pf="period" aria-label="ช่วงเวลา">${[["open","เฉพาะดีลเปิด"],["month","ปิดเดือนนี้"],["quarter","ปิดไตรมาสนี้"],["year","ปิดในปี "+S.cfg.year],["all","ทั้งหมด"]].map(([k,l])=>`<option value="${k}" ${P.period===k?"selected":""}>${l}</option>`).join("")}</select></div>`;
  return head+(P.mode==="board"?board(ds):table(ds));
}
function board(ds){
  const cols=S.pipe.period==="open"?OPEN:STAGES.map(s=>s.k);
  return `<div class="board">${cols.map(s=>{const c=ds.filter(d=>d.stage===s).sort((a,b)=>n(b.gp)-n(a.gp));const gp=c.reduce((t,d)=>t+n(d.gp),0);
    return `<section class="col" data-dropstage="${esc(s)}" aria-label="${esc(STAGE_TH[s])}"><div class="colh"><b>${esc(STAGE_TH[s])}</b><span class="small muted">${c.length} · ฿${fmtM(gp)}</span></div>
    ${c.slice(0,60).map(d=>{const f=flagsOf(d);return `<article class="card" draggable="${!S.readOnly}" data-deal="${esc(d.id)}" style="--owner:${ownerColor(d.owner)}"><div class="t">${esc(accName(d))}</div><div class="m"><span>${esc(d.product||"—")} · ${esc(d.bu||"")}</span><span class="num">฿${fmtM(d.gp)}</span></div><div class="m"><span>${tempPill(d.temp)} ${n(d.prob)}%</span><span>${esc(d.owner||"")} · ${ymLabel(d.closeMonth)}</span></div>${f.length?`<div class="small"><span class="flag ${f[0][0]}">${f[0][0]==="crit"?"●":"▲"} ${esc(f[0][1])}${f.length>1?` +${f.length-1}`:""}</span></div>`:""}</article>`}).join("")}
    ${c.length>60?`<p class="hint">แสดง 60 จาก ${c.length} ใช้ตัวกรองหรือมุมมองตาราง</p>`:""}${!c.length?`<p class="hint">ลากการ์ดมาวางเพื่อเปลี่ยนขั้นตอน</p>`:""}</section>`}).join("")}</div>`;
}
function table(ds){
  const P=S.pipe,key={cust:d=>accName(d),gp:d=>n(d.gp),billing:d=>n(d.billing),prob:d=>n(d.prob),close:d=>d.closeMonth||"9999",stage:d=>STAGES.findIndex(s=>s.k===d.stage),owner:d=>d.owner||"",next:d=>d.nextDate||"9999"}[P.sort]||(d=>d.closeMonth);
  ds=[...ds].sort((a,b)=>{const x=key(a),y=key(b);return(x>y?1:x<y?-1:0)*P.dir});
  const th=(k,l,r)=>`<th class="sort ${r?"r":""}" data-sort="${k}">${l}${P.sort===k?(P.dir>0?" ↑":" ↓"):""}</th>`;
  return `<div class="panel"><div class="tw"><table><thead><tr>${th("cust","ลูกค้า / สินค้า")}<th>บริษัท</th>${th("billing","Billing",1)}${th("gp","GP",1)}${th("stage","ขั้นตอน")}${th("prob","%",1)}${th("close","ปิด")}${th("owner","เซลส์")}${th("next","ขั้นตอนถัดไป")}</tr></thead><tbody>
  ${ds.map(d=>{const f=flagsOf(d);return `<tr class="click" data-deal="${esc(d.id)}"><td><div class="cname">${esc(accName(d))}</div><div class="small muted">${esc(d.product||"")} ${tempPill(d.temp)}</div></td><td class="small">${esc(d.bu||"")}</td><td class="r num">${fmt(d.billing)}</td><td class="r num">${fmt(d.gp)}</td><td>${stagePill(d.stage)}</td><td class="r num">${n(d.prob)}</td><td class="small">${ymLabel(d.closeMonth)}</td><td>${ownerTag(d.owner)}</td><td class="small" style="min-width:160px">${esc(d.nextStep||"")}${d.nextDate?` <span class="muted">(${dLabel(d.nextDate)})</span>`:""}${f.length?`<div><span class="flag ${f[0][0]}">${f[0][0]==="crit"?"●":"▲"} ${esc(f[0][1])}</span></div>`:""}</td></tr>`}).join("")||`<tr><td colspan="9" class="empty">ไม่พบดีลตามตัวกรอง</td></tr>`}
  </tbody></table></div></div>`;
}

/* ---------- views: accounts ---------- */
function accStatus(a){const ds=[...S.deals.values()].filter(d=>d.accountId===a.id);if(ds.some(won))return"ลูกค้า (เคยปิดได้)";if(ds.some(isOpen))return"มีดีลเปิด";if(ds.length)return"เคยเสนอ (ยังไม่ได้)";return a.stage==="Closed Lost"?"ไม่สนใจ":"Prospect"}

  const A=S.acc,q=A.q.trim().toLowerCase();

/* ---------- views: settings ---------- */
function vSettings(){

   <div class="fld wide"><label for="xOut">ผลที่ได้ / สิ่งที่ลูกค้าตอบ</label><input id="xOut" value="${esc(a.outcome||"")}"></div>
   <div class="fld wide" id="nextWrap"><label for="xNext">อัปเดตขั้นตอนถัดไปของดีล</label><div class="form"><input id="xNext" placeholder="ขั้นตอนถัดไป" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)"><input id="xNextD" type="date" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)" aria-label="วันนัดติดตาม"></div><span class="hint">เลือกดีลด้านบน แล้วระบบจะอัปเดตนัดติดตามของดีลนั้นให้</span></div>
   <div class="fld wide"><div class="row"><button type="submit" class="btn pri" ${S.readOnly?"disabled":""}>บันทึก</button><button type="button" class="btn" data-close="">ยกเลิก</button>${actId?`<button type="button" class="btn danger" data-delact="${esc(actId)}" style="margin-left:auto">ลบ</button>`:""}</div></div>
  </form>`;
  const fill=()=>{const ds=dealsOf($("#xAcc").value.trim());$("#xDeal").innerHTML=`<option value="">— ไม่ระบุ —</option>`+ds.map(d=>`<option value="${esc(d.id)}" ${a.dealId===d.id?"selected":""}>${esc(d.product||"ดีล")} · ${esc(STAGE_TH[d.stage])} · ฿${fmtM(d.gp)}</option>`).join("");$("#nextWrap").hidden=!$("#xDeal").value};
  $("#xAcc").onchange=fill;$("#xDeal").onchange=()=>{$("#nextWrap").hidden=!$("#xDeal").value;const d=S.deals.get($("#xDeal").value);if(d){$("#xNext").value=d.nextStep||"";$("#xNextD").value=d.nextDate||""}};fill();
  if(a.dealId){const d=S.deals.get(a.dealId);if(d){$("#xNext").value=d.nextStep||"";$("#xNextD").value=d.nextDate||""}}
  $("#actF").onsubmit=async e=>{e.preventDefault();if(S.readOnly)return;const owner=$("#xOwner").value;const accountId=await ensureAccount($("#xAcc").value,owner);
    const dId=$("#xDeal").value;
    const next={...(actId?S.acts.get(actId):{createdAt:new Date().toISOString()}),date:$("#xDate").value,time:$("#xTime").value,type:$("#xType").value,owner,accountId,account:$("#xAcc").value.trim(),dealId:dId,detail:$("#xDetail").value.trim(),outcome:$("#xOut").value.trim()};delete next.id;
    const ok=await save("activities",actId||uid("x"),stamp(next));
    if(ok&&dId){const d=S.deals.get(dId);if(d){const nd={...d,nextStep:$("#xNext").value.trim(),nextDate:$("#xNextD").value};delete nd.id;await save("deals",dId,stamp(nd))}}
    if(ok){toast("บันทึกกิจกรรมแล้ว");closeLayer()}};
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-view],[data-sumowner],[data-goowner],[data-mypick],[data-deal],[data-acc],[data-newdeal],[data-newacc],[data-newact],[data-newactacc],[data-editact],[data-delact],[data-close],[data-scrim],[data-pmode],[data-sort],[data-askdel],[data-dodel],[data-canceldel],[data-savecfg],[data-fillrow],[data-addsales],[data-transfer],[data-dotransfer],[data-export]");
  if(!t)return;const ds=t.dataset;
  if("scrim" in ds){if(e.target===t)closeLayer();return}
  if("close" in ds){closeLayer();return}
  if("view" in ds){closeLayer();if(location.hash.slice(1)===ds.view)route();else location.hash=ds.view;return}
  if("sumowner" in ds){S.sumOwner=ds.sumowner;render();return}
  if("goowner" in ds){if(activeSales().includes(ds.goowner)){S.myPick=ds.goowner;location.hash="my"}else{S.pipe.owner=ds.goowner;location.hash="pipeline"}return}
  if("mypick" in ds){S.myPick=ds.mypick;render();return}
  if("pmode" in ds){S.pipe.mode=ds.pmode;persistPipe();render();return}
  if("sort" in ds){if(S.pipe.sort===ds.sort)S.pipe.dir*=-1;else{S.pipe.sort=ds.sort;S.pipe.dir=1}persistPipe();render();return}
  if("askdel" in ds){$("#delBox").innerHTML=`<div class="confirm" style="margin-top:10px"><span>ลบดีลนี้ถาวร? ยอดที่เคยนับจะหายไปด้วย</span><button type="button" class="btn sm danger" data-dodel="${esc(ds.askdel)}">ลบเลย</button><button type="button" class="btn sm" data-canceldel="">ไม่ลบ</button></div>`;return}
  if("canceldel" in ds){$("#delBox").innerHTML="";return}
  if("dodel" in ds){if(await del("deals",ds.dodel)){toast("ลบดีลแล้ว");closeLayer()}return}
  if("delact" in ds){if(await del("activities",ds.delact)){toast("ลบกิจกรรมแล้ว");closeLayer()}return}
  if("deal" in ds&&!t.closest("form")){openLayer(()=>dealForm(ds.deal));return}
  if("acc" in ds){openLayer(()=>accForm(ds.acc));return}
  if("newdeal" in ds){const accId=ds.newdeal;openLayer(()=>dealForm(null,accId?{accountId:accId,owner:S.accounts.get(accId)?.owner||S.me}:{}));return}
  if("newacc" in ds){openLayer(()=>accForm(null));return}
  if("newact" in ds){const did=ds.newact;openLayer(()=>actForm(null,did||""));return}
  if("newactacc" in ds){openLayer(()=>actForm(null,"",ds.newactacc));return}
  if("editact" in ds){openLayer(()=>actForm(ds.editact));return}
  if("fillrow" in ds){const i=ds.fillrow,v=$(`#st${i}_0`).value;for(let j=1;j<12;j++)$(`#st${i}_${j}`).value=v;return}
  if("addsales" in ds){S.cfg={...S.cfg,sales:[...S.cfg.sales,{name:"เซลส์ใหม่",active:true,monthly:Array(12).fill(0)}]};render();toast("เพิ่มแถวแล้ว กรอกชื่อและเป้า แล้วกดบันทึก");return}
  if("savecfg" in ds){
    const sales=S.cfg.sales.map((s,i)=>({name:($(`#sn${i}`)?.value||s.name).trim(),active:$(`#sa${i}`)?.checked??s.active,monthly:MTH.map((_,j)=>n(String($(`#st${i}_${j}`)?.value).replace(/,/g,"")))})).filter(s=>s.name);
    const cfg={year:n($("#cYear").value)||S.cfg.year,newAcctPerMonth:n($("#cNew").value),actPerWeek:n($("#cAct").value),sales,bus:$("#cBus").value.split(",").map(s=>s.trim()).filter(Boolean),products:$("#cProd").value.split(",").map(s=>s.trim()).filter(Boolean)};
    if(!S.db){toast("ยังเชื่อมต่อฐานข้อมูลไม่ได้");return}
    try{await S.db.doc("config/settings").set(stamp(cfg));S.cfg={...DEFAULT_CFG,...cfg};renderChrome();render();toast("บันทึกการตั้งค่าแล้ว")}catch(err){toast("บันทึกไม่ได้ เฉพาะ MD หรือ Editor แก้การตั้งค่าได้")}return}
  if("transfer" in ds){const f=$("#trFrom").value,to=$("#trTo").value;if(!f||!to||f===to){toast("เลือกคนต้นทางและปลายทางที่ต่างกัน");return}
    const dn=[...S.deals.values()].filter(d=>d.owner===f&&isOpen(d)).length,an=[...S.accounts.values()].filter(a=>a.owner===f).length;
    $("#trConfirm").innerHTML=`<div class="confirm" style="margin-top:10px"><span>โอนดีลเปิด ${dn} ดีล และบริษัท ${an} ราย จาก ${esc(f)} ไปให้ ${esc(to)}?</span><button class="btn sm pri" data-dotransfer="${esc(f)}|${esc(to)}">ยืนยันโอน</button></div>`;return}
  if("dotransfer" in ds){const[f,to]=ds.dotransfer.split("|");let c=0;
    for(const d of[...S.deals.values()].filter(d=>d.owner===f&&isOpen(d))){const x={...d,owner:to};delete x.id;if(await save("deals",d.id,stamp(x)))c++}
    for(const a of[...S.accounts.values()].filter(a=>a.owner===f)){const x={...a,owner:to};delete x.id;if(await save("accounts",a.id,stamp(x)))c++}
    $("#trConfirm").innerHTML="";toast(`โอนแล้ว ${c} รายการ`);return}
  if("export" in ds){exportCSV();return}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.pf==="q"){S.pipe.q=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{persistPipe();render();const el=document.querySelector('[data-pf="q"]');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}
  if(t.dataset.af==="q"){S.acc.q=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{render();const el=document.querySelector('[data-af="q"]');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="meSel"){S.me=t.value;S.myPick=null;try{localStorage.setItem("sd.me",S.me)}catch(x){}if(S.db&&S.uid)S.db.doc("data/users/"+S.uid+"/prefs").set({me:S.me}).catch(()=>{});location.hash=S.me&&S.me!=="MD"?"my":"summary";route();return}
  if(t.dataset.pf&&t.dataset.pf!=="q"){S.pipe[t.dataset.pf]=t.value;persistPipe();render()}
  if(t.dataset.af&&t.dataset.af!=="q"){S.acc[t.dataset.af]=t.value;render()}
  if(t.dataset.actf){S.act[t.dataset.actf]=t.value;render()}});
function persistPipe(){try{localStorage.setItem("sd.pipe",JSON.stringify({mode:S.pipe.mode,sort:S.pipe.sort,dir:S.pipe.dir}))}catch(e){}}
/* drag & drop stage change */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".card");if(c){dragId=c.dataset.deal;e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const col=e.target.closest?.("[data-dropstage]");if(col&&dragId){e.preventDefault();document.querySelectorAll(".col.drop").forEach(x=>x!==col&&x.classList.remove("drop"));col.classList.add("drop")}});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop"))});
document.addEventListener("drop",async e=>{const col=e.target.closest?.("[data-dropstage]");if(!col||!dragId)return;e.preventDefault();const d=S.deals.get(dragId);const to=col.dataset.dropstage;dragId=null;
  if(!d||d.stage===to)return;const s=STAGES.find(x=>x.k===to);const x={...d,stage:to,prob:s.p,history:[...(d.history||[]),{at:new Date().toISOString(),from:d.stage,to}].slice(-30)};delete x.id;
  if(to==="Closed Won"&&!x.closeMonth)x.closeMonth=curYM();
  S.deals.set(d.id,{id:d.id,...x});render();if(await save("deals",d.id,stamp(x)))toast(`ย้ายไป ${STAGE_TH[to]} แล้ว`)});
/* tooltip */
document.addEventListener("mousemove",e=>{const h=e.target.closest?.("[data-tip]");const tip=$("#tip");if(!h){tip.hidden=true;return}tip.innerHTML=h.getAttribute("data-tip");tip.hidden=false;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-10);tip.style.left=x+"px";tip.style.top=y+"px"});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layerRender)closeLayer()});
/* CSV export */
async function exportCSV(){
  const ds=pipeDeals();const cols=["ลูกค้า","สินค้า","บริษัท","Billing","GP","ขั้นตอน","โอกาส%","ความร้อน","ช่องทาง","เดือนที่เข้ามา","เดือนที่คาดว่าจะปิด","เซลส์","ขั้นตอนถัดไป","วันนัด","Action Plan","หมายเหตุ"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv="﻿"+[cols.map(q).join(","),...ds.map(d=>[accName(d),d.product,d.bu,d.billing,d.gp,d.stage,d.prob,d.temp,d.channel,d.leadMonth,d.closeMonth,d.owner,d.nextStep,d.nextDate,d.action,d.note].map(q).join(","))].join("\n");
  if(!S.dl){toast("หน้านี้ส่งออกไฟล์ไม่ได้ในมุมมองนี้");return}
  try{await S.dl.save({filename:`pipeline-${today()}.csv`,data:new Blob([csv],{type:"text/csv"})})}catch(e){if(e.code!=="declined")toast("ส่งออกไม่สำเร็จ")}
}
window.addEventListener("hashchange",route);
route();boot();
</script>
