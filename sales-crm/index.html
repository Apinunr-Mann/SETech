<title>TBU Sales Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: warm cream→butter gradient ground, floating pill nav, frosted rounded cards.
   Charcoal = primary ink and "done" fills, butter yellow = highlight / in-progress, hatched = remaining. */
:root{
  --bg:#ecebe7; --bg2:#f6f1de; --bg3:#f7e7a6;
  --panel:rgba(255,255,255,.62); --panel-solid:#fbfaf6; --panel2:rgba(255,255,255,.75); --glass-line:rgba(255,255,255,.85);
  --ink:#1f1f1f; --ink2:#4f4e4a; --muted:#8a8882; --line:rgba(31,31,31,.09);
  --char:#262626; --char2:#3a3a3a; --on-char:#f6f4ee;
  --yellow:#f5cf4b; --yellow-soft:#fbeeb8; --on-yellow:#1f1f1f;
  --accent:#262626; --accent-soft:rgba(38,38,38,.08); --on-accent:#ffffff;
  --s1:#262626; --s2:#e8b81f; --s3:#8f8c84; --s4:#c2a25a; --s-other:#c9c6bd; --fc:#f5cf4b; --target:#8a8882;
  --good:#4f9a3a; --warn:#e8a317; --serious:#e07a4f; --crit:#cf4436;
  --good-ink:#3d7a2c; --crit-ink:#b23a2e; --warn-ink:#8f5f00;
  --hot:#cf4436; --warm:#e8a317; --cold:#6b8fb3;
  --hatch:repeating-linear-gradient(-45deg,rgba(31,31,31,.10) 0 2px,transparent 2px 7px);
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --r:28px; --r2:20px; --r3:14px; --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px rgba(60,50,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --bg2:#1b1a17; --bg3:#2a2414;
  --panel:rgba(38,37,34,.72); --panel-solid:#22211e; --panel2:rgba(52,50,46,.8); --glass-line:rgba(255,255,255,.06);
  --ink:#f3f1ea; --ink2:#c9c6bc; --muted:#8f8c84; --line:rgba(255,255,255,.08);
  --char:#f3f1ea; --char2:#d9d6cc; --on-char:#1b1a17;
  --yellow:#f2c838; --yellow-soft:#3d3416; --on-yellow:#1b1a17;
  --accent:#f3f1ea; --accent-soft:rgba(255,255,255,.08); --on-accent:#1b1a17;
  --s1:#f3f1ea; --s2:#f2c838; --s3:#8f8c84; --s4:#c9a85e; --s-other:#5d5a54; --fc:#b8952a; --target:#c9c6bc;
  --good-ink:#7fc46a; --crit-ink:#f08a7e; --warn-ink:#f2c050;
  --hot:#f08a7e; --warm:#f2c050; --cold:#8fb3d6;
  --hatch:repeating-linear-gradient(-45deg,rgba(255,255,255,.10) 0 2px,transparent 2px 7px);
  --shadow:0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --bg2:#1b1a17; --bg3:#2a2414;
  --panel:rgba(38,37,34,.72); --panel-solid:#22211e; --panel2:rgba(52,50,46,.8); --glass-line:rgba(255,255,255,.06);
  --ink:#f3f1ea; --ink2:#c9c6bc; --muted:#8f8c84; --line:rgba(255,255,255,.08);
  --char:#f3f1ea; --char2:#d9d6cc; --on-char:#1b1a17;
  --yellow:#f2c838; --yellow-soft:#3d3416; --on-yellow:#1b1a17;
  --accent:#f3f1ea; --accent-soft:rgba(255,255,255,.08); --on-accent:#1b1a17;
  --s1:#f3f1ea; --s2:#f2c838; --s3:#8f8c84; --s4:#c9a85e; --s-other:#5d5a54; --fc:#b8952a; --target:#c9c6bc;
  --good-ink:#7fc46a; --crit-ink:#f08a7e; --warn-ink:#f2c050;
  --hot:#f08a7e; --warm:#f2c050; --cold:#8fb3d6;
  --hatch:repeating-linear-gradient(-45deg,rgba(255,255,255,.10) 0 2px,transparent 2px 7px);
  --shadow:0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);background-image:radial-gradient(120% 90% at 100% 100%,var(--bg3) 0%,transparent 55%),linear-gradient(160deg,var(--bg) 0%,var(--bg2) 60%,var(--bg3) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:14px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:600;border:1.5px solid var(--ink);border-radius:99px;padding:6px 16px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none;background:var(--panel);border:1px solid var(--glass-line);border-radius:99px;padding:4px;width:max-content;max-width:100%;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 15px;border-radius:99px;cursor:pointer;color:var(--ink2);white-space:nowrap;font-weight:500;font-size:13px}
.tab:hover{background:var(--accent-soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--char);color:var(--on-char)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--glass-line);border-radius:99px;padding:4px 4px 4px 14px}
.who select{padding:6px 10px;border:0;border-radius:99px;background:var(--panel2);font-weight:500}
main{padding-block:18px 64px;display:flex;flex-direction:column;gap:18px}
.banner{padding:12px 18px;border-radius:var(--r2);background:var(--yellow-soft);color:var(--ink);font-size:13px}
.banner.warn{background:color-mix(in srgb,var(--warn) 22%,var(--panel-solid))}
/* panels */
.panel{background:var(--panel);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;min-width:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:6px}
.viewhead h1{font-size:40px;font-weight:400;line-height:1.1;letter-spacing:-.02em}
.viewhead p{margin:6px 0 0;color:var(--muted);font-size:13px}
/* welcome hero (summary) */
.welcome{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:end}
.welcome h1{font-size:46px;font-weight:400;line-height:1.05;letter-spacing:-.025em}
.welcome .sub{margin:8px 0 0;color:var(--muted);font-size:13px}
.bigstats{display:flex;gap:28px;flex-wrap:wrap}
.bigstat{display:flex;align-items:flex-end;gap:10px}
.bigstat .ic{width:30px;height:30px;border-radius:99px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink2);margin-bottom:6px}
.bigstat b{font-family:var(--f-display);font-size:54px;font-weight:300;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bigstat span{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.pillbar{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.pillbar .lbls,.pillbar .bars{display:flex;gap:6px;align-items:center}
.pillbar .lbls span{font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pillbar .bars i{height:40px;border-radius:99px;display:flex;align-items:center;padding:0 14px;font-style:normal;font-size:12px;font-weight:500;min-width:54px;white-space:nowrap;overflow:hidden}
.pb-done{background:var(--char);color:var(--on-char)}.pb-fc{background:var(--yellow);color:var(--on-yellow)}.pb-gap{background:var(--hatch);color:var(--ink2);border:1px solid var(--line)}.pb-over{background:transparent;border:1.5px solid var(--ink2);color:var(--ink2)}
/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--glass-line);border-radius:var(--r2);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tile .lbl{font-size:12.5px;color:var(--ink2);font-weight:500}
.tile .val{font-family:var(--f-display);font-size:38px;font-weight:300;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--char);border-color:var(--char);color:var(--on-char)}
.tile.hero .lbl,.tile.hero .sub{color:inherit;opacity:.75}
.bar{height:8px;border-radius:99px;background:var(--hatch);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--char)}
.tile.hero .bar{background:rgba(255,255,255,.12);border-color:transparent}.tile.hero .bar>i{background:var(--yellow)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.t-Hot .dot{background:var(--hot)}.t-Warm .dot{background:var(--warm)}.t-Cold .dot{background:var(--cold)}
.st{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.st.won{background:var(--char);color:var(--on-char);border-color:var(--char)}
.st.lost{color:var(--muted);text-decoration:line-through}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;white-space:nowrap}
.flag.crit{color:var(--crit-ink)}.flag.warn{color:var(--warn-ink)}.flag.good{color:var(--good-ink)}
.owner{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
/* tables */
.tw{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
.cname{font-weight:500}
.small{font-size:12px}
/* buttons, forms */
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--char);border-color:var(--char);color:var(--on-char)}
.btn.pri:hover{background:var(--char2)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:8px 14px;border:1px solid var(--glass-line);border-radius:99px;background:var(--panel);min-width:0}
.seg{display:inline-flex;border-radius:99px;overflow:hidden;background:var(--panel);border:1px solid var(--glass-line);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--ink2);border-radius:99px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--char);color:var(--on-char)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;color:var(--ink2);font-weight:500}
.fld input,.fld select,.fld textarea{padding:9px 14px;border:1px solid var(--line);border-radius:var(--r3);background:var(--panel-solid);width:100%}
.fld textarea{min-height:68px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--warn-ink)}
td select,.top select{max-width:100%}
td select{padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel-solid)}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border:1px solid var(--glass-line);border-radius:var(--r2);padding:12px;display:flex;flex-direction:column;gap:9px;min-height:140px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.col.drop{outline:2px dashed var(--yellow);outline-offset:-5px}
.colh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px 4px}
.colh b{font-family:var(--f-display);font-weight:600}
.card{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r3);padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--owner,var(--s-other))}
.card:hover{border-color:var(--ink2)}
.card .t{font-weight:600;font-size:13px;line-height:1.35}
.card .m{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main .t{font-weight:500}
.li.click{cursor:pointer}.li.click:hover .t{text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:13px}
.daygrp{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--ink2);padding:14px 0 4px;border-bottom:1px solid var(--line)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:99px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:0;border-top:2px dashed var(--target);border-radius:0}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--char);color:var(--on-char);font-size:12px;padding:8px 12px;border-radius:12px;max-width:260px;box-shadow:var(--shadow)}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .trk{height:16px;background:var(--hatch);border-radius:99px;position:relative;border:1px solid var(--line)}
.hbar .trk i{position:absolute;inset:-1px auto -1px -1px;background:var(--char);border-radius:99px;min-width:16px}
.hbar .trk i[style*="width:0%"]{display:none}
details summary{cursor:pointer;color:var(--ink2);font-size:12px;margin-top:10px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,18,12,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--panel-solid);width:min(660px,100%);height:100%;overflow-y:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) 22px;padding-top:calc(22px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-10px 0 40px rgba(0,0,0,.15);border-radius:28px 0 0 28px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh h2{font-size:24px;font-weight:500}
.x{border:1px solid var(--line);background:var(--panel2);width:36px;height:36px;border-radius:99px;font-size:18px;line-height:1;cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex:none}
.sect{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.confirm{background:color-mix(in srgb,var(--crit) 10%,var(--panel-solid));border:1px solid color-mix(in srgb,var(--crit) 35%,var(--line));border-radius:var(--r3);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--char);color:var(--on-char);padding:10px 18px;border-radius:99px;font-size:13px;z-index:70;box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lnk{border:0;background:none;padding:0;font-weight:500;cursor:pointer;color:var(--ink);text-align:left}.lnk:hover{text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px}
.fc-Commit{background:var(--char);color:var(--on-char);border-color:var(--char)}.fc-BestCase{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.ai{font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:4px;background:var(--char);color:var(--on-char);border-radius:var(--r2);padding:16px 18px}.ai h3{margin-top:8px;font-size:14px;color:var(--yellow)}.ai h3:first-child{margin-top:0}.ai p{margin:0}.ai-li{padding-left:16px;position:relative}.ai-li::before{content:"";position:absolute;left:2px;top:.65em;width:6px;height:6px;border-radius:99px;background:var(--yellow)}
@media (max-width:760px){.welcome{grid-template-columns:1fr}.welcome h1{font-size:34px}.bigstat b{font-size:40px}.viewhead h1{font-size:30px}.tile .val{font-size:30px}.brand span{display:none}.tabs{margin-left:0;width:100%}.panel{padding:18px;border-radius:22px}.tw{margin:0 -18px;padding:0 18px}.pillbar .bars i{height:34px;padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><b>TBU Sales Desk</b><span id="yearLbl">ปี 2026</span></div>
  <nav class="tabs" id="tabs" aria-label="มุมมอง"></nav>
  <div class="who"><label for="meSel">ฉันคือ</label><select id="meSel"></select></div>
</div></header>
<div class="wrap"><main id="main"><div class="empty">กำลังโหลดข้อมูลการขาย…</div></main></div>
<datalist id="acctList"></datalist><datalist id="prodList"></datalist>
<div id="tip" class="tip" hidden></div>
<div id="layer"></div>

<script>
"use strict";
/* ---------- constants ---------- */
const STAGES=[{k:"Prospect",p:10},{k:"Lead In",p:20},{k:"Proposal Sent",p:40},{k:"Quotation Sent",p:60},{k:"Negotiation",p:80},{k:"Closed Won",p:100},{k:"Closed Lost",p:0}];
const OPEN=STAGES.slice(0,5).map(s=>s.k);
const STAGE_TH={"Prospect":"Prospect","Lead In":"Lead In","Proposal Sent":"ส่ง Proposal","Quotation Sent":"ส่งใบเสนอราคา","Negotiation":"ต่อรอง","Closed Won":"ปิดได้ (Won)","Closed Lost":"ไม่ได้ (Lost)"};
const TEMPS=["Hot","Warm","Cold"];

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* GP recognition: GP lands in gpMonth (defaults to close month), optionally spread over N months */
function alloc(d){const start=d.gpMonth||d.closeMonth;if(!start)return[];const k=Math.max(1,n(d.spread)||1);const out=[];let[y,m]=start.split("-").map(Number);for(let i=0;i<k;i++){out.push({ym:y+"-"+String(m).padStart(2,"0"),gp:n(d.gp)/k});m++;if(m>12){m=1;y++}}return out}
function monthly(deals,year,fn){const a=Array(12).fill(0);deals.forEach(d=>{if(!fn(d))return;alloc(d).forEach(x=>{const[y,m]=x.ym.split("-").map(Number);if(y===year)a[m-1]+=x.gp*(won(d)?1:n(d.prob)/100)})});return a}

/* ---------- metrics ---------- */
function metrics(owner){
  const Y=n(S.cfg.year),cym=curYM(),[cy,cm]=cym.split("-").map(Number);
  const curIdx=cy===Y?cm-1:(cy>Y?11:-1);
  const ds=[...S.deals.values()].filter(d=>owner==="all"||d.owner===owner);
  const wonM=monthly(ds,Y,won);
  const fcM=monthly(ds,Y,d=>isOpen(d));
  const tgtM=Array.from({length:12},(_,i)=>targetOf(owner,i));
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const ytdWon=sum(wonM.slice(0,curIdx+1)),fullWon=sum(wonM);
  const ytdTgt=sum(tgtM.slice(0,curIdx+1)),yearTgt=sum(tgtM);
  const restFc=sum(fcM.slice(Math.max(0,curIdx)));
  const open=ds.filter(isOpen);
  const openGP=open.reduce((t,d)=>t+n(d.gp),0);
  const weighted=open.reduce((t,d)=>t+n(d.gp)*n(d.prob)/100,0);
  const inYear=d=>(d.closeMonth||"").startsWith(String(Y));
  const wonY=ds.filter(d=>won(d)&&inYear(d)),lostY=ds.filter(d=>lost(d)&&inYear(d));
  const winRate=pct(wonY.length,wonY.length+lostY.length);
  const winRateV=pct(wonY.reduce((t,d)=>t+n(d.billing),0),wonY.concat(lostY).reduce((t,d)=>t+n(d.billing),0));
  const gap=Math.max(0,yearTgt-fullWon);
  const remainingOpenGP=open.filter(d=>!d.closeMonth||d.closeMonth.slice(0,4)<=String(Y)).reduce((t,d)=>t+n(d.gp),0);
  // new customers: first won deal (by close month) in year, account not flagged existing
  const firstWon=new Map();[...S.deals.values()].filter(won).forEach(d=>{const k=d.accountId||d.customer;const c=d.closeMonth||"9999";if(!firstWon.has(k)||firstWon.get(k).cm>c)firstWon.set(k,{cm:c,owner:d.owner})});
  let newAcc=0;firstWon.forEach((v,k)=>{const a=S.accounts.get(k);if(a?.existing)return;if(!v.cm.startsWith(String(Y)))return;if(owner!=="all"&&v.owner!==owner)return;newAcc++});
  const nSales=owner==="all"?activeSales().length:1;
  const newAccTgt=n(S.cfg.newAcctPerMonth)*nSales*(curIdx+1);
  const wk=addDays(today(),-6);
  const acts7=[...S.acts.values()].filter(a=>(owner==="all"||a.owner===owner)&&a.date>=wk&&a.date<=today()).length;
  const actTgt=n(S.cfg.actPerWeek)*nSales;
  const thisM=curIdx>=0?{won:wonM[curIdx],tgt:tgtM[curIdx],fc:fcM[curIdx]}:{won:0,tgt:0,fc:0};
  return{Y,curIdx,wonM,fcM,tgtM,ytdWon,fullWon,ytdTgt,yearTgt,restFc,open,openGP,weighted,winRate,winRateV,wonCount:wonY.length,lostCount:lostY.length,gap,coverage:gap>0?remainingOpenGP/gap:null,newAcc,newAccTgt,acts7,actTgt,thisM,forecastYear:fullWon+restFc,ds};
}
function flagsOf(d){const f=[],t=today(),cym=curYM();if(!isOpen(d))return f;
  if(d.closeMonth&&d.closeMonth<cym)f.push(["crit","เลยเดือนที่คาดว่าจะปิด"]);
  if(n(d.prob)<70&&!String(d.action||"").trim())f.push(["warn","โอกาส < 70% แต่ยังไม่มี Action Plan"]);
  if(d.nextDate&&d.nextDate<t)f.push(["crit","เลยวันนัดติดตาม"]);
  if(!d.nextStep&&!d.nextDate)f.push(["warn","ยังไม่มีขั้นตอนถัดไป"]);
  if(!n(d.gp)&&d.stage!=="Prospect")f.push(["warn","ยังไม่ใส่มูลค่า GP"]);
  if(d.stageAt){const dd=Math.round((Date.now()-new Date(d.stageAt))/864e5);if(dd>21)f.push(["warn",`ค้างในขั้นนี้ ${dd} วัน`])}
  const last=d.updatedAt?d.updatedAt.slice(0,10):"";if(last&&last<addDays(t,-14))f.push(["warn","ไม่มีความเคลื่อนไหว 14 วัน"]);
  return f}

async function boot(){
  renderChrome();render();
  const slow=setTimeout(()=>{S.slow=true;render()},10000);
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude?.use?window.claude.use("db"):null,window.claude?.use?window.claude.use("user"):null])}catch(e){}
  if(!db){clearTimeout(slow);S.noDb=true;Object.keys(S.ready).forEach(k=>S.ready[k]=true);render();return}
  S.db=db;
  if(user){try{S.uid=await user.id();const cw=await user.can("data.write");if(cw===false)S.readOnly=true}catch(e){}}
  window.claude.use("downloads").then(d=>{S.dl=d}).catch(()=>{});
  const done=k=>{S.ready[k]=true;if(Object.values(S.ready).every(Boolean))clearTimeout(slow)};
  const sub=(col,map,key)=>db.collection(col).onSnapshot(snap=>{map.clear();snap.docs.forEach(x=>map.set(x.id,{id:x.id,...x.data()}));if(!snap.metadata.fromCache)done(key);schedule()},err=>{done(key);console.warn(col,err);schedule()});
  sub("deals",S.deals,"deals");sub("accounts",S.accounts,"accounts");sub("snapshots",S.snaps,"snaps");sub("coaching",S.coach,"coach");
  window.claude.use("sample").then(x=>{S.sample=x;schedule()}).catch(()=>{});
  db.collection("activities").orderBy("date","desc").limit(1000).onSnapshot(snap=>{S.acts.clear();snap.docs.forEach(x=>S.acts.set(x.id,{id:x.id,...x.data()}));if(!snap.metadata.fromCache)done("acts");schedule()},()=>{done("acts");schedule()});
  db.doc("config/settings").onSnapshot(s=>{if(s.exists)S.cfg={...DEFAULT_CFG,...s.data()};if(!s.metadata.fromCache)done("cfg");renderChrome();schedule()},()=>{done("cfg");schedule()});
  if(S.uid){try{const p=await db.doc("data/users/"+S.uid+"/prefs").get();if(p.exists&&p.data().me&&!localStorage.getItem("sd.me")){S.me=p.data().me;renderChrome();schedule()}}catch(e){}}
}
let rq=0,pend=false;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;const ae=document.activeElement;if(S.view==="settings"&&Object.values(S.ready).every(Boolean)&&$("#main .panel")){pend=true;return}if(ae&&ae.closest&&ae.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)){pend=true;return}render()})}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pend&&S.view!=="settings"){pend=false;render()}},0));
async function save(col,id,data){if(!S.db){toast("ยังเชื่อมต่อฐานข้อมูลไม่ได้ จึงบันทึกไม่ได้");return false}
  try{await S.db.collection(col).doc(id).set(data);return true}catch(e){if(e.code==="invalid_argument"&&!S.readOnly){S.readOnly=true;toast("บัญชีนี้มีสิทธิ์ดูอย่างเดียว ขอสิทธิ์ Contributor จาก MD");render()}else toast(e.code==="quota_exceeded"?"พื้นที่เก็บข้อมูลเต็ม":"บันทึกไม่สำเร็จ ลองอีกครั้ง");return false}}
async function del(col,id){try{await S.db.collection(col).doc(id).delete();return true}catch(e){toast("ลบไม่สำเร็จ");return false}}
const stamp=o=>({...o,updatedAt:new Date().toISOString(),updatedBy:S.uid||null});
async function ensureAccount(name,owner){name=String(name||"").trim();if(!name)return"";
  for(const a of S.accounts.values())if(a.name.trim().toLowerCase()===name.toLowerCase())return a.id;
  const id=uid("a");const a=stamp({name,owner:owner||S.me||"",industry:"",lists:[],stage:"Prospect",temp:"",remark:"",contacts:[],existing:false,createdAt:new Date().toISOString()});
  S.accounts.set(id,{id,...a});await save("accounts",id,a);return id}

function statusOf(p){return p>=100?`<span class="flag good">● ถึงเป้า</span>`:p>=80?`<span class="flag warn">▲ ใกล้เป้า</span>`:`<span class="flag crit">▼ ต่ำกว่าเป้า</span>`}
function monthChart(M){
  const W=720,H=240,L=46,R=8,T=12,B=26,iw=W-L-R,ih=H-T-B;
  const vals=M.tgtM.map((t,i)=>Math.max(t,M.wonM[i]+(i>=M.curIdx?M.fcM[i]:0)));
  const raw=Math.max(1,...vals)/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));const mx=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)*4;
  const y=v=>T+ih-(v/mx)*ih,bw=iw/12,w=Math.min(28,bw*.56);
  let g="";for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtM(v)}</text>`}
  let bars="",tline="",hits="";
  M.tgtM.forEach((t,i)=>{const cx=L+bw*i+bw/2,x=cx-w/2;const wv=Math.max(0,M.wonM[i]),fv=i>=M.curIdx?M.fcM[i]:0;
    if(wv>0)bars+=`<path d="${rbar(x,y(wv),w,y(0)-y(wv),fv>0?0:4)}" fill="var(--s1)"/>`;
    if(fv>0){const top=y(wv+fv),bot=y(wv)-(wv>0?2:0);bars+=`<path d="${rbar(x,top,w,Math.max(0,bot-top),4)}" fill="var(--fc)"/>`}
    tline+=`${i?"L":"M"}${L+bw*i+2} ${y(t)} L${L+bw*(i+1)-2} ${y(t)}`;
    const tip=`<b>${MTH[i]} ${M.Y+543}</b><br>เป้า ฿${fmt(t)}<br>ปิดได้ ฿${fmt(wv)} (${pct(wv,t)}%)${fv?`<br>คาดการณ์ +฿${fmt(fv)}`:""}`;
    hits+=`<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"/>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" ${i===M.curIdx?'style="fill:var(--ink);font-weight:600"':""}>${MTH[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="GP รายเดือนเทียบเป้า">${g}${bars}<path d="${tline}" fill="none" stroke="var(--target)" stroke-width="2" stroke-dasharray="5 4"/>${hits}</svg>`;
}
function rbar(x,y,w,h,r){if(h<=0)return"";r=Math.min(r,h,w/2);return`M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`}
function quarterPanel(M){
  const q=[0,1,2,3].map(i=>{const s=a=>a.slice(i*3,i*3+3).reduce((x,y)=>x+y,0);return{t:s(M.tgtM),w:s(M.wonM),f:s(M.fcM)}});
  return `<div class="panel"><div class="ph"><h2>รายไตรมาส</h2></div><div class="tiles">${q.map((x,i)=>{const p=pct(x.w,x.t);return`<div class="tile"><span class="lbl">Q${i+1}</span><span class="val">${p}%</span><span class="sub">฿${fmtM(x.w)} / ฿${fmtM(x.t)}${x.f?` · คาดการณ์ +฿${fmtM(x.f)}`:""}</span><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>=100?"var(--good)":p>=80?"var(--warn)":"var(--crit)"}"></i></div></div>`}).join("")}</div></div>`;

function scorecard(){

function funnelPanel(M){

/* ---------- views: pipeline ---------- */
function pipeDeals(){const P=S.pipe,q=P.q.trim().toLowerCase(),cym=curYM(),Y=String(S.cfg.year);
  return[...S.deals.values()].filter(d=>{
    if(P.owner&&d.owner!==P.owner)return false;if(P.bu&&d.bu!==P.bu)return false;if(P.temp&&d.temp!==P.temp)return false;
    if(P.period==="open"&&!isOpen(d))return false;
    if(P.period==="month"&&d.closeMonth!==cym)return false;
    if(P.period==="quarter"){const qq=Math.floor((n(cym.slice(5))-1)/3);const m=n((d.closeMonth||"").slice(5));if(!(d.closeMonth||"").startsWith(cym.slice(0,4))||Math.floor((m-1)/3)!==qq)return false}
    if(P.period==="year"&&!(d.closeMonth||"").startsWith(Y))return false;
    if(q&&!(accName(d)+" "+(d.product||"")+" "+(d.note||"")).toLowerCase().includes(q))return false;return true})}
function vPipeline(){
  const P=S.pipe,ds=pipeDeals();
  const sel=(k,arr,all)=>`<select data-pf="${k}" aria-label="${all}"><option value="">${all}</option>${arr.map(x=>`<option ${P[k]===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
  const totGP=ds.reduce((t,d)=>t+n(d.gp),0),totW=ds.filter(isOpen).reduce((t,d)=>t+n(d.gp)*n(d.prob)/100,0);
  const head=`<div class="viewhead"><div><h1>Pipeline</h1><p>${ds.length} ดีล · GP รวม ฿${fmtM(totGP)} · ถ่วงน้ำหนัก ฿${fmtM(totW)}</p></div><div class="row"><div class="seg" role="group" aria-label="รูปแบบ"><button data-pmode="board" aria-pressed="${P.mode==="board"}">บอร์ด</button><button data-pmode="table" aria-pressed="${P.mode==="table"}">ตาราง</button></div><button class="btn" data-export="">ส่งออก CSV</button><button class="btn pri" data-newdeal="">+ ดีลใหม่</button></div></div>
  <div class="filters"><input type="search" data-pf="q" placeholder="ค้นหาลูกค้า / สินค้า" value="${esc(P.q)}" aria-label="ค้นหา">${sel("owner",allOwners(),"เซลส์ทุกคน")}${sel("bu",S.cfg.bus,"ทุกบริษัท")}${sel("temp",TEMPS,"ทุกระดับ")}
  <select data-pf="period" aria-label="ช่วงเวลา">${[["open","เฉพาะดีลเปิด"],["month","ปิดเดือนนี้"],["quarter","ปิดไตรมาสนี้"],["year","ปิดในปี "+S.cfg.year],["all","ทั้งหมด"]].map(([k,l])=>`<option value="${k}" ${P.period===k?"selected":""}>${l}</option>`).join("")}</select></div>`;
  return head+(P.mode==="board"?board(ds):table(ds));
}
function board(ds){
  const cols=S.pipe.period==="open"?OPEN:STAGES.map(s=>s.k);
  return `<div class="board">${cols.map(s=>{const c=ds.filter(d=>d.stage===s).sort((a,b)=>n(b.gp)-n(a.gp));const gp=c.reduce((t,d)=>t+n(d.gp),0);

/* ---------- SPM: forecast categories, capacity, conversion, coaching ---------- */
const FCATS=["Commit","Best Case","Pipeline","Omitted"];
const FCAT_TH={"Commit":"Commit · มั่นใจปิดได้","Best Case":"Best Case · ลุ้นได้","Pipeline":"Pipeline · ยังไม่แน่","Omitted":"ไม่นับเดือนนี้"};
const fcatOf=d=>d.fcat||(n(d.prob)>=80?"Commit":n(d.prob)>=50?"Best Case":"Pipeline");
const fcatPill=d=>{const c=fcatOf(d);if(c==="Pipeline"&&!d.fcat)return"";return `<span class="pill small fc-${c.replace(/\s/g,"")}" title="${d.fcat?"เซลส์ยืนยันแล้ว":"ตั้งจาก % โอกาส ยังไม่ได้ยืนยัน"}">${esc(c)}${d.fcat?"":" ?"}</span>`};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function weekStart(d){const x=new Date((d||today())+"T00:00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return ld(x)}
function monthDiff(a,b){if(!a||!b)return null;const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return(by-ay)*12+(bm-am)}
const gpSum=a=>a.reduce((t,d)=>t+n(d.gp),0);
function ownerDeals(o){return[...S.deals.values()].filter(d=>o==="all"||d.owner===o)}
function rates(owner){
  const Y=String(S.cfg.year);const pick=o=>ownerDeals(o).filter(d=>(won(d)||lost(d))&&(d.closeMonth||"").startsWith(Y));
  let c=pick(owner),fb=false;if(owner!=="all"&&c.filter(won).length<3){c=pick("all");fb=true}
  const w=c.filter(won),wGP=gpSum(w),lGP=gpSum(c.filter(lost));
  const cyc=w.map(d=>monthDiff(d.leadMonth,d.closeMonth)).filter(x=>x!=null&&x>=0);
  return{winV:Math.max(.1,(wGP+lGP)?wGP/(wGP+lGP):.25),winC:c.length?w.length/c.length:0,avgGP:w.length?wGP/w.length:500000,cycleM:cyc.length?cyc.reduce((a,b)=>a+b,0)/cyc.length:null,fb,n:c.length}}
function capacity(owner){
  const M=metrics(owner),R=rates(owner),cym=curYM(),Y=String(M.Y),yEnd=Y+"-12";
  const open=ownerDeals(owner).filter(d=>isOpen(d)&&fcatOf(d)!=="Omitted");
  const mGap=Math.max(0,M.thisM.tgt-M.thisM.won),mPipe=gpSum(open.filter(d=>d.closeMonth===cym)),mNeed=mGap/R.winV;
  const yPipe=gpSum(open.filter(d=>!d.closeMonth||d.closeMonth<=yEnd)),yNeed=M.gap/R.winV,short=Math.max(0,yNeed-yPipe);
  const deals=Math.ceil(short/Math.max(1,R.avgGP)),weeks=Math.max(1,Math.ceil(daysBetween(today(),Y+"-12-31")/7));
  return{M,R,mGap,mPipe,mNeed,mShort:Math.max(0,mNeed-mPipe),yGap:M.gap,yPipe,yNeed,short,deals,weeks,perWeek:deals/weeks}}
function fcSum(owner,month){
  const ds=ownerDeals(owner);let w=0;ds.filter(won).forEach(d=>alloc(d).forEach(x=>{if(x.ym===month)w+=x.gp}));
  const r={won:w,"Commit":0,"Best Case":0,"Pipeline":0,"Omitted":0,weighted:w,unconfirmed:0};
  ds.filter(d=>isOpen(d)&&d.closeMonth===month).forEach(d=>{const c=fcatOf(d);r[c]+=n(d.gp);if(!d.fcat)r.unconfirmed++;if(c!=="Omitted")r.weighted+=n(d.gp)*n(d.prob)/100});
  r.call=w+r["Commit"];r.upside=r.call+r["Best Case"];r.target=month.startsWith(String(S.cfg.year))?targetOf(owner,n(month.slice(5))-1):0;return r}
function reachIdx(d){const idx=s=>STAGES.findIndex(x=>x.k===s);if(won(d))return 9;
  const h=Math.max(-1,...(d.history||[]).map(x=>idx(x.to)).filter(i=>i>=0&&i<5));
  if(isOpen(d))return Math.max(idx(d.stage),h);if(d.lostStage&&idx(d.lostStage)>=0)return idx(d.lostStage);return h>=0?h:null}
function conv(owner){
  const Y=String(S.cfg.year),ds=ownerDeals(owner).filter(d=>(d.leadMonth||"").startsWith(Y));
  const known=ds.map(reachIdx).filter(x=>x!=null);const p=k=>known.length?known.filter(x=>x>=k).length/known.length:0;
  const closed=ds.filter(d=>won(d)||lost(d));const now=today();
  const open=ownerDeals(owner).filter(isOpen).map(d=>daysBetween((d.stageAt||d.createdAt||now).slice(0,10),now));
  const stay={};ownerDeals(owner).forEach(d=>{const h=d.history||[];for(let i=1;i<h.length;i++){const s=h[i].from;if(!s||!OPEN.includes(s))continue;(stay[s]=stay[s]||[]).push(daysBetween(h[i-1].at,h[i].at))}});
  return{n:ds.length,known:known.length,p2:p(2),p3:p(3),win:closed.length?closed.filter(won).length/closed.length:0,R:rates(owner),
    age:open.length?open.reduce((a,b)=>a+b,0)/open.length:0,stuck:open.filter(x=>x>21).length,stay}}

/* forecast view */
function vForecast(){
  const Y=n(S.cfg.year),cym=curYM(),mon=S.fcMonth||cym;
  const months=[];for(let m=1;m<=12;m++)months.push(Y+"-"+String(m).padStart(2,"0"));[1,2].forEach(k=>{const[y,m]=cym.split("-").map(Number);const d=new Date(y,m-1+k,1);months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))});
  const reps=activeSales(),rows=[...reps.map(o=>[o,fcSum(o,mon)]),["all",fcSum("all",mon)]];
  const wk=weekStart(),snap=S.snaps.get(wk);
  const cell=v=>`<td class="r num">${fmtM(v)}</td>`;
  const fcTable=`<div class="tw"><table><thead><tr><th>เซลส์</th><th class="r">เป้า</th><th class="r">ปิดแล้ว</th><th class="r">Commit</th><th class="r">Call<br><span class="muted">ปิดแล้ว+Commit</span></th><th class="r">% เป้า</th><th class="r">Best Case</th><th class="r">Upside</th><th class="r">Pipeline</th><th class="r">ระบบถ่วงน้ำหนัก</th><th class="r">ขาดจาก Call</th></tr></thead><tbody>

  const open=[...S.deals.values()].filter(d=>isOpen(d)&&d.closeMonth===mon).sort((a,b)=>(a.owner||"").localeCompare(b.owner||"")||FCATS.indexOf(fcatOf(a))-FCATS.indexOf(fcatOf(b))||n(b.gp)-n(a.gp));

   <div class="fld"><label for="aInd">อุตสาหกรรม</label><input id="aInd" value="${esc(a.industry||"")}" placeholder="FMCG, Restaurant, Banking…"></div>
   <div class="fld"><label for="aOwner">เซลส์ผู้ดูแล</label><select id="aOwner">${allOwners().map(o=>`<option ${a.owner===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
   <div class="fld"><label for="aLists">อยู่ในรายชื่อเป้าหมาย</label><input id="aLists" value="${esc((a.lists||[]).join(", "))}" placeholder="เช่น IP-GGEZ, Fandom-SETech"></div>
   <div class="fld"><label for="aEx">ประเภท</label><select id="aEx"><option value="0" ${!a.existing?"selected":""}>ลูกค้าใหม่ / เป้าหมาย</option><option value="1" ${a.existing?"selected":""}>ลูกค้าเก่า (เคยใช้บริการก่อนปีนี้)</option></select></div>
   <div class="fld wide"><label for="aRem">หมายเหตุ / Insight</label><textarea id="aRem">${esc(a.remark||"")}</textarea></div>
   <div class="fld wide"><label>ผู้ติดต่อ</label><div id="cList" class="list">${C.map((c,i)=>`<div class="form" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="fld"><input id="cn${i}" value="${esc(c.name||"")}" placeholder="ชื่อ" aria-label="ชื่อผู้ติดต่อ"></div><div class="fld"><input id="cr${i}" value="${esc(c.role||"")}" placeholder="ตำแหน่ง" aria-label="ตำแหน่ง"></div><div class="fld"><input id="ct${i}" value="${esc(c.tel||"")}" placeholder="โทร" aria-label="โทร"></div><div class="fld"><input id="ce${i}" value="${esc(c.email||"")}" placeholder="อีเมล" aria-label="อีเมล"></div><div class="fld"><button type="button" class="btn sm danger" data-rmcontact="${i}">ลบ</button></div></div>`).join("")}</div><button type="button" class="btn sm" data-addcontact="" style="align-self:flex-start">+ เพิ่มผู้ติดต่อ</button></div>
   <div class="fld wide"><div class="row"><button type="submit" class="btn pri" ${S.readOnly?"disabled":""}>${id?"บันทึก":"เพิ่มบริษัท"}</button><button type="button" class="btn" data-close="">ยกเลิก</button>${id?`<button type="button" class="btn" data-newdeal="${esc(id)}">+ ดีลใหม่</button><button type="button" class="btn" data-newactacc="${esc(id)}">+ บันทึกกิจกรรม</button>`:""}</div></div>
  </form>
  ${id?`<div class="sect"><h3>ดีลทั้งหมด</h3><div class="list">${ds.map(d=>`<div class="li click" data-deal="${esc(d.id)}"><div class="main"><div class="t">${esc(d.product||"—")} <span class="muted small">${esc(d.bu||"")}</span></div><div class="small muted">${ymLabel(d.closeMonth)} · ${esc(d.owner||"")}</div></div><div style="text-align:right">${stagePill(d.stage)}<div class="num small">฿${fmtM(d.gp)}</div></div></div>`).join("")||`<div class="hint">ยังไม่มีดีล</div>`}</div></div>
  <div class="sect"><h3>กิจกรรมล่าสุด</h3><div class="list">${acts.map(actRow).join("")||`<div class="hint">ยังไม่มีกิจกรรม</div>`}</div></div>`:""}`;
  const readC=()=>C.map((c,i)=>({name:$("#cn"+i).value.trim(),role:$("#cr"+i).value.trim(),tel:$("#ct"+i).value.trim(),email:$("#ce"+i).value.trim()}));
  dr.querySelector("[data-addcontact]").onclick=()=>{draftC=[...readC(),{name:"",role:"",tel:"",email:""}];snapshotAcc();accForm(id);restoreAcc()};
  dr.querySelectorAll("[data-rmcontact]").forEach(b=>b.onclick=()=>{const arr=readC();arr.splice(+b.dataset.rmcontact,1);draftC=arr;snapshotAcc();accForm(id);restoreAcc()});
  $("#accF").onsubmit=async e=>{e.preventDefault();if(S.readOnly)return;const name=$("#aName").value.trim();if(!name)return;
    const next={...(id?S.accounts.get(id):{createdAt:new Date().toISOString(),stage:"Prospect",temp:""}),name,industry:$("#aInd").value.trim(),owner:$("#aOwner").value,lists:$("#aLists").value.split(",").map(s=>s.trim()).filter(Boolean),existing:$("#aEx").value==="1",remark:$("#aRem").value.trim(),contacts:readC().filter(c=>c.name||c.tel||c.email)};
    delete next.id;const aid=id||uid("a");if(await save("accounts",aid,stamp(next))){toast("บันทึกบริษัทแล้ว");closeLayer()}};
}
let accSnap=null,draftC=null;
function snapshotAcc(){accSnap={};["aName","aInd","aOwner","aLists","aEx","aRem"].forEach(k=>accSnap[k]=$("#"+k)?.value)}
function restoreAcc(){if(!accSnap)return;Object.entries(accSnap).forEach(([k,v])=>{const el=$("#"+k);if(el&&v!=null)el.value=v});accSnap=null}
function actForm(actId,dealId,accId){
  const a=actId?S.acts.get(actId):{date:today(),time:new Date().toTimeString().slice(0,5),type:"โทร",owner:activeSales().includes(S.me)?S.me:activeSales()[0]||"",dealId:dealId||"",accountId:accId||(dealId?S.deals.get(dealId)?.accountId:"")||""};
  if(!a){closeLayer();return}
  const acc=S.accounts.get(a.accountId);
  const dealsOf=nm=>{const ac=[...S.accounts.values()].find(x=>x.name===nm);return ac?[...S.deals.values()].filter(d=>d.accountId===ac.id&&(isOpen(d)||d.id===a.dealId)):[]};
  const dr=$("#drawer");
  dr.innerHTML=`<div class="dh"><h2>${actId?"แก้ไขกิจกรรม":"บันทึกกิจกรรม"}</h2><button class="x" data-close="" aria-label="ปิด">×</button></div>
  <form id="actF" class="form" autocomplete="off">
   <div class="fld"><label for="xDate">วันที่</label><input id="xDate" type="date" required value="${esc(a.date)}"></div>
   <div class="fld"><label for="xTime">เวลา</label><input id="xTime" type="time" value="${esc(a.time||"")}"></div>
   <div class="fld"><label for="xType">ประเภท</label><select id="xType">${ACT_TYPES.map(t=>`<option ${a.type===t?"selected":""}>${t}</option>`).join("")}</select></div>
   <div class="fld"><label for="xOwner">เซลส์</label><select id="xOwner">${allOwners().map(o=>`<option ${a.owner===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
   <div class="fld wide"><label for="xAcc">ลูกค้า</label><input id="xAcc" list="acctList" required value="${esc(acc?.name||a.account||"")}" placeholder="พิมพ์ชื่อบริษัท"></div>
   <div class="fld wide"><label for="xDeal">เกี่ยวกับดีล (ถ้ามี)</label><select id="xDeal"></select></div>
   <div class="fld wide"><label for="xDetail">ทำอะไรไป</label><textarea id="xDetail" required placeholder="เช่น โทรคุยกับคุณแบม เรื่องแผน MKT ปีหน้า">${esc(a.detail||"")}</textarea></div>
   <div class="fld wide"><label for="xOut">ผลที่ได้ / สิ่งที่ลูกค้าตอบ</label><input id="xOut" value="${esc(a.outcome||"")}"></div>
   <div class="fld wide" id="nextWrap"><label for="xNext">อัปเดตขั้นตอนถัดไปของดีล</label><div class="form"><input id="xNext" placeholder="ขั้นตอนถัดไป" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)"><input id="xNextD" type="date" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)" aria-label="วันนัดติดตาม"></div><span class="hint">เลือกดีลด้านบน แล้วระบบจะอัปเดตนัดติดตามของดีลนั้นให้</span></div>
   <div class="fld wide"><div class="row"><button type="submit" class="btn pri" ${S.readOnly?"disabled":""}>บันทึก</button><button type="button" class="btn" data-close="">ยกเลิก</button>${actId?`<button type="button" class="btn danger" data-delact="${esc(actId)}" style="margin-left:auto">ลบ</button>`:""}</div></div>
  </form>`;
  const fill=()=>{const ds=dealsOf($("#xAcc").value.trim());$("#xDeal").innerHTML=`<option value="">— ไม่ระบุ —</option>`+ds.map(d=>`<option value="${esc(d.id)}" ${a.dealId===d.id?"selected":""}>${esc(d.product||"ดีล")} · ${esc(STAGE_TH[d.stage])} · ฿${fmtM(d.gp)}</option>`).join("");$("#nextWrap").hidden=!$("#xDeal").value};
  $("#xAcc").onchange=fill;$("#xDeal").onchange=()=>{$("#nextWrap").hidden=!$("#xDeal").value;const d=S.deals.get($("#xDeal").value);if(d){$("#xNext").value=d.nextStep||"";$("#xNextD").value=d.nextDate||""}};fill();
  if(a.dealId){const d=S.deals.get(a.dealId);if(d){$("#xNext").value=d.nextStep||"";$("#xNextD").value=d.nextDate||""}}
  $("#actF").onsubmit=async e=>{e.preventDefault();if(S.readOnly)return;const owner=$("#xOwner").value;const accountId=await ensureAccount($("#xAcc").value,owner);
    const dId=$("#xDeal").value;
    const next={...(actId?S.acts.get(actId):{createdAt:new Date().toISOString()}),date:$("#xDate").value,time:$("#xTime").value,type:$("#xType").value,owner,accountId,account:$("#xAcc").value.trim(),dealId:dId,detail:$("#xDetail").value.trim(),outcome:$("#xOut").value.trim()};delete next.id;
    const ok=await save("activities",actId||uid("x"),stamp(next));
    if(ok&&dId){const d=S.deals.get(dId);if(d){const nd={...d,nextStep:$("#xNext").value.trim(),nextDate:$("#xNextD").value};delete nd.id;await save("deals",dId,stamp(nd))}}
    if(ok){toast("บันทึกกิจกรรมแล้ว");closeLayer()}};
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-view],[data-sumowner],[data-goowner],[data-mypick],[data-deal],[data-acc],[data-newdeal],[data-newacc],[data-newact],[data-newactacc],[data-editact],[data-delact],[data-close],[data-scrim],[data-pmode],[data-sort],[data-askdel],[data-dodel],[data-canceldel],[data-savecfg],[data-fillrow],[data-addsales],[data-transfer],[data-dotransfer],[data-export],[data-snap],[data-coachrep],[data-newcoach],[data-editcoach],[data-aicoach],[data-aiuse],[data-askdelcoach],[data-dodelcoach]");
  if(!t)return;const ds=t.dataset;
  if("scrim" in ds){if(e.target===t)closeLayer();return}
  if("close" in ds){closeLayer();return}
  if("view" in ds){closeLayer();if(location.hash.slice(1)===ds.view)route();else location.hash=ds.view;return}
  if("sumowner" in ds){S.sumOwner=ds.sumowner;render();return}
  if("goowner" in ds){if(activeSales().includes(ds.goowner)){S.myPick=ds.goowner;location.hash="my"}else{S.pipe.owner=ds.goowner;location.hash="pipeline"}return}
  if("mypick" in ds){S.myPick=ds.mypick;render();return}
  if("pmode" in ds){S.pipe.mode=ds.pmode;persistPipe();render();return}
  if("sort" in ds){if(S.pipe.sort===ds.sort)S.pipe.dir*=-1;else{S.pipe.sort=ds.sort;S.pipe.dir=1}persistPipe();render();return}
  if("askdel" in ds){$("#delBox").innerHTML=`<div class="confirm" style="margin-top:10px"><span>ลบดีลนี้ถาวร? ยอดที่เคยนับจะหายไปด้วย</span><button type="button" class="btn sm danger" data-dodel="${esc(ds.askdel)}">ลบเลย</button><button type="button" class="btn sm" data-canceldel="">ไม่ลบ</button></div>`;return}
  if("canceldel" in ds){$("#delBox").innerHTML="";return}
  if("dodel" in ds){if(await del("deals",ds.dodel)){toast("ลบดีลแล้ว");closeLayer()}return}
  if("delact" in ds){if(await del("activities",ds.delact)){toast("ลบกิจกรรมแล้ว");closeLayer()}return}
  if("deal" in ds&&!t.closest("form")){openLayer(()=>dealForm(ds.deal));return}
  if("acc" in ds){openLayer(()=>accForm(ds.acc));return}
  if("newdeal" in ds){const accId=ds.newdeal;openLayer(()=>dealForm(null,accId?{accountId:accId,owner:S.accounts.get(accId)?.owner||S.me}:{}));return}
  if("newacc" in ds){openLayer(()=>accForm(null));return}
  if("newact" in ds){const did=ds.newact;openLayer(()=>actForm(null,did||""));return}
  if("newactacc" in ds){openLayer(()=>actForm(null,"",ds.newactacc));return}
  if("editact" in ds){openLayer(()=>actForm(ds.editact));return}
  if("fillrow" in ds){const i=ds.fillrow,v=$(`#st${i}_0`).value;for(let j=1;j<12;j++)$(`#st${i}_${j}`).value=v;return}
  if("addsales" in ds){S.cfg={...S.cfg,sales:[...S.cfg.sales,{name:"เซลส์ใหม่",active:true,monthly:Array(12).fill(0)}]};render();toast("เพิ่มแถวแล้ว กรอกชื่อและเป้า แล้วกดบันทึก");return}
  if("savecfg" in ds){
    const sales=S.cfg.sales.map((s,i)=>({name:($(`#sn${i}`)?.value||s.name).trim(),active:$(`#sa${i}`)?.checked??s.active,monthly:MTH.map((_,j)=>n(String($(`#st${i}_${j}`)?.value).replace(/,/g,"")))})).filter(s=>s.name);
    const cfg={year:n($("#cYear").value)||S.cfg.year,newAcctPerMonth:n($("#cNew").value),actPerWeek:n($("#cAct").value),sales,bus:$("#cBus").value.split(",").map(s=>s.trim()).filter(Boolean),products:$("#cProd").value.split(",").map(s=>s.trim()).filter(Boolean)};
    if(!S.db){toast("ยังเชื่อมต่อฐานข้อมูลไม่ได้");return}
    try{await S.db.doc("config/settings").set(stamp(cfg));S.cfg={...DEFAULT_CFG,...cfg};renderChrome();render();toast("บันทึกการตั้งค่าแล้ว")}catch(err){toast("บันทึกไม่ได้ เฉพาะ MD หรือ Editor แก้การตั้งค่าได้")}return}
  if("transfer" in ds){const f=$("#trFrom").value,to=$("#trTo").value;if(!f||!to||f===to){toast("เลือกคนต้นทางและปลายทางที่ต่างกัน");return}
    const dn=[...S.deals.values()].filter(d=>d.owner===f&&isOpen(d)).length,an=[...S.accounts.values()].filter(a=>a.owner===f).length;
    $("#trConfirm").innerHTML=`<div class="confirm" style="margin-top:10px"><span>โอนดีลเปิด ${dn} ดีล และบริษัท ${an} ราย จาก ${esc(f)} ไปให้ ${esc(to)}?</span><button class="btn sm pri" data-dotransfer="${esc(f)}|${esc(to)}">ยืนยันโอน</button></div>`;return}
  if("dotransfer" in ds){const[f,to]=ds.dotransfer.split("|");let c=0;
    for(const d of[...S.deals.values()].filter(d=>d.owner===f&&isOpen(d))){const x={...d,owner:to};delete x.id;if(await save("deals",d.id,stamp(x)))c++}
    for(const a of[...S.accounts.values()].filter(a=>a.owner===f)){const x={...a,owner:to};delete x.id;if(await save("accounts",a.id,stamp(x)))c++}
    $("#trConfirm").innerHTML="";toast(`โอนแล้ว ${c} รายการ`);return}
  if("export" in ds){exportCSV();return}
  if("snap" in ds){takeSnapshot(false);return}
  if("coachrep" in ds){S.coachRep=ds.coachrep;render();return}
  if("newcoach" in ds){const r=ds.newcoach;openLayer(()=>coachForm(null,{rep:r}));return}
  if("editcoach" in ds){openLayer(()=>coachForm(ds.editcoach));return}
  if("aicoach" in ds){aiCoach(ds.aicoach);return}
  if("aiuse" in ds){const r=ds.aiuse,txt=(S.ai[r]||{}).text||"";openLayer(()=>coachForm(null,{rep:r,notes:"[สรุปจาก AI ก่อนคุย]\n"+txt+"\n\n[สิ่งที่คุยจริง]\n"}));return}
  if("askdelcoach" in ds){$("#delBox").innerHTML=`<div class="confirm" style="margin-top:10px"><span>ลบบันทึก 1:1 นี้ถาวร?</span><button type="button" class="btn sm danger" data-dodelcoach="${esc(ds.askdelcoach)}">ลบเลย</button><button type="button" class="btn sm" data-canceldel="">ไม่ลบ</button></div>`;return}
  if("dodelcoach" in ds){if(await del("coaching",ds.dodelcoach)){toast("ลบบันทึกแล้ว");closeLayer()}return}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.pf==="q"){S.pipe.q=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{persistPipe();render();const el=document.querySelector('[data-pf="q"]');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}
  if(t.dataset.af==="q"){S.acc.q=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{render();const el=document.querySelector('[data-af="q"]');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="meSel"){S.me=t.value;S.myPick=null;try{localStorage.setItem("sd.me",S.me)}catch(x){}if(S.db&&S.uid)S.db.doc("data/users/"+S.uid+"/prefs").set({me:S.me}).catch(()=>{});location.hash=S.me&&S.me!=="MD"?"my":"summary";route();return}
  if(t.dataset.pf&&t.dataset.pf!=="q"){S.pipe[t.dataset.pf]=t.value;persistPipe();render()}
  if(t.dataset.af&&t.dataset.af!=="q"){S.acc[t.dataset.af]=t.value;render()}
  if(t.dataset.actf){S.act[t.dataset.actf]=t.value;render()}
  if("fcmonth" in t.dataset){S.fcMonth=t.value;render()}
  if(t.dataset.fcatsel){const d=S.deals.get(t.dataset.fcatsel);if(d){const x={...d,fcat:t.value};delete x.id;S.deals.set(d.id,{id:d.id,...x});save("deals",d.id,stamp(x)).then(ok=>{if(ok)toast("อัปเดตหมวด Forecast แล้ว")});pend=false;render()}}
  if(t.dataset.acttoggle){const[sid,i]=t.dataset.acttoggle.split("|");const sDoc=S.coach.get(sid);if(sDoc){const acts=(sDoc.actions||[]).map((a,j)=>j===+i?{...a,done:t.checked}:a);const x={...sDoc,actions:acts};delete x.id;S.coach.set(sid,{id:sid,...x});save("coaching",sid,stamp(x)).then(ok=>{if(ok)toast("อัปเดตข้อตกลงแล้ว")});pend=false;setTimeout(render,300)}}});
function persistPipe(){try{localStorage.setItem("sd.pipe",JSON.stringify({mode:S.pipe.mode,sort:S.pipe.sort,dir:S.pipe.dir}))}catch(e){}}
/* drag & drop stage change */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".card");if(c){dragId=c.dataset.deal;e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const col=e.target.closest?.("[data-dropstage]");if(col&&dragId){e.preventDefault();document.querySelectorAll(".col.drop").forEach(x=>x!==col&&x.classList.remove("drop"));col.classList.add("drop")}});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop"))});
document.addEventListener("drop",async e=>{const col=e.target.closest?.("[data-dropstage]");if(!col||!dragId)return;e.preventDefault();const d=S.deals.get(dragId);const to=col.dataset.dropstage;dragId=null;
  if(!d||d.stage===to)return;const s=STAGES.find(x=>x.k===to);const x={...d,stage:to,prob:s.p,history:[...(d.history||[]),{at:new Date().toISOString(),from:d.stage,to}].slice(-30)};delete x.id;
  x.stageAt=new Date().toISOString();if(to==="Closed Lost"&&OPEN.includes(d.stage))x.lostStage=d.stage;
  if(to==="Closed Won"&&!x.closeMonth)x.closeMonth=curYM();
  S.deals.set(d.id,{id:d.id,...x});render();if(await save("deals",d.id,stamp(x)))toast(`ย้ายไป ${STAGE_TH[to]} แล้ว`)});
/* tooltip */
document.addEventListener("mousemove",e=>{const h=e.target.closest?.("[data-tip]");const tip=$("#tip");if(!h){tip.hidden=true;return}tip.innerHTML=h.getAttribute("data-tip");tip.hidden=false;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-10);tip.style.left=x+"px";tip.style.top=y+"px"});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layerRender)closeLayer()});
/* CSV export */
async function exportCSV(){
  const ds=pipeDeals();const cols=["ลูกค้า","สินค้า","บริษัท","Billing","GP","ขั้นตอน","หมวด Forecast","โอกาส%","ความร้อน","ช่องทาง","เดือนที่เข้ามา","เดือนที่คาดว่าจะปิด","เซลส์","ขั้นตอนถัดไป","วันนัด","Action Plan","หมายเหตุ"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv="﻿"+[cols.map(q).join(","),...ds.map(d=>[accName(d),d.product,d.bu,d.billing,d.gp,d.stage,fcatOf(d),d.prob,d.temp,d.channel,d.leadMonth,d.closeMonth,d.owner,d.nextStep,d.nextDate,d.action,d.note].map(q).join(","))].join("\n");
  if(!S.dl){toast("หน้านี้ส่งออกไฟล์ไม่ได้ในมุมมองนี้");return}
  try{await S.dl.save({filename:`pipeline-${today()}.csv`,data:new Blob([csv],{type:"text/csv"})})}catch(e){if(e.code!=="declined")toast("ส่งออกไม่สำเร็จ")}
}

route();boot();
