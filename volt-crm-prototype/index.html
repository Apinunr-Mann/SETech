<title>Volt Club Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800;1,900&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one live demo stage — customer phone, shop phone and an event feed side by side, the back office below; all share one state */
:root{
  --n950:#090E2E;--n900:#0E1640;--n800:#1D39D0;--blue:#2F6BFF;--cyan:#2EA8E6;--yel:#F2C200;--pur:#7B4BD8;
  --wh:#FFFFFF;--mut:#AEB8EC;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.07);
  --ink:#0E1640;--lbg:#F2F4FB;--lline:#DCE1F3;--lmut:#525C8A;--ok:#17A866;--warn:#B87400;--bad:#D93A40;
  --display:'Bai Jamjuree','IBM Plex Sans Thai',sans-serif;--body:'IBM Plex Sans Thai','Bai Jamjuree',sans-serif;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--n950);color:var(--wh);font:400 14px/1.45 var(--body);padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto}
svg.i{width:18px;height:24px;fill:currentColor;flex:none}
.hero{position:relative;padding:32px 0 22px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 80% 0%,rgba(47,107,255,.35),transparent 70%);pointer-events:none}
.logo{font:italic 900 clamp(40px,7vw,72px)/.9 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:6px;text-shadow:0 0 24px rgba(47,107,255,.8)}
.logo svg{width:.6em;height:.8em;fill:var(--yel)}
.hero p{color:var(--mut);max-width:62ch;position:relative}
.kick{font:italic 700 14px var(--display);letter-spacing:.08em;color:var(--yel);text-transform:uppercase}
.hctl{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px 22px;margin-top:26px;align-items:start}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.lab{font:italic 700 16px var(--display);display:flex;align-items:center;gap:8px}
.lab i{font-style:normal;color:var(--n900);background:var(--yel);border-radius:6px;padding:0 7px;font-size:12px}
.ph{width:min(360px,100%);height:760px;border-radius:46px;background:#000;padding:10px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 60px rgba(0,0,0,.5),0 0 60px rgba(47,107,255,.25)}
.scr{height:100%;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.dk{background:radial-gradient(120% 60% at 50% 0%,#1A2A9A 0%,var(--n900) 55%,var(--n950) 100%);color:var(--wh)}
.lt{background:var(--lbg);color:var(--ink)}
.bar{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0}
.bar b{font:italic 700 18px var(--display);flex:1}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--glass);display:grid;place-items:center;font-size:16px;flex:none}
.lt .x{background:#E3E7F6}
.bd{flex:1;min-height:0;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px}
.lt .card{background:#fff;border-color:var(--lline)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:0;font:italic 700 16px var(--display);text-decoration:none;padding:0 14px;flex:none}
.by{background:var(--yel);color:var(--n900);box-shadow:0 6px 20px rgba(242,194,0,.25)}
.bn{background:var(--n900);color:#fff}
.bo{background:transparent;border:1.5px solid var(--line);color:inherit}
.lt .bo{border-color:var(--ink)}
.bsm{min-height:36px;font-size:13px;border-radius:10px;padding:0 12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;background:var(--glass);border:1px solid var(--line)}
button.chip{min-height:32px}
.chip.y,.chip[aria-pressed=true]{background:var(--yel);color:var(--n900);border-color:var(--yel);font-weight:600}
.lt .chip{background:#E8ECF8;border-color:var(--lline)}
.mut{color:var(--mut)}.lt .mut{color:var(--lmut)}
.num{font:italic 800 1em var(--display);font-variant-numeric:tabular-nums}
.h3{font:italic 700 16px var(--display)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ai{border:1px solid rgba(46,168,230,.6);background:rgba(46,168,230,.1);border-radius:14px;padding:10px 12px;font-size:13px}
.ai b{color:var(--cyan);font:italic 700 12px var(--display);letter-spacing:.06em}
.ok{color:#4BE39A}.warn{color:#FFC14D}.bad{color:#FF7A7F}
.lt .ok,.bo-ui .ok{color:var(--ok)}.lt .warn,.bo-ui .warn{color:var(--warn)}.lt .bad,.bo-ui .bad{color:var(--bad)}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px}
.f>span{font-weight:600}
.in{min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);padding:0 12px;width:100%}
.in option{color:#111}
.lt .in,.bo-ui .in{background:#fff;border:1.5px solid var(--lline);color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--yel)}
.can{position:relative;display:inline-block;width:34px;height:64px;border-radius:7px 7px 9px 9px;flex:none;box-shadow:inset -6px 0 0 rgba(0,0,0,.18),inset 4px 0 0 rgba(255,255,255,.25)}
.can::before{content:"";position:absolute;left:3px;right:3px;top:-4px;height:6px;border-radius:3px;background:#C9CFE6}
.can b{position:absolute;inset:0;display:grid;place-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font:italic 900 15px/1 var(--display);color:var(--n900)}
.can.c{background:var(--cyan)}.can.y{background:var(--yel)}.can.p{background:var(--pur)}.can.p b{color:#fff}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.y{background:var(--yel)}.dot.c{background:var(--cyan)}.dot.p{background:var(--pur)}
/* LINE */
.lhead{background:#fff;color:#111;height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.av{width:34px;height:34px;border-radius:50%;background:var(--n900);display:grid;place-items:center;flex:none}
.av svg{width:16px;height:20px;fill:var(--yel)}
.chat{flex:1;min-height:0;background:#8CABD9;padding:12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.bub{max-width:84%;background:#fff;color:#111;border-radius:16px;padding:8px 12px;font-size:13px;align-self:flex-start;white-space:pre-line}
.bub.me{align-self:flex-end;background:#9BE36B}
.bub.ai{border:1.5px solid var(--cyan)}
.bub.ai::before{content:"AI · " attr(data-k);display:block;color:#0A7FA6;font:italic 700 11px var(--display)}
.promo{align-self:flex-start;width:84%;border-radius:16px;overflow:hidden;background:var(--n900);color:#fff;flex:none}
.promo .art{height:96px;position:relative;background:radial-gradient(80% 90% at 70% 40%,#2F6BFF,#0E1640);display:flex;align-items:flex-end;justify-content:flex-end;gap:6px;padding:10px 14px}
.promo .art em{position:absolute;left:12px;top:12px;font:italic 900 22px/1 var(--display);color:var(--yel)}
.qrep{flex:none;display:flex;gap:6px;padding:8px 10px;background:#fff;overflow-x:auto}
.qrep button{flex:none;border:1px solid #B9C4E4;background:#fff;color:#123;border-radius:999px;padding:5px 12px;font-size:12px}
.rich{flex:none;background:var(--n900);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px}
.rich button{min-height:74px;background:var(--n900);color:#fff;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:500}
.rich button svg{width:22px;height:22px;fill:none;stroke:var(--yel);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rich button:first-child{background:var(--yel);color:var(--n900)}.rich button:first-child svg{stroke:var(--n900)}
/* card */
.mcard{border-radius:22px;padding:16px;background:linear-gradient(135deg,#2F6BFF 0%,#1B2C9E 45%,#0E1640 100%);border:1px solid rgba(255,255,255,.2);position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(47,107,255,.35);flex:none}
.mcard .bg{position:absolute;right:-14px;top:-10px;width:130px;height:170px;fill:rgba(242,194,0,.16)}
.lvl{font:italic 800 13px var(--display);background:var(--yel);color:var(--n900);border-radius:999px;padding:2px 10px}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--yel);border-radius:4px}
.qr{align-self:center;width:172px;height:172px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 0 0 4px rgba(242,194,0,.6),0 0 30px rgba(242,194,0,.35);flex:none}
.qr svg{width:100%;height:100%;display:block}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex:none}
.seg button{border:0;background:none;padding:8px 0;border-radius:10px;font-weight:500;font-size:13px}
.seg button[aria-pressed=true]{background:var(--yel);color:var(--n900);font-weight:600}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:13px;flex:none}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:600}
.lt .li{background:#fff;border-color:var(--lline)}
.thumb{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font:italic 800 12px var(--display);color:#fff;background:var(--n800)}
.thumb svg{width:20px;height:24px;fill:var(--yel)}
.mini{padding:0 12px;min-height:34px;border-radius:10px;font:italic 700 13px var(--display);border:0;background:var(--yel);color:var(--n900);flex:none}
.mini.o{background:transparent;border:1.5px solid var(--yel);color:var(--yel)}
.lock{font-size:11.5px;color:var(--mut);flex:none;text-align:right}
.pin{border:1.5px solid var(--yel);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:rgba(242,194,0,.06);flex:none}
.rw{border-radius:14px;background:rgba(255,255,255,.08);padding:8px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;text-align:left;border:0;color:inherit}
.rw .im{height:58px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(70% 80% at 50% 30%,#2F6BFF,#0E1640)}
.rw .im svg{width:26px;height:30px;fill:var(--yel)}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;flex:none}
.opt.on{border-color:var(--yel);background:rgba(242,194,0,.07)}
.opt input{accent-color:var(--yel);width:20px;height:20px}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:none}
.tiers span{text-align:center;padding:8px 0;border-radius:12px;font:italic 800 14px var(--display);border:1px solid var(--line);color:var(--mut)}
.tiers span.done{background:rgba(255,255,255,.12);color:#fff}
.tiers span.on{background:var(--yel);color:var(--n900);border-color:var(--yel);box-shadow:0 0 16px rgba(242,194,0,.45)}
.tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--yel);flex:none;display:grid;place-items:center;font-size:13px;color:var(--n900)}
.tick.on{background:var(--yel)}
.hist{display:flex;flex-direction:column;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.big{font:italic 900 34px/1 var(--display)}
.center{text-align:center;align-items:center}
/* modal inside a phone */
.sheet{position:absolute;inset:0;background:rgba(3,6,30,.72);display:flex;align-items:flex-end;z-index:5}
.sheet>div{width:100%;background:var(--n900);border-top:2px solid var(--yel);border-radius:26px 26px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.lt .sheet>div{background:#fff;color:var(--ink)}
/* shop */
.shead{background:var(--n900);color:#fff;padding:24px 16px 14px;flex:none;display:flex;flex-direction:column;gap:2px}
.shead small{color:var(--mut)}
.cam{height:170px;border-radius:18px;background:#1C2138;display:grid;place-items:center;position:relative;overflow:hidden;flex:none;border:0;width:100%;color:#fff}
.cam i{width:110px;height:110px;border:3px solid var(--yel);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam::after{content:"";position:absolute;left:24%;right:24%;top:50%;height:2px;background:var(--yel);box-shadow:0 0 12px var(--yel)}
.cam span{position:absolute;bottom:10px;font-size:12px;font-weight:600}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--lline);background:#fff;font-size:18px;color:var(--ink)}
.step b{width:20px;text-align:center}
.kpi2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.kpi2 .card b{display:block;font:italic 800 26px/1.1 var(--display)}
/* feed */
.feed{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{font:italic 800 18px var(--display)}
.ev{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.ev i{font-style:normal;flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;height:fit-content;margin-top:2px}
.ev i.c{background:var(--yel);color:var(--n900)}.ev i.s{background:var(--cyan);color:var(--n900)}.ev i.b{background:#fff;color:var(--n900)}.ev i.a{background:var(--pur);color:#fff}
.ev time{color:var(--mut);font-size:11px;flex:none;margin-left:auto}
.try{display:flex;flex-direction:column;gap:6px;font-size:13px;list-style:none;counter-reset:t}
.try li{display:flex;gap:8px;counter-increment:t}
.try li::before{content:counter(t);flex:none;width:20px;height:20px;border-radius:50%;background:var(--yel);color:var(--n900);font:italic 800 12px/20px var(--display);text-align:center}
.try li.done{color:var(--mut);text-decoration:line-through}
/* desktop */
.dtbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:34px 0 12px}
.dtbar h2{font:italic 800 clamp(22px,3vw,30px) var(--display);margin-right:auto;text-transform:uppercase}
.dtbar h2 em{font-style:inherit;color:var(--yel)}
.dtw{width:100%;max-width:100%;aspect-ratio:1280/960;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 30px 60px rgba(0,0,0,.5)}
.dt{position:absolute;left:0;top:0;width:1280px;height:960px;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden}
.chrome{height:36px;flex:none;background:#1A1F3D;display:flex;align-items:center;gap:7px;padding:0 14px}
.chrome i{width:11px;height:11px;border-radius:50%;background:#3A4170}
.chrome span{margin-left:14px;background:#262C52;border-radius:7px;padding:3px 14px;font-size:12px;color:var(--mut);width:380px}
.bo-ui{flex:1;min-height:0;display:flex;background:var(--lbg);color:var(--ink)}
.side{width:220px;flex:none;background:var(--n900);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .logo{font-size:30px;text-shadow:none;padding:0 10px 2px}
.side small{color:var(--mut);padding:0 10px 14px;font-size:12px}
.side button{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;color:#D5DBFA;background:none;border:0;font-size:14px;font-weight:500;text-align:left}
.side button[aria-current=page]{background:var(--yel);color:var(--n900);font-weight:600}
.side em{font-style:normal;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}
.main{flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mh h3{font:italic 800 26px var(--display)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--lline);border-radius:14px;padding:12px 14px}
.kpi small{color:var(--lmut);font-size:12.5px}
.kpi b{display:block;font:italic 800 26px/1.15 var(--display);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;font-weight:600;color:var(--ok)}
.pn{background:#fff;border:1px solid var(--lline);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pn h4{font:italic 700 15px var(--display)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hb{display:grid;grid-template-columns:86px 1fr 46px;gap:8px;align-items:center;font-size:12.5px}
.hb i{height:14px;border-radius:0 4px 4px 0;background:var(--n800);display:block}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.vb{height:150px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--lline);padding:0 4px}
.vb div{flex:1;display:flex;flex-direction:column-reverse;height:100%;gap:2px}
.vb i{display:block;border-radius:3px 3px 0 0}
.xl{display:flex;gap:8px;padding:0 4px;font-size:11px;color:var(--lmut)}.xl span{flex:1;text-align:center}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--lmut)}.leg span{display:flex;align-items:center;gap:5px}
.al{font-size:13px;border-radius:10px;padding:8px 10px;border:0;text-align:left}
.al.r{background:#FDECEC;color:#9E1F25}.al.a{background:#FFF4DC;color:#7A4C00}.al.g{background:#E6F7EE;color:#0F6B40}
.tbl{background:#fff;border:1px solid var(--lline);border-radius:14px;overflow:hidden;font-size:13px}
.tr{display:grid;gap:10px;padding:10px 14px;align-items:center;border-top:1px solid #EEF1FA;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.tr.th{border-top:0;font-size:12px;color:var(--lmut);background:#F8F9FE}
button.tr:hover{background:#F8F9FE}
.tr.sel{background:#FFFBE0;box-shadow:inset 3px 0 0 var(--yel)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;width:fit-content}
.pill.r{background:#FDECEC;color:#9E1F25}.pill.a{background:#FFF4DC;color:#7A4C00}.pill.g{background:#E6F7EE;color:#0F6B40}.pill.n{background:#E8ECF8;color:var(--ink)}
.lbtn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:10px;font:italic 700 14px var(--display);border:0}
.lbtn.y{background:var(--yel);color:var(--n900)}.lbtn.n{background:var(--n900);color:#fff}.lbtn.o{background:#fff;border:1.5px solid var(--n900);color:var(--n900)}.lbtn.r{background:#fff;border:1.5px solid var(--bad);color:var(--bad)}
.rcpt{border-radius:12px;background:repeating-linear-gradient(0deg,#fff 0 18px,#F1F3FA 18px 19px);border:1px solid var(--lline);padding:16px;font:12px/1.6 ui-monospace,monospace;color:#333}
.rcpt.blur{filter:blur(.8px)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13.5px}.kv span:nth-child(odd){color:var(--lmut)}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.meter span{flex:1;height:8px;border-radius:4px;background:#E8ECF8;position:relative;overflow:hidden}
.meter span i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.meter span u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.aibox{background:#fff;border:1.5px solid var(--cyan);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.aibox h4{color:#0A7FA6;font:italic 700 15px var(--display)}
.air{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px}
.fld{display:grid;grid-template-columns:1fr 90px;gap:8px 12px;align-items:center;font-size:13.5px}
.fld input{min-height:36px;border:1.5px solid var(--lline);border-radius:8px;padding:0 10px;font:600 14px var(--body);background:#fff;color:var(--ink);width:100%}
.tog{width:44px;height:26px;border-radius:13px;border:0;background:#C5CBE3;position:relative;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed=true]{background:var(--ok)}.tog[aria-pressed=true]::after{left:21px}
.note{font-size:12px;color:var(--lmut)}
.empty{padding:24px;text-align:center;color:var(--lmut);font-size:13px}
/* consumer desktop */
.cdk{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--n950);color:#fff;overflow-y:auto}
.cnav{display:flex;align-items:center;gap:26px;padding:14px 40px;border-bottom:1px solid var(--line)}
.cnav .logo{font-size:32px;text-shadow:none}
.cnav nav{display:flex;gap:20px;flex:1;font-weight:500;color:var(--mut)}
.cbody{padding:22px 40px;display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:18px;align-content:start}
.banner{grid-column:1/-1;height:180px;border-radius:22px;position:relative;overflow:hidden;background:radial-gradient(60% 120% at 75% 50%,#2F6BFF 0%,#1D39D0 45%,#090E2E 100%);display:flex;align-items:center;padding:0 40px;gap:30px}
.banner h3{font:italic 900 42px/.95 var(--display);text-transform:uppercase}
.banner h3 em{font-style:inherit;color:var(--yel)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yel);color:var(--n900);font-weight:600;border-radius:14px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;max-width:min(520px,calc(100% - 32px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* v2 additions: Rich Menu tabs, recommendation reason, Charge Bolt placement, approval strips */
.rmtabs{display:flex;gap:4px;padding:6px 10px 0;background:#0E1640}
.rmtabs button{flex:1;min-height:32px;border-radius:10px 10px 0 0;border:1px solid rgba(255,255,255,.14);border-bottom:0;background:rgba(255,255,255,.05);color:#AEB8EC;font:italic 700 12.5px var(--display)}
.rmtabs button[aria-selected=true]{background:#F2C200;color:#0E1640;border-color:#F2C200}
.why{display:block;font-size:11.5px;color:#9ADCFF;margin-top:2px}
.li .mini[aria-pressed=true]{background:#17A866;color:#fff}
.mcard .cbolt .cb-l{color:#fff}
.kpi2 .cbolt{margin:0 auto}
.side .cbolt .cb-l{color:#EEF1FF}
.dk .cbolt .cb-l,.scr .cbolt .cb-l{color:#fff}
.lt .cbolt .cb-l{color:#0E1640}
input[type=range]{accent-color:#F2C200}
.bo-ui .filt span[role=button]{cursor:pointer}
.bo-ui .air small.note,.bo-ui .pn small.note{display:block}
.tr .note{font-size:12px}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt span{padding:4px 12px;border-radius:999px;border:1px solid var(--gb,rgba(255,255,255,.12));font-size:13px;min-height:28px;display:inline-flex;align-items:center}
.rg-hero{position:relative}
.lhead .av[class*=im-bm]{background-size:cover;background-position:center top;border:0}
.seg{grid-template-columns:repeat(4,minmax(0,1fr))}

/*LD-CSS*/
/* Volt Live Dashboard — glass panels on deep navy, brand cyan / blue / purple / yellow */
.ld{--ld-bg:#070B2A;--ld-pan:rgba(255,255,255,.045);--ld-bd:rgba(255,255,255,.09);--ld-tx:#EEF1FF;--ld-mu:#9AA5DD;--ld-cy:#2EA8E6;--ld-bl:#2F6BFF;--ld-pu:#7B4BD8;--ld-ye:#F2C200;--ld-gr:#4BE39A;--ld-rd:#FF7A7F;
  position:relative;display:flex;flex-direction:column;gap:12px;min-height:100%;padding:16px 18px;color:var(--ld-tx);font-family:'IBM Plex Sans Thai','Bai Jamjuree',sans-serif;
  background:radial-gradient(50% 40% at 85% 0%,rgba(47,107,255,.22),transparent 70%),radial-gradient(40% 40% at 0% 100%,rgba(123,75,216,.18),transparent 70%),var(--ld-bg)}
.ld *{box-sizing:border-box}
.ld button{font:inherit;color:inherit;cursor:pointer}
.ld-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ld-top h3{font:italic 800 22px/1 'Bai Jamjuree',sans-serif;letter-spacing:.01em;margin-right:6px}
.ld-live{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px;background:rgba(75,227,154,.12);border:1px solid rgba(75,227,154,.4);font:600 12px 'IBM Plex Sans Thai',sans-serif;color:var(--ld-gr)}
.ld-live i{width:8px;height:8px;border-radius:50%;background:var(--ld-gr);box-shadow:0 0 0 0 rgba(75,227,154,.7);animation:ldPulse 1.6s infinite}
.ld-live.off{background:rgba(255,255,255,.06);border-color:var(--ld-bd);color:var(--ld-mu)}.ld-live.off i{background:var(--ld-mu);animation:none}
.ld-clock{font:600 12px 'IBM Plex Sans Thai',sans-serif;color:var(--ld-mu);font-variant-numeric:tabular-nums}
.ld-sp{flex:1}
.ld-chips{display:flex;gap:6px;flex-wrap:wrap}
.ld-chip{border:1px solid var(--ld-bd);background:var(--ld-pan);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.ld-chip i{width:8px;height:8px;border-radius:50%}
.ld-chip[aria-pressed=true]{background:var(--ld-ye);color:#0E1640;border-color:var(--ld-ye);font-weight:600}
.ld-btn{border:1px solid var(--ld-bd);background:var(--ld-pan);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600}
.ld-btn.y{background:var(--ld-ye);color:#0E1640;border-color:var(--ld-ye)}
.ld-alerts{display:flex;gap:8px;flex-wrap:wrap}
.ld-alerts button{border:1px solid var(--ld-bd);border-radius:10px;padding:6px 12px;font-size:12.5px;background:var(--ld-pan);text-align:left}
.ld-alerts .r{border-color:rgba(255,122,127,.5);color:#FFB3B6}.ld-alerts .a{border-color:rgba(242,194,0,.45);color:#FFEE80}
.ld-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto auto auto;gap:10px}
.ld-c{position:relative;border-radius:18px;padding:14px 16px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--ld-bd);box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);min-width:0;display:flex;flex-direction:column;gap:10px}
.ld-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ld-h b{font:italic 700 16px 'Bai Jamjuree',sans-serif;white-space:nowrap}
.ld-h span{color:var(--ld-mu);font-size:12px}
.ld-funnel{grid-column:1/6;grid-row:1/3}
.ld-trend{grid-column:6/13;grid-row:1}
.ld-ret{grid-column:6/9;grid-row:2/4}
.ld-cyc{grid-column:9/13;grid-row:2}
.ld-pipe{grid-column:1/6;grid-row:3}
.ld-board{grid-column:9/13;grid-row:3}
/* funnel */
.ld-fwrap{display:grid;grid-template-columns:1.05fr 1fr;gap:12px;align-items:center;flex:1}
.ld-stack{display:flex;flex-direction:column;align-items:center;gap:6px}
.ld-stg{height:42px;display:grid;place-items:center;font:italic 800 18px 'Bai Jamjuree',sans-serif;color:#fff;clip-path:polygon(0 0,100% 0,93% 100%,7% 100%);border:0;transition:filter .2s,transform .2s;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.ld-stg:hover,.ld-stg.on{filter:brightness(1.18) drop-shadow(0 0 10px rgba(255,255,255,.35));transform:scale(1.03)}
.ld-bowl{width:64%;height:34px;white-space:nowrap;font-size:14px!important;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(90deg,#2F6BFF,#2EA8E6);display:flex;align-items:center;justify-content:center;font:italic 800 15px 'Bai Jamjuree',sans-serif;box-shadow:0 8px 20px rgba(46,168,230,.35)}
.ld-pills{display:flex;flex-direction:column;gap:6px}
.ld-pill{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:7px 12px;border:1px solid var(--ld-bd);text-align:left;background:var(--ld-pan);transition:border-color .2s}
.ld-pill.on{border-color:var(--ld-ye)}
.ld-pill b{font-weight:600;font-size:13.5px}
.ld-pill small{display:block;font-size:11px;color:var(--ld-mu)}
.ld-pill em{font:italic 800 18px 'Bai Jamjuree',sans-serif;font-style:italic;text-align:right;font-variant-numeric:tabular-nums}
.ld-pill em small{font:600 10.5px 'IBM Plex Sans Thai',sans-serif}
.ld-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;border-top:1px solid var(--ld-bd);padding-top:10px}
.ld-stats span{font-size:12px;color:var(--ld-mu)}
.ld-stats b{display:block;font:italic 800 20px/1.2 'Bai Jamjuree',sans-serif;font-variant-numeric:tabular-nums}
.ld-stats small{font-size:11px;color:var(--ld-mu)}
.ld-fdet{font-size:12px;color:var(--ld-mu);min-height:18px}
/* trend */
.ld-th{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ld-tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:10px;padding:3px}
.ld-tabs button{border:0;background:none;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--ld-mu)}
.ld-tabs button[aria-pressed=true]{background:var(--ld-bl);color:#fff}
.ld-kv{display:flex;gap:18px;margin-left:auto;text-align:right}
.ld-kv span{display:block;font-size:11.5px;color:var(--ld-mu)}
.ld-kv b{font:italic 800 19px 'Bai Jamjuree',sans-serif;font-variant-numeric:tabular-nums}
.ld svg{display:block;width:100%;height:auto;overflow:visible}
.ld svg text{font-family:'IBM Plex Sans Thai',sans-serif}
.ld .grow rect.b{animation:ldGrow .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
.ld rect.b.pulse{animation:ldFlash .9s}
.ld [data-tip]{cursor:pointer}
.ld rect.b:hover,.ld circle.pt:hover{filter:brightness(1.3)}
/* donuts */
.ld-dn{position:relative;display:grid;place-items:center}
.ld-dn .c{position:absolute;text-align:center;line-height:1.1}
.ld-dn .c b{display:block;font:italic 800 30px 'Bai Jamjuree',sans-serif}
.ld-dn .c small{font-size:11px;color:var(--ld-mu)}
.ld-leg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--ld-mu)}
.ld-leg span{display:flex;align-items:center;gap:6px}
.ld-leg i{width:9px;height:9px;border-radius:50%}
.ld-cycw{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:center}
/* pipe */
.ld-pw{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ld-pw .ld-h{flex-direction:column;align-items:flex-start;gap:0}
/* board */
.ld-row{display:grid;grid-template-columns:40px 28px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:12.5px}
.ld-row small{color:var(--ld-mu);font-size:11px}
.ld-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:italic 800 12px 'Bai Jamjuree',sans-serif;color:#0E1640}
.ld-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.ld-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ld-bl),var(--ld-cy));transition:width .6s}
.ld-row.me{background:rgba(242,194,0,.08);border-radius:10px;outline:1px solid rgba(242,194,0,.35)}
.ld-row em{font:italic 800 14px 'Bai Jamjuree',sans-serif;text-align:right;font-variant-numeric:tabular-nums}
/* ticker */
.ld-ticker{display:flex;align-items:center;gap:12px;border-radius:14px;border:1px solid var(--ld-bd);background:rgba(0,0,0,.25);padding:7px 12px;overflow:hidden;white-space:nowrap}
.ld-ticker>b{font:italic 800 13px 'Bai Jamjuree',sans-serif;color:var(--ld-ye);flex:none}
.ld-tk{display:flex;gap:18px;font-size:12.5px;overflow:hidden}
.ld-tk span{flex:none;color:var(--ld-mu)}
.ld-tk span:first-child{color:#fff;animation:ldIn .5s}
.ld-tk span b{color:var(--ld-ye);font-weight:600}
.ld-tip{position:absolute;z-index:20;pointer-events:none;background:#0E1640;border:1px solid var(--ld-ye);border-radius:10px;padding:6px 10px;font-size:12px;white-space:pre-line;box-shadow:0 8px 20px rgba(0,0,0,.5);max-width:240px}
.ld-toast{position:absolute;right:18px;top:62px;z-index:20;background:var(--ld-ye);color:#0E1640;font-weight:600;border-radius:12px;padding:8px 14px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
@keyframes ldPulse{70%{box-shadow:0 0 0 8px rgba(75,227,154,0)}100%{box-shadow:0 0 0 0 rgba(75,227,154,0)}}
@keyframes ldGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ldFlash{0%{filter:brightness(2.2) drop-shadow(0 0 8px #F2C200)}100%{filter:none}}
@keyframes ldIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ld *{animation:none!important;transition:none!important}}

.ld-camp{display:inline-flex;align-items:center;gap:10px;font:600 12px 'IBM Plex Sans Thai',sans-serif;color:#9AA5DD}
.ld-camp .batt>b{font-size:11px}

.ld-gov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ld-g{border-radius:14px;padding:9px 12px;border:1px solid var(--ld-bd);background:var(--ld-pan);display:flex;flex-direction:column;gap:2px;min-width:0}
.ld-g span{font-size:11.5px;color:var(--ld-mu)}
.ld-g b{font:italic 800 19px/1.15 'Bai Jamjuree','IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums}
.ld-g b.g{color:var(--ld-gr)}.ld-g b.a{color:#FFE76A}.ld-g b.r{color:var(--ld-rd)}
.ld-g small{font-size:11px;color:var(--ld-mu)}
.ld-gt{position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.1);margin:3px 0}
.ld-gt i{position:absolute;top:0;bottom:0;border-radius:4px;opacity:.85}
.ld-gt u{position:absolute;top:-4px;width:3px;height:15px;border-radius:2px;background:#fff;box-shadow:0 0 6px #fff;transform:translateX(-50%);transition:left .8s}
.ld-cop{margin-top:2px}
.ld-cq{display:flex;gap:8px}
.ld-cq input{flex:1;min-width:0;min-height:38px;border-radius:10px;border:1px solid var(--ld-bd);background:rgba(255,255,255,.06);color:var(--ld-tx);padding:0 12px;font:inherit}
.ld-ans{font-size:13px;line-height:1.55;white-space:pre-line;border-left:3px solid var(--ld-cy);padding-left:10px;color:#DCE3FF}
.ld-i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--ld-mu);color:var(--ld-mu);font:600 10px 'IBM Plex Sans Thai',sans-serif;margin-left:6px;vertical-align:2px;cursor:help}
.ld-camp .cbolt{margin-right:4px}
@media (max-width:1100px){.ld-gov{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Dark glass theme for back office and shop screens (matches the Live Dashboard) */
:is(.bo-ui,.bo,.dk){--g1:rgba(255,255,255,.07);--g2:rgba(255,255,255,.025);--gb:rgba(255,255,255,.09);--gt:#EEF1FF;--gm:#9AA5DD}
.bo-ui,.dt>.bo{background:radial-gradient(50% 40% at 85% 0%,rgba(47,107,255,.2),transparent 70%),radial-gradient(40% 40% at 0% 100%,rgba(123,75,216,.14),transparent 70%),#070B2A!important;color:var(--gt)!important}
:is(.bo-ui,.dt>.bo) .side{background:rgba(255,255,255,.03);border-right:1px solid var(--gb)}
:is(.bo-ui,.bo,.dk) :is(.kpi,.pn,.tbl,.aibox){background:linear-gradient(180deg,var(--g1),var(--g2));border:1px solid var(--gb);color:var(--gt);box-shadow:0 14px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)}
:is(.bo-ui,.bo,.dk) :is(.kpi small,.note,.leg,.xl,.empty,.kv span:nth-child(odd),.lmut){color:var(--gm)!important}
:is(.bo-ui,.bo,.dk) .kpi b{color:#fff}
:is(.bo-ui,.bo,.dk) .kpi em{color:#4BE39A}
:is(.bo-ui,.bo,.dk) .tr{border-top-color:rgba(255,255,255,.06)}
:is(.bo-ui,.bo,.dk) .tr.th{background:rgba(0,0,0,.22);color:var(--gm)}
:is(.bo-ui,.bo,.dk) button.tr:hover{background:rgba(255,255,255,.05)}
:is(.bo-ui,.bo,.dk) .tr.sel{background:rgba(242,194,0,.08);box-shadow:inset 3px 0 0 #F2C200}
:is(.bo-ui,.bo,.dk) .pill.n{background:rgba(255,255,255,.1);color:#EEF1FF}
:is(.bo-ui,.bo,.dk) .pill.g,:is(.bo-ui,.bo,.dk) .al.g{background:rgba(75,227,154,.14);color:#4BE39A}
:is(.bo-ui,.bo,.dk) .pill.a,:is(.bo-ui,.bo,.dk) .al.a{background:rgba(242,194,0,.12);color:#FFE76A}
:is(.bo-ui,.bo,.dk) .pill.r,:is(.bo-ui,.bo,.dk) .al.r{background:rgba(255,122,127,.14);color:#FF9DA0}
:is(.bo-ui,.bo,.dk) .lbtn.n,.dk .btn.bn{background:#2F6BFF;color:#fff}
:is(.bo-ui,.bo,.dk) .lbtn.o{background:transparent;border-color:#EEF1FF;color:#EEF1FF}
:is(.bo-ui,.bo,.dk) .lbtn.r{background:transparent}
:is(.bo-ui,.bo,.dk) :is(.fld input,.in,.inp){background:rgba(255,255,255,.06)!important;border-color:rgba(255,255,255,.16)!important;color:#EEF1FF!important}
:is(.bo-ui,.bo,.dk) .in option{color:#111}
:is(.bo-ui,.bo,.dk) .meter span{background:rgba(255,255,255,.1)}
:is(.bo-ui,.bo,.dk) .meter span u{background:#fff}
:is(.bo-ui,.bo,.dk) .aibox{border-color:rgba(46,168,230,.6)}
:is(.bo-ui,.bo,.dk) .aibox h4{color:#2EA8E6}
:is(.bo-ui,.bo,.dk) .hb i{background:linear-gradient(90deg,#2F6BFF,#2EA8E6)!important;border-radius:0 6px 6px 0}
:is(.bo-ui,.bo,.dk) .ok{color:#4BE39A}:is(.bo-ui,.bo,.dk) .warn{color:#FFC14D}:is(.bo-ui,.bo,.dk) .bad{color:#FF7A7F}
:is(.bo-ui,.bo,.dk) .tog{background:#3A4170}
:is(.bo-ui,.bo,.dk) .tog[aria-pressed=true]{background:#17A866}
:is(.bo-ui,.bo,.dk) .map{background:#16205E}
:is(.bo-ui,.bo,.dk) .map::before{opacity:.12}
:is(.bo-ui,.bo,.dk) .filt span{background:rgba(255,255,255,.06);border-color:var(--gb);color:var(--gt)}
:is(.bo-ui,.bo,.dk) .filt span.on{background:#F2C200;color:#0E1640;border-color:#F2C200}
.dk .step button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.dk .shead{background:rgba(255,255,255,.04);border-bottom:1px solid var(--gb)}
.dk .cam{background:#0E1440}

/* Shared UI: real key-visual images, LINE Rich Menu, register flow */
.im{background-size:cover;background-position:center;background-repeat:no-repeat}
.cthumb{width:13px;height:24px;border-radius:3px;display:inline-block;vertical-align:middle;flex:none;background-size:cover;background-position:center}
.kvbanner{width:100%;aspect-ratio:960/355;max-height:340px;border-radius:22px;background-size:cover;background-position:center;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 60px rgba(47,107,255,.25);position:relative;overflow:hidden}
.ovl{position:relative}
.ovl::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,7,36,.95) 8%,rgba(4,7,36,.35) 55%,rgba(4,7,36,0) 100%);pointer-events:none}
.ovl>*{position:relative}
/* Rich Menu (LINE large size 2500 x 1686) */
.rm{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:.27em;aspect-ratio:2500/1686;background:#03061F;padding:.27em;width:100%;flex:none;font-size:11px}
.rm>*{position:relative;border:0;border-radius:.8em;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:.15em;padding:.8em;color:#fff;text-align:left;background:linear-gradient(160deg,#1E33B8 0%,#0E1640 75%);font:500 1em/1.25 'IBM Plex Sans Thai',sans-serif;cursor:pointer;text-decoration:none}
.rm>*::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);pointer-events:none}
.rm>* b{font:italic 800 1.35em/1.05 'Bai Jamjuree',sans-serif}
.rm>* span{color:#C8D0FF;font-size:.92em}
.rm>* svg{position:absolute;top:.8em;left:.8em;width:2.1em;height:2.1em;stroke:#F2C200;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rm .big{grid-row:1/3;background-color:#0E1640}
.rm .big b{font-size:2em;color:#F2C200}
.rm .photo::before,.rm .big::before,.rm .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,7,36,.95) 12%,rgba(4,7,36,.25) 60%,rgba(4,7,36,0));}
.rm>*>*{position:relative}
.rm .tag{position:absolute;top:.8em;right:.8em;background:#F2C200;color:#0E1640;border-radius:999px;padding:.15em .7em;font:italic 800 .9em 'Bai Jamjuree',sans-serif}
.rm.guest{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1.45fr) minmax(0,1fr)}
.rm.guest .hero{grid-column:1/-1;background-position:center 28%;justify-content:center;align-items:flex-start;padding-left:1.4em}
.rm.guest .hero b{font-size:2.1em;color:#fff}
.rm.guest .hero .cta{margin-top:.5em;background:#F2C200;color:#0E1640;border-radius:999px;padding:.35em 1.1em;font:italic 800 1.25em 'Bai Jamjuree',sans-serif;box-shadow:0 0 1.4em rgba(242,194,0,.55)}
.rm.guest>*:not(.hero){align-items:center;justify-content:center;text-align:center;padding-top:2.6em}
.rm.guest>*:not(.hero) svg{left:50%;transform:translateX(-50%)}
.rmbar{flex:none;background:#fff;color:#444;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;border:0;width:100%;cursor:pointer}
.rmspec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.rmspec b{font:italic 800 13px 'Bai Jamjuree',sans-serif;color:#0E1640;background:#F2C200;border-radius:6px;padding:0 7px;height:fit-content}
/* register */
.lsheet{background:#fff;color:#111;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lsheet .lg{display:flex;align-items:center;gap:10px}
.lsheet .lg i{width:40px;height:40px;border-radius:12px;background:#0E1640;display:grid;place-items:center;flex:none}
.lsheet .perm{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding-top:10px;font-size:13px}
.lsheet .perm small{color:#777}
.lbtn-green{background:#06C755;color:#fff;border:0;border-radius:12px;min-height:48px;font:600 15px 'IBM Plex Sans Thai',sans-serif;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.rg-hero{height:132px;border-radius:20px;background-position:center 28%;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;flex:none;overflow:hidden}
.rg-hero b{font:italic 900 22px/1.05 'Bai Jamjuree',sans-serif}
.rg-hero b em{font-style:inherit;color:#F2C200}
.rg-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:none}
.rg-steps span{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.rg-steps span.on{background:#F2C200}
.flv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flv button,.flv div{border-radius:14px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:inherit;cursor:pointer}
.flv [aria-pressed=true],.flv .on{border-color:#F2C200;background:rgba(242,194,0,.1)}
.flv .im{width:30px;height:62px;border-radius:5px}
.otp6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp6 span{height:52px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;font:italic 800 24px 'Bai Jamjuree',sans-serif;background:rgba(255,255,255,.06)}
.otp6 span.on{border-color:#F2C200}
.otp1{height:56px!important;text-align:center;font:italic 800 26px 'Bai Jamjuree',sans-serif!important;letter-spacing:.5em}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45}
.consent input{width:18px;height:18px;accent-color:#F2C200;flex:none;margin-top:2px}
.consent a{color:#F2C200}
.wel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.wel .big{font:italic 900 56px/1 'Bai Jamjuree',sans-serif;color:#F2C200;text-shadow:0 0 30px rgba(242,194,0,.6)}
.rm [class*="im-"]{background-size:cover;background-position:center}
.kvart{height:112px;position:relative;background-size:cover;background-position:62% 38%}
.kvart em{position:absolute;left:12px;top:10px;font:italic 900 22px/1 'Bai Jamjuree',sans-serif;color:#F2C200;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.im2{height:64px;border-radius:10px;background-size:cover;background-position:center;display:block}

/* "Volt — Charge Your Experience": battery, charge FX, level-up, hold-to-charge */
.vhud{display:inline-flex;align-items:center;gap:8px;font:italic 800 15px 'Bai Jamjuree',sans-serif;color:#fff;border-radius:999px;padding:4px 12px 4px 8px;background:rgba(242,194,0,.12);border:1px solid rgba(242,194,0,.5);flex:none}
.vhud>svg{width:13px;height:17px;fill:#F2C200;filter:drop-shadow(0 0 6px rgba(242,194,0,.8))}
.vhud.dark{color:#0E1640;background:#F2C200;border-color:#F2C200}.vhud.dark svg{fill:#0E1640;filter:none}
.vbolt{position:fixed;left:0;top:0;width:22px;height:30px;z-index:9999;pointer-events:none;fill:#F2C200;filter:drop-shadow(0 0 8px #F2C200) drop-shadow(0 0 16px rgba(46,168,230,.9))}
.vpop{position:fixed;z-index:9999;pointer-events:none;font:italic 900 26px 'Bai Jamjuree',sans-serif;color:#F2C200;text-shadow:0 0 16px rgba(242,194,0,.8),0 2px 0 #0E1640;white-space:nowrap;animation:vfPop 1.3s ease-out forwards}
.vpop.neg{color:#2EA8E6;text-shadow:0 0 16px rgba(46,168,230,.8),0 2px 0 #0E1640}
.vlvl{position:absolute;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(242,194,0,.2) 0,rgba(6,10,43,.94) 58%);backdrop-filter:blur(3px);animation:vfFade .3s ease-out;cursor:pointer;border-radius:inherit}
.vlvl::before{content:"";position:absolute;left:50%;top:45%;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 0 rgba(242,194,0,.8);animation:vfRing 1.2s ease-out 2;transform:translate(-50%,-50%)}
.vlvl div{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;animation:vfRise .6s cubic-bezier(.2,1.4,.4,1)}
.vlvl svg{width:64px;height:86px;fill:#F2C200;filter:drop-shadow(0 0 22px #F2C200);animation:vfFlicker 1s steps(2) 2}
.vlvl b{font:italic 900 40px/1 'Bai Jamjuree',sans-serif;color:#F2C200;letter-spacing:.02em;text-shadow:0 0 22px rgba(242,194,0,.7)}
.vlvl span{font:600 15px 'IBM Plex Sans Thai',sans-serif}
.vlvl small{color:#AEB8EC;font-size:12px}
.vhold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.vhold::before{content:"";position:absolute;inset:0;width:calc(var(--h,0)*100%);background:linear-gradient(90deg,rgba(46,168,230,.55),rgba(242,194,0,.9));transition:width .08s linear}
.vhold>*{position:relative}
.vgauge{--p:.5;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#F2C200 calc(var(--p)*360deg),rgba(255,255,255,.1) 0);box-shadow:0 0 30px rgba(242,194,0,.35);position:relative;transition:--p 1s}
.vgauge::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#0E1640}
.vgauge>*{position:relative;text-align:center;line-height:1.05}
.vgauge b{display:block;font:italic 900 30px 'Bai Jamjuree',sans-serif;color:#fff}
.vgauge small{font-size:11px;color:#AEB8EC}
.vstreak{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.vstreak span{height:30px;border-radius:8px;display:grid;place-items:center;font:600 11px 'IBM Plex Sans Thai',sans-serif;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#AEB8EC}
.vstreak span.on{background:linear-gradient(180deg,#F2C200,#FFB800);color:#0E1640;border-color:#F2C200;box-shadow:0 0 10px rgba(242,194,0,.45)}
.vstreak span.now{outline:2px dashed #F2C200;outline-offset:2px}
.vpbar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.vpbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2EA8E6,#F2C200);transition:width .8s}
.vglow{animation:vfGlow 2.4s ease-in-out infinite}
.vfloat svg{animation:vfFloat 2.2s ease-in-out infinite}
@keyframes vfPop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes vfFade{from{opacity:0}to{opacity:1}}
@keyframes vfRing{to{box-shadow:0 0 0 220px rgba(242,194,0,0)}}
@keyframes vfRise{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
@keyframes vfFlicker{50%{opacity:.4}}
@keyframes vfGlow{50%{box-shadow:0 0 28px rgba(242,194,0,.55),0 0 0 1px rgba(242,194,0,.6)}}
@keyframes vfFloat{50%{transform:translateY(-4px)}}
.chgrid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:stretch}
@media (max-width:860px){.chgrid{grid-template-columns:1fr}}
.chdemo{position:relative;border-radius:24px;padding:22px;border:1px solid rgba(255,255,255,.12);background:radial-gradient(70% 60% at 50% 0%,rgba(47,107,255,.35),rgba(255,255,255,.03));display:flex;flex-direction:column;align-items:center;gap:14px;overflow:hidden;min-height:420px}
.chdemo .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chdemo small{color:#AEB8EC;text-align:center}
.chcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.chcard{border-radius:20px;padding:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:8px}
.chcard b{font:italic 800 18px 'Bai Jamjuree',sans-serif}
.chcard b i{font-style:normal;color:#F2C200;margin-right:6px}
.chcard span{color:#C8D0FF;font-size:13.5px;line-height:1.5}
.sheet{position:absolute;inset:0;background:rgba(3,6,30,.72);display:flex;align-items:flex-end;z-index:5}
.sheet>div{width:100%;background:#0E1640;border-top:2px solid #F2C200;border-radius:26px 26px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.chcards{align-content:start}
.chat .kvart{height:88px}

/* ===== Charge Bolt (handoff §3): glass lightning bolt filled with Volt liquid ===== */
.cbolt{--p:.5;--cf:#F2C200;--cf2:#FFE680;display:inline-flex;flex-direction:column;align-items:center;gap:3px;flex:none;position:relative;vertical-align:middle;transform-origin:50% 60%}
.cbolt svg{width:100%;height:auto;overflow:visible;display:block}
.cb-sm{width:20px}.cb-md{width:40px}.cb-lg{width:72px}.cb-xl{width:116px}
.cbolt.f-y{--cf:#F5C400;--cf2:#FFE680}.cbolt.f-c{--cf:#2EA8E6;--cf2:#9ADCFF}.cbolt.f-p{--cf:#7B4BD8;--cf2:#B79CFF}
.cb-glass{fill:rgba(255,255,255,.07);stroke:none}
.cb-edge{fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.4;stroke-linejoin:round}
.cb-liq{transform:translateY(calc((1 - var(--p)) * 68px));transition:transform .9s cubic-bezier(.16,1,.3,1)}
.cb-w1{animation:cbWave 2.6s linear infinite}
.cb-w2{animation:cbWave 2.6s linear infinite reverse;opacity:.5}
.cb-b{fill:rgba(255,255,255,.8);animation:cbRise 3.2s ease-in infinite}
.cb-idle{opacity:0}
.cb-0 .cb-liq{opacity:0}
.cb-0 .cb-idle{opacity:1}
.cb-idle circle{fill:rgba(255,255,255,.75);animation:cbIdle 3.2s ease-in-out infinite}
.cb-wait .cb-liq{animation:cbBlink 1.5s ease-in-out infinite}
.cb-wait .cb-edge{stroke-dasharray:4 3}
.cb-full .cb-edge{stroke:var(--cf2);filter:drop-shadow(0 0 5px var(--cf))}
.cb-full.cb-glow{animation:cbGlow .6s ease-out 1}
.cbolt.cb-ok svg{animation:cbPulse .9s ease-out 1}
.cbolt.zap{animation:cbZap .7s ease-out 1}
.cb-l{font:italic 700 11px 'Bai Jamjuree','IBM Plex Sans Thai',sans-serif;color:#fff;text-align:center;line-height:1.1;white-space:nowrap}
.cb-lg+.cb-l,.cb-xl+.cb-l{font-size:14px}
.cbolt .cb-l{display:block}
.cb-burst{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--cf2);pointer-events:none;left:50%;top:55%;animation:cbBurst .95s ease-out forwards;box-shadow:0 0 6px var(--cf)}
@keyframes cbWave{from{transform:translateX(0)}to{transform:translateX(-24px)}}
@keyframes cbRise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-46px);opacity:0}}
@keyframes cbIdle{0%{transform:translateY(0);opacity:.2}40%{opacity:.9}100%{transform:translateY(-7px);opacity:0}}
@keyframes cbBlink{50%{opacity:.35}}
@keyframes cbGlow{0%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 14px var(--cf))}100%{filter:drop-shadow(0 0 4px var(--cf))}}
@keyframes cbPulse{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes cbZap{0%{transform:scale(1)}30%{transform:scale(1.18);filter:drop-shadow(0 0 12px var(--cf))}100%{transform:scale(1)}}
@keyframes cbBurst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.cb-w1,.cb-w2,.cb-b,.cb-idle circle,.cb-wait .cb-liq,.cb-full.cb-glow,.cbolt.cb-ok svg,.cbolt.zap,.vglow,.vfloat svg,.vlvl::before,.vlvl svg{animation:none!important}.cb-liq{transition:none}.cb-b{opacity:.5}.cb-burst{display:none}.vbolt{display:none}}
.vhud{gap:6px}

      k.onfinish=()=>{s.remove();if(i===cnt-1){zap(to);if(!neg&&to.classList&&to.classList.contains('cbolt'))burst(to,10);pop(to,text,neg)}}}
  }

  const BPATH='M29 1L5 37H22L15 63L43 23H26L36 1Z';
  let uid=0;
  const WAVE='M-24 4Q-18 0 -12 4T0 4T12 4T24 4T36 4T48 4T60 4T72 4T84 4V90H-24Z';

/* Award passed cans. items=[{sku,qty,flav,ch,rcpt}] one claim => one Instant Win chance */
function awardCans(items,label,from){
  const u=S.user,res={pts:0,cans:0,capped:false,iw:null,lvl:false,released:0,items:[]};
  const tier0=tierIdx();let room=Math.max(0,S.rules.capCans-u.cansToday);
  items.forEach(it=>{const q=Math.min(it.qty,room);room-=q;if(q<it.qty)res.capped=true;if(q<=0)return;let bo=it.boost||0;if(it.bp){bo=Math.min(q,u.boostPool||0);u.boostPool=(u.boostPool||0)-bo}const c=calcPts({...it,qty:q,boost:Math.min(bo,q)});res.pts+=c.pts;res.cans+=q;res.items.push({...it,qty:q,c});
    u.cans30[it.flav]=(u.cans30[it.flav]||0)+q;u.spendW+=SKU[it.sku].baht*q;u.spendM+=SKU[it.sku].baht*q;u.beh.core=(u.beh.core||0)+1});
  if(!res.cans){fxQueue().push({toast:'วันนี้ชาร์จครบเพดาน '+S.rules.capCans+' กระป๋องแล้ว พักก่อนนะ'});S.chat.push({f:'oa',k:'ai',kk:'PUSH',x:`วันนี้ชาร์จครบเพดาน ${S.rules.capCans} กระป๋องแล้ว พักก่อนนะ แล้วพรุ่งนี้มาชาร์จใหม่`});return res}
  u.cansToday+=res.cans;u.cansM+=res.cans;u.lastDays=0;
  const held=!!(from&&from.hold);S.hist=S.hist||[];
  if(held){u.pendList.push({l:label,p:res.pts,hold:S.rules.holdDays,why:from.why||''});u.pend=u.pendList.reduce((a,b)=>a+b.p,0);S.chat.push({f:'oa',k:'ai',kk:'PUSH',x:`แต้ม ${res.pts} ถูกพักตรวจสอบ ${S.rules.holdDays} วัน (${from.why||'ตรวจสอบตามกติกา'}) · ผ่านแล้วระบบปล่อยให้อัตโนมัติ`})}
  else{u.pts+=res.pts;S.hist.unshift({l:label,p:res.pts,ch:items[0].ch})}
  if(!u.firstCan&&!held){u.firstCan=true;let rel=0;u.pendList.filter(p=>p.firstCan).forEach(p=>rel+=p.p);if(!rel)rel=S.rules.welcome;u.pendList=u.pendList.filter(p=>!p.firstCan);u.pend=u.pendList.reduce((a,b)=>a+b.p,0);u.pts+=rel;res.released=rel;
    S.hist.unshift({l:'ปลดล็อก Welcome'+(rel>S.rules.welcome?' + Charge Profile':''),p:rel,ch:'โบนัส'});
    S.chat.push({f:'oa',k:'ai',kk:'PUSH',x:`ชาร์จกระป๋องแรกผ่านแล้ว ปลดล็อก ${fmt(rel)} แต้ม (Welcome${rel>S.rules.welcome?' + Charge Profile':''})`});fxQueue().push({n:rel,label:'Welcome +'+rel})}
  if(!u.week){u.week=true;u.wk[7]=1;u.streak++}
  if(u.cans30.y&&u.cans30.c&&u.cans30.p&&!u.trioDone){u.trioDone=true;u.pts+=S.rules.trio;S.hist.unshift({l:'Flavor Trio ครบ 3 รส',p:S.rules.trio,ch:'ภารกิจ'});S.chat.push({f:'oa',k:'ai',kk:'PUSH',x:`Flavor Trio สำเร็จ ได้ +${S.rules.trio} แต้ม`});fxQueue().push({n:S.rules.trio,label:'Flavor Trio +'+S.rules.trio})}
  if(tierIdx()>tier0){res.lvl=true;fxQueue().push({lvl:'LEVEL UP!',sub:'ชาร์จเต็ม · ขึ้น '+TIER[tierIdx()].k,small:'ปลดล็อกรางวัล Pin ใหม่ · แตะเพื่อปิด'});log('ระบบ','ลูกค้าขึ้น Tier '+TIER[tierIdx()].k)}
  res.iw=held?null:rollIW(items);
  S.kpi.cans+=res.cans;
  const ch=items[0].ch;
  VoltDash.ingest({ch:/^7/.test(ch)?'7-Eleven':['Lawson','Makro','โชห่วย'].includes(ch)?ch:'ออนไลน์+',cans:res.cans,pts:held?0:res.pts,who:'คุณ'+(u.name||'')+' (เดโม)',me:u.pts,tier:TIER[tierIdx()].k,shop:ch==='โชห่วย'?(from&&from.shop)||S.shops[0].n:null,desc:label});
  if(!held)fxQueue().push({n:res.pts});
  if(res.capped)S.chat.push({f:'oa',k:'ai',kk:'PUSH',x:`วันนี้ชาร์จครบเพดาน ${S.rules.capCans} กระป๋องแล้ว พักก่อนนะ`});

function rollIW(items){const iw=S.iw,u=S.user,tot=iw.pool.reduce((a,p)=>a+p.left,0);iw.played++;
  if(tot<=0)return null;const hit=Math.random()<S.rules.iwDemo;if(!hit)return{win:false};
  let r=Math.random()*tot,pz=iw.pool[0];for(const p of iw.pool){if(r<p.left){pz=p;break}r-=p.left}
  pz.left--;S.pools.A2.iss+=pz.cost;const code='IW-'+Math.random().toString(36).slice(2,8).toUpperCase();
  S.wallet.unshift({id:'w'+Date.now(),n:pz.name,kind:'iw',code,st:'ready',exp:'30 วัน',cost:pz.cost});u.iwWins.push(pz.name);

function nudge(){const g=goalReward();if(g&&g.pts>S.user.pts){const x=`อีก ${g.pts-S.user.pts} แต้ม ถึงเป้า “${g.n}”`;const last=S.chat[S.chat.length-1];if(!last||last.x!==x)S.chat.push({f:'oa',k:'ai',kk:'PUSH',x})}}

/* ---------- recommendation (rules v1, handoff §6) ---------- */
function recommend(){
  const u=S.user,out=[],groups=u.groups||[];
  const items=S.rewards.filter(r=>r.tier!=='T0'&&r.k!=='perk');
  const sc=r=>{const g=r.gs[0],interest=r.gs.some(x=>groups.includes(x))?1:(g==='core'?.35:0),beh=Math.min(1,((u.beh[g]||0)+(u.hearts.includes(r.id)?2:0))/5),pop=r.pop/100;
    const reach=r.pts>0&&u.pts>=r.pts*.5?1.2:1;return{s:(.5*interest+.3*beh+.2*pop)*reach,interest,beh,pop,reach}};
  let pool=items.filter(r=>!soldOut(r)&&allowed(r)&&(r.tier!=='D'||true));
  if(!u.pers||!groups.length||S.aiOff){pool=pool.map(r=>({r,sc:{s:r.pop/100},why:'ยอดนิยมรวมตอนนี้'})).sort((a,b)=>b.sc.s-a.sc.s)}
  else pool=pool.map(r=>{const c=sc(r);const g=r.gs.find(x=>groups.includes(x));
    const need=Math.max(0,r.pts-u.pts);const why=g&&g!=='core'?`คุณเลือกกลุ่ม${LG[g].th}${need?` และอีก ${fmt(need)} แต้มถึง`:' แต้มพอแลกแล้ว'}`:c.interest>0?'ของพื้นฐานที่ทุกคนแลกได้':'ยอดนิยมในคนคล้ายกัน';return{r,sc:c,why}}).sort((a,b)=>b.sc.s-a.sc.s);
  const cnt={};let hasT1=false;
  for(const x of pool){const g=x.r.gs[0];if((cnt[g]||0)>=2)continue;cnt[g]=(cnt[g]||0)+1;out.push(x);if(x.r.tier==='T1')hasT1=true;if(out.length>=6)break}
  if(!hasT1){const t1=pool.find(x=>x.r.tier==='T1'&&!out.includes(x));if(t1){if(out.length>=6)out.pop();out.push(t1)}}
  return out.sort((a,b)=>b.sc.s-a.sc.s).slice(0,6)}

function lbRows(type){const r=rngOf(type.length*31+5),names=['คุณบอส','คุณแพร','คุณนนท์','คุณจูน','คุณเก่ง','คุณฟ้า','คุณต้น','คุณมิว','คุณอาร์ม','คุณปุ๊ก','คุณโอ๊ต','คุณเนย'];
  const scale={wk:1,mo:3.4,prov:2.2,chg:1,campus:1}[type]||1;
  let rows=names.map((n,i)=>({n,v:Math.round((920-i*58+r()*20)*scale),sub:''}));
  if(type==='chg')rows=rows.map((x,i)=>({...x,v:30-i,sub:'วันที่ชาร์จ'}));
  if(type==='campus'){rows=['จุฬาฯ','เกษตรศาสตร์','มหิดล','ธรรมศาสตร์','เชียงใหม่','ขอนแก่น','สงขลานครินทร์','มศว'].map((n,i)=>({n:'ม.'+n,v:Math.round(5400-i*470+r()*80),sub:'คนชาร์จ'}))}
  const u=S.user;if(u.reg&&type!=='campus'){const mine=type==='chg'?Math.max(0,Math.min(30,u.wk.reduce((a,b)=>a+b,0)*3+u.cansToday)):(type==='wk'?u.spendW:u.spendM*(type==='prov'?1:1));rows.push({n:'คุณ'+u.name+' (คุณ)',v:Math.round(mine),me:true,sub:type==='chg'?'วันที่ชาร์จ':''})}
  rows.sort((a,b)=>b.v-a.v);rows.forEach((x,i)=>x.rank=i+1);return rows}

/* =====================================================================
   Actions (data-a delegation), render loop, boot
   ===================================================================== */
const chatPush=(x,kk)=>S.chat.push({f:'oa',k:'ai',kk:kk||'PUSH',x});
const meName=()=>'คุณ'+(S.user.name||'')+' (เดโม)';
const aiOnly=()=>!S.aiOff;
function needApprove(kind,label,payload){S.approvals=S.approvals.filter(a=>!(a.kind===kind&&kind==='rules'));S.approvals.push({id:'ap'+Date.now(),kind,label,by:'คุณมิ้น (Admin)',at:now(),payload});log('หลังบ้าน','ส่งขออนุมัติ: '+label);toast('ส่งขออนุมัติแล้ว รอผู้อนุมัติคนที่ 2')}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}
const doneQ=(F)=>{const u=S.user;u.pts+=F.p;S.hist=S.hist||[];S.hist.unshift({l:F.l,p:F.p,ch:'ภารกิจ'});fxPush({n:F.p,label:F.l+' +'+F.p});VoltDash.ingest({pts:F.p,who:meName(),desc:F.l,ch:'ออนไลน์+',cans:0})};

function finish(msg,code){Object.assign(S.ui.rd,{step:'done',msg,code})}
function pay(r){const u=S.user;u.pts-=r.pts;fxPush({n:-r.pts});r.used++;S.pools[poolOf(r)].iss+=r.cost;u.claims.push(r.id);S.hist=S.hist||[];S.hist.unshift({l:'แลก '+r.n,p:-r.pts,ch:'แลก'});
  const code=r.ship?'':'VC-'+Math.random().toString(36).slice(2,8).toUpperCase();
  if(!r.ship)S.wallet.unshift({id:'w'+Date.now(),n:r.n,kind:'cat',code,st:'ready',exp:'30 วัน',cost:r.cost});
  if(u.goal===r.id)u.goal=null;
  VoltDash.ingest({redeem:r.pts,who:meName(),name:r.n,first:!u.redeemed});u.redeemed=true;S.kpi.ptsUse=(S.kpi.ptsUse||0)+r.pts;
  chatPush(r.ship?`แลก ${r.n} สำเร็จ · เลขพัสดุ TH${Math.floor(1e9*Math.random())} จะอัปเดตทาง LINE`:`แลก ${r.n} สำเร็จ · โค้ด ${code}`);log('ลูกค้า',`แลก ${r.n} −${r.pts} แต้ม`);done('redeem');
  finish(r.ship?'จัดส่งถึงบ้านภายใน 7–14 วัน · ติดตามพัสดุใน LINE':'ใช้โค้ดนี้ได้ทันที · เก็บไว้ในกระเป๋าคูปอง',code)}

function reply(v){const u=S.user,ti=tierIdx(),g=goalReward(),q={pts:'แต้มฉันเหลือเท่าไร',near:'ร้านสะสมแต้มใกล้ฉัน',how:'สะสมแต้มยังไง',tier:'ขึ้น Tier ยังไง',next:'ควรทำอะไรต่อ',why:'ทำไมแนะนำชิ้นนี้',human:'ติดต่อทีมงาน'}[v];
  S.chat.push({f:'me',x:q});
  if(!u.reg&&!['how','near','human'].includes(v)){chatPush('คุณยังไม่ได้เป็นสมาชิก กด “สมัครสมาชิก” ที่เมนูด้านล่าง รับ Welcome 20 แต้มหลังชาร์จกระป๋องแรก','PULL');return}
  if((S.aiOff||S.aiK.l1)&&!['human','how'].includes(v)){chatPush('ตอนนี้ระบบผู้ช่วยปิดอยู่ชั่วคราว ดูแต้มและกติกาได้ที่เมนูด้านล่าง หรือกด “ติดต่อทีมงาน”','PULL');return}
  const a={pts:()=>`คุณมี ${fmt(u.pts)} แต้ม (${TIER[ti].k})${u.pend?` · รอปลดล็อก ${u.pend} แต้ม`:''}${g&&g.pts>u.pts?` · อีก ${fmt(g.pts-u.pts)} แต้มถึงเป้า “${g.n}”`:''}`,
    near:()=>`ใกล้คุณมี ${S.shops.filter(s=>!s.sus).length} ร้าน ใกล้สุด: ${S.shops[0].n} 0.3 กม. · กด “ร้านใกล้ฉัน” เพื่อดูแผนที่`,
    how:()=>`4 วิธี: 1) กรอกรหัสใต้ห่วง 2) สแกน QR ที่ร้านโชห่วย (ร้านกดอนุมัติ) 3) ส่งรูปใบเสร็จ 7-Eleven / Lawson / Villa / Makro 4) ผูกออเดอร์ออนไลน์ · 190 ml = ${S.rules.p190} · 310 ml = ${S.rules.p310} แต้ม`,
    tier:()=>nextTier()?`ชาร์จให้ครบ ${nextTier().w} สัปดาห์ ใน 8 สัปดาห์ล่าสุด ตอนนี้ ${weeksIn()} สัปดาห์ เพื่อขึ้น ${nextTier().k}`:'คุณอยู่ระดับสูงสุดแล้ว',
    next:()=>nextAction().t,
    why:()=>{const r=recommend()[0];return r?`แนะนำ “${r.r.n}” เพราะ${r.why}`:'ยังไม่มีรายการแนะนำ'},
    human:()=>{S.cases.unshift({id:'CS-'+(1002+S.cases.length),who:meName(),t:'ลูกค้าขอคุยกับทีมงาน',st:'เปิด'});return 'ส่งเรื่องให้ทีมงานแล้ว จะติดต่อกลับทาง LINE ภายใน 24 ชม. (เปิดเคสในหลังบ้านให้แล้ว)'}}[v];
  chatPush(a(),'PULL');log('AI','Volt Buddy ตอบ: '+q)}

function approveReq(p,auto){const sh=S.shops.find(x=>x.id===p.shopId),over=sh.usedM+p.q>quotaOf(sh);
  const why=p.gpsOut?'ตำแหน่งนอกรัศมีร้าน':sh.risk==='สูง'?'ร้านถูกเฝ้าระวัง':sh.hold?'ร้านถูกพักแต้ม':over?'เกินโควตาร้าน':'';
  const res=awardCans(p.items,`${p.shop} (QR ร้าน) · ${p.q} กระป๋อง`,{shop:p.shop,hold:!!why,why});
  const sc=S.scans.find(x=>x.st==='wait'||x.d===p.lines.map(l=>l.t+' × '+l.q).join(', '));
  if(res.cans){sh.usedM+=res.cans;sh.pts+=res.cans;S.user.scansToday++;if(sc)sc.st=why?'hold':'ok';if(sh.id===myShop().id)fxPush({to:'#shopb .cbolt',n:res.cans,label:`ร้าน +${res.cans}`});log(auto?'ระบบ':'ร้าน',`อนุมัติ ${p.q} กระป๋อง ${why?'(พักแต้ม: '+why+')':''}`);done('qr');if(res.iw&&res.iw.win)toast('Instant Win! ดูกระเป๋าคูปอง')}
  else{if(sc)sc.st='cap';log('ระบบ','ลูกค้าชาร์จครบเพดานวันนี้')}}
const A={
  c:(v)=>{S.ui.c=v;if(v==='rewards'||v==='collect')S.ui.rd=null;if(v==='quizP')S.ui.qi=0;if(v==='quizW')S.ui.qi=0},
  collectTab:(v)=>{S.ui.c='collect';S.ui.tab=v},
  fl:(v)=>{S.ui.fl=v},imgs:(v)=>{S.ui.rcImgs=Math.max(1,Math.min(6,S.ui.rcImgs+ +v))},
  assist:()=>{if(S.aiOff||S.aiK.l3)return toast('ผู้ช่วยปิดอยู่ชั่วคราว');const sku=$('#rsku').value,q=Math.max(1,+$('#rqty').value||1),st=$('#rstore').value,u=S.user,bo=st==='7-Eleven'&&sku==='s310'?Math.min(q,u.boostPool||0):0,pts=S.rules[sku==='s310'?'p310':'p190']*q+bo*S.rules.bonus7;toast(`ประมาณ +${pts} แต้ม${bo?` (รวม Retail Boost ${bo} กป.)`:''} · ถ่ายให้เห็นร้าน วันที่ รายการชัด · ผู้ช่วยไม่ตัดสินผลการตรวจ`);log('AI','ผู้ช่วยในหน้า: ดูตัวอย่างแต้ม')},
  rg2:(v)=>{S.ui.rg=v},
  rmToggle:()=>{S.ui.rmOpen=!S.ui.rmOpen},rmTab:(v)=>{S.ui.rmTab=v},
  ask:(v)=>reply(v),
  heart:(v)=>{const h=S.user.hearts,i=h.indexOf(v);i<0?h.push(v):h.splice(i,1)},
  goal:(v)=>{const u=S.user;if(u.goal===v){u.goal=null;toast('เอาเป้าหมายออกแล้ว');return}u.goal=v;done('goal');const r=goalReward();log('ลูกค้า','ตั้งเป้ารางวัล '+r.n);toast('ตั้งเป้าแล้ว · ดู Charge Bolt เติมขึ้นทุกครั้งที่ชาร์จ')},
  goalClear:()=>{S.user.goal=null;S.ui.c='rewards'},
  invite:()=>{toast('คัดลอกลิงก์ชวนเพื่อนแล้ว · เพื่อนสมัครและชาร์จกระป๋องแรก คุณได้ +5 แต้ม (ยังไม่เปิดในเดโม)')},
  /* collect */
  sendReceipt:()=>{const store=$('#rstore').value,no=$('#rno').value.trim(),sku=$('#rsku').value,qty=Math.max(1,Math.min(24,+$('#rqty').value||1)),blur=$('#rblur').checked,aig=$('#raig').checked,flav=S.ui.fl||S.user.flav||'y';
    if(!no)return toast('กรอกเลขใบเสร็จก่อน');const dup=S.receipts.some(r=>r.no===no);
    const r={id:'r'+Date.now(),me:true,store,no,sku,flav,qty,st:'checking',score:0,why:'',blur,ch:store,imgs:S.ui.rcImgs};S.receipts.push(r);log('ลูกค้า',`ส่งใบเสร็จ ${store} ${no} (${r.imgs} รูป)`);done('receipt');
    setTimeout(()=>{
      if(dup){r.st='dup';r.score=.05;r.why='ใบเสร็จซ้ำ';chatPush(`ใบเสร็จ ${no} เคยส่งแล้ว ระบบจึงไม่ชาร์จแต้มซ้ำ`);log('ระบบ','ปฏิเสธใบเสร็จซ้ำ '+no)}
      else if(aig||blur||qty>S.rules.capCans){r.st='review';r.score=aig?.31:blur?.62:.45;r.aigen=aig;r.why=aig?'ตรวจพบ: ใบเสร็จที่ AI สร้าง':blur?'ภาพเบลอ':'จำนวนผิดปกติ';S.ui.sel=r.id;chatPush(`ใบเสร็จ ${store} อยู่ระหว่างทีมตรวจ (ไม่เกิน 24 ชม.)`);log('ระบบ',`ส่งคนตรวจ ${store} · ${r.why} (score ${r.score})`)}
      else{r.st='ok';r.score=.95;const res=awardCans([{sku,qty,flav,ch:store,bp:store==='7-Eleven'&&sku==='s310'}],`${store} · ${SKU[sku].s} × ${qty}`);r.pts=res.pts;chatPush(`ใบเสร็จผ่าน ได้ ${res.pts} แต้ม · รวม ${fmt(S.user.pts)} แต้ม${res.iw&&res.iw.win?' · Instant Win!':''}`);log('ระบบ',`อนุมัติอัตโนมัติ ${store} +${res.pts} แต้ม`)}
      render()},1200)},
  sendCode:()=>{const c=$('#ccode').value.trim().toUpperCase(),u=S.user,used=S.receipts.some(r=>r.no===c);
    if(CODES[c]&&!used){const sku=CODES[c];if(sku==='s310')u.boostPool=(u.boostPool||0)+1;const res=awardCans([{sku,qty:1,flav:u.flav||'y',ch:'รหัส',rcpt:false}],`รหัสใต้ห่วง ${SKU[sku].s}`);S.receipts.push({id:'r'+Date.now(),me:true,store:'รหัสใต้ห่วง',no:c,sku,flav:'y',qty:1,st:'ok',pts:res.pts,ch:'รหัส'});u.codeFails=0;toast(`รหัสถูกต้อง +${res.pts} แต้ม`);log('ลูกค้า',`ใช้รหัส ${c} +${res.pts}`)}
    else{u.codeFails=(u.codeFails||0)+1;toast(used?'รหัสนี้ถูกใช้ไปแล้ว':'รหัสไม่ถูกต้อง');log('ระบบ',`กรอกรหัสผิด (${u.codeFails}/5)`)}},
  sendOnline:()=>{const pl=$('#oplat').value,no=$('#ono').value.trim(),n=+$('#osku').value;if(S.receipts.some(r=>r.no===no))return toast('เลขออเดอร์นี้ถูกใช้แล้ว');
    const r={id:'r'+Date.now(),me:true,store:pl==='other'?'Shopee ร้านทั่วไป':'Volt Official '+(pl==='off'?'Shopee':'Lazada'),no,sku:'s310',flav:S.user.flav||'y',qty:n,ch:'ออนไลน์'};S.receipts.push(r);
    if(pl==='other'){r.st='review';r.score=.7;r.why='ไม่ใช่ร้าน Official';S.ui.sel=r.id;toast('ส่งทีมตรวจแล้ว');log('ลูกค้า','ผูกออเดอร์ร้านทั่วไป → ส่งคนตรวจ')}
    else{r.st='ok';const res=awardCans([{sku:'s310',qty:n,flav:r.flav,ch:'ออนไลน์'}],`ออนไลน์ · 310 ml แพ็ก ${n}`,{hold:true,why:'รอปิดช่วงคืนสินค้า'});r.pts=res.pts;r.st='held';toast(`ออเดอร์ยืนยันแล้ว · แต้ม ${res.pts} พักจนปิดช่วงคืนสินค้า`);log('ลูกค้า',`ผูกออเดอร์ Official +${res.pts}`)}},
  deskCode:()=>{const c=$('#dcode').value.trim().toUpperCase();if(CODES[c]&&!S.receipts.some(r=>r.no===c)){const res=awardCans([{sku:CODES[c],qty:1,flav:S.user.flav||'y',ch:'รหัส',rcpt:false}],'รหัสใต้ห่วง (เว็บ)');S.receipts.push({id:'r'+Date.now(),me:true,store:'รหัสใต้ห่วง',no:c,sku:CODES[c],flav:'y',qty:1,st:'ok',pts:res.pts,ch:'รหัส'});toast(`+${res.pts} แต้ม · มือถือเห็นยอดเดียวกัน`);log('ลูกค้า','ใช้รหัสผ่านเว็บ Desktop')}else toast('รหัสไม่ถูกต้องหรือถูกใช้แล้ว')},
  /* rewards */
  openRw:(v)=>{if(!S.user.reg){S.ui.c='reg1';toast('สมัครสมาชิกก่อนแลกรางวัล');return}const r=S.rewards.find(x=>x.id===v);S.ui.c='redeem';S.ui.rd={id:v,step:'choose',addrOk:!!S.user.address}},
  confirmRw:()=>{const r=S.rewards.find(x=>x.id===S.ui.rd.id),d=S.ui.rd,u=S.user;
    if(!allowed(r))return toast(`รางวัลนี้สำหรับอายุ ${r.minAge} ปีขึ้นไป`);if(soldOut(r))return toast('รางวัลหมดแล้ว');if(u.pts<r.pts)return toast('แต้มไม่พอ');
    if(u.claims.filter(x=>x===r.id).length>=r.cap)return toast(`แลกครบ ${r.cap} สิทธิ์/คนแล้ว`);
    if(!u.otp){d.step='otp';return}
    if(r.ship&&!d.addrOk){d.step='addr';return}
    pay(r)},
  otp:()=>{if(!/^\d{6}$/.test($('#otp').value))return toast('ใส่ตัวเลข 6 หลัก');S.user.otp=true;log('ลูกค้า','ยืนยัน OTP');A.confirmRw()},

    d.snap=hash(v+':'+total+':'+mine);d.seed=hash(d.snap+now());const rn=rngOf(parseInt(d.seed,16));
    const w=[];const youWin=u.reg&&mine>0&&S.ui.rigDemo;if(youWin)w.push('คุณ'+u.name+' (เดโม)');while(w.length<Math.min(d.winners,6))w.push(pick(names,rn)+Math.floor(rn()*90+10));d.winnersList=w;d.status='done';S.pools[d.budgetPool].iss+=d.cost;
    if(youWin){if(ageOf()<S.rules.ageMin)log('ระบบ','ผู้ชนะอายุไม่ถึงเกณฑ์ ตัดสิทธิ์');else{S.wallet.unshift({id:'w'+Date.now(),n:'ผู้ชนะ '+d.n,kind:'draw',code:'WIN-'+d.seed.slice(0,6).toUpperCase(),st:'ready',exp:'ติดต่อภายใน 30 วัน',cost:d.cost/d.winners});chatPush(`ยินดีด้วย! คุณเป็นผู้โชคดี ${d.n} · ทีมงานจะติดต่อเพื่อตรวจอายุและจัดส่งรางวัล`);fxPush({lvl:'YOU WIN!',sub:d.n,small:'แตะเพื่อปิด'})}}
    log('ระบบ',`จับรางวัล ${d.n}: snapshot ${d.snap} seed ${d.seed}`);toast('จับรางวัลแล้ว · เก็บผลแบบแก้ไขไม่ได้')},
  aiK:(v)=>{S.aiK[v]=!S.aiK[v];log('หลังบ้าน',`${S.aiK[v]?'ปิด':'เปิด'} AI ${v.toUpperCase()}`)},
  campToggle:(v)=>{const c=S.campaigns.find(x=>x.id===v),m=S.mult.find(x=>x.id==={fl1:'m1',fl2:'m2'}[v]);if(c.st==='off'&&cpcNow()>=1.5)return toast('Governor อยู่โซนเตือน/หยุด เปิด Flash ไม่ได้');c.st=c.st==='on'?'off':'on';if(m)m.on=c.st==='on';log('หลังบ้าน',`${c.st==='on'?'เปิด':'ปิด'}แคมเปญ ${c.n}`);done('rule')},
  liftRecalc:()=>{const L=S.lift;L.base=98+Math.random()*4;L.exp=L.base*(1.07+Math.random()*.1);log('ระบบ','คำนวณ Lift ใหม่')},
  aiOff:()=>{S.aiOff=!S.aiOff;log('หลังบ้าน',`${S.aiOff?'เปิด':'ปิด'} Kill switch AI`)},
  dsr:()=>{guest(S);log('ระบบ','DSR: ลบข้อมูลสมาชิกตามคำขอ');toast('ลบข้อมูลสมาชิกตัวอย่างแล้ว')},
  /* demo controls */
  week:()=>{const u=S.user;u.wk.shift();u.wk.push(0);u.week=false;u.cansToday=0;u.scansToday=0;u.lastDays+=7;u.weeklyDone=false;S.ui.wq++;S.ui.qi=0;let rel=0;u.pendList=u.pendList.filter(x=>{if(x.hold){rel+=x.p;return false}return true});if(rel){u.pts+=rel;u.pend=u.pendList.reduce((a,b)=>a+b.p,0);S.hist=S.hist||[];S.hist.unshift({l:'ปล่อยแต้มที่พักตรวจ',p:rel,ch:'ระบบ'});chatPush(`ปล่อยแต้มที่พักตรวจ ${rel} แต้มแล้ว`);fxPush({n:rel,label:'ปล่อยแต้ม +'+rel})}log('ระบบ','เริ่มสัปดาห์ใหม่ (เดโม)');toast('ข้ามไปสัปดาห์ถัดไป · ชาร์จสัปดาห์นี้เพื่อนับต่อเนื่อง');done('tier')},
  reset:()=>{S=guest(seed());toast('รีเซ็ตเดโมแล้ว')},
  guest:()=>{S=guest(seed());toast('เริ่มเป็นผู้ใช้ใหม่ · กด “สมัครสมาชิก” ที่ Rich Menu')},
  member:()=>{S=seed();toast('โหลดสมาชิกตัวอย่าง: คุณมายด์ LF2 · 148 แต้ม')},
  dash:()=>{}
};

/* ---------- render loop (animate Charge Bolt level changes across re-renders) ---------- */
const BIDS=['hud','cardbolt','goalbolt','tierbolt','shopb','welbolt'];
function boltSnap(){const m={};BIDS.forEach(id=>{const b=document.querySelector('#'+id+' .cbolt');if(b)m[id]=parseFloat(b.dataset.p||0)});return m}
function boltAnim(prev){for(const id in prev){const b=document.querySelector('#'+id+' .cbolt');if(!b)continue;const np=parseFloat(b.dataset.p||0);if(np>prev[id]+.001){b.style.setProperty('--p',VoltFX.vis(prev[id]));b.dataset.p=prev[id];void b.offsetWidth;VoltFX.setBolt(b,np)}}}
function render(){const pb=boltSnap();renderCust();renderShop();renderFeed();renderDesk();boltAnim(pb);save();flushFx()}
const CLEAR={guest:1,member:1,sendReceipt:1,sendCode:1,sendOnline:1,saveRw:1,deskCode:1,otp:1,addr:1,reset:1,collectTab:1,c:1,openRw:1,saveRules:1,drawSave:1,b:1,segSend:1};
function snap(){const m={};document.querySelectorAll('#cust [id],#shop [id],#desk [id]').forEach(el=>{if(el.matches('input,select,textarea'))m[el.id]=el.type==='checkbox'?el.checked:el.value});return m}
function restore(m){for(const id in m){const el=document.getElementById(id);if(el&&el.matches('input,select,textarea')&&el.type!=='file'){if(el.type==='checkbox')el.checked=m[id];else el.value=m[id]}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled||b.matches('input[type=range]'))return;const k=b.dataset.a,f=A[k];if(!f)return;setFrom(b);const m=snap();f(b.dataset.v,b);render();if(!CLEAR[k])restore(m)});
document.addEventListener('change',e=>{const b=e.target.closest('input[type=range][data-a]');if(!b)return;A[b.dataset.a](b.value,b);render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#ccode')){A.sendCode();render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.filt span[data-a]')){e.preventDefault();e.target.click()}});
VoltFX.onHold((act,el)=>{const i=act.indexOf(':'),fn=act.slice(0,i),v=act.slice(i+1);if(!A[fn])return;setFrom(el);A[fn](v,el);render()});
function fit(){const w=$('.dtw'),d=$('#desk');const sc=w.clientWidth/1280;d.style.transform='scale('+sc+')';w.style.height=(d.offsetHeight*sc)+'px'}
addEventListener('resize',fit);
load();
VoltDash.init({alerts:()=>{const a=[];S.shops.filter(s=>s.risk==='สูง'&&!s.sus).forEach(s=>a.push({t:`ร้าน ${s.id} ${s.n}: ${s.why[0]} ›`,cls:'r',a:'goShop',v:s.id}));const q=S.receipts.filter(r=>r.st==='review').length;if(q)a.push({t:`คิวตรวจใบเสร็จ ${q} รายการ ›`,cls:'a',a:'b',v:'receipts'});if(S.approvals.length)a.push({t:`รออนุมัติคนที่ 2 ${S.approvals.length} เรื่อง ›`,cls:'a',a:'b',v:'rules'});return a},
  onNoti:()=>{log('หลังบ้าน','ส่งข้อความดึงกลุ่มเสี่ยง (ไม่ซื้อ >21 วัน) กลับ');chatPush('คิดถึงกัน! กลับมาชาร์จสัปดาห์นี้ รับตัวคูณพิเศษ (เฉพาะผู้ยินยอมข่าวสาร)');renderCust();renderFeed();save()}});
render();fit();setTimeout(fit,400);

})();
</script>
