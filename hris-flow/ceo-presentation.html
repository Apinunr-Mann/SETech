<title>HRIS CEO Briefing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Itim&display=swap">
<style>
/* Layout: a video player — 16:9 stage (1280×720 design space, scaled to fit) over a control bar; deliberately one dark "screening room" look */
:root{
  color-scheme:dark;
  --room:#0C0E18; --stage:#141729; --panel:#1C2038; --line:#2C3155; --ink:#EEF0FA; --ink-2:#B4B9D6; --muted:#7F86AB;
  --who:#35C9C6; --what:#F5A524; --where:#B57BFF; --when:#6B9BFF; --why:#FF6B9A; --how:#5CCB68; --learn:#FF8A4C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good:#5CCB68; --bad:#FF8A80; --paper-line:#1A1E35;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Itim","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--f-body);line-height:1.5}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.boxed{border:2.5px solid var(--ink);padding:0 9px;border-radius:3px;font-family:var(--f-display);font-weight:700;font-size:17px}
.top .t{font-family:var(--f-display);font-weight:600;font-size:16px}
.top a{color:var(--ink-2);font-size:13px}

.screen{position:relative;width:100%;height:56vw;max-width:100%;margin:0 auto;background:var(--stage);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;
  background-color:var(--stage);background-image:repeating-linear-gradient(to bottom,transparent 0 39px,var(--paper-line) 39px 40px)}
.scene{position:absolute;inset:0;padding:48px 72px 70px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.18;margin:0;text-wrap:balance;max-width:1080px}
.lead{font-size:22px;color:var(--ink-2);max-width:900px;margin:0}

/* side arrows on the slide */
.edge{position:absolute;top:0;bottom:0;width:8%;display:flex;align-items:center;justify-content:center;z-index:6;opacity:0;transition:opacity .2s;cursor:pointer}
.edge.l{left:0}.edge.r{right:0}
.screen:hover .edge{opacity:.85}
.edge:focus-visible{opacity:1;outline:2px solid var(--when);outline-offset:-4px}
.edge span{width:44px;height:44px;border-radius:50%;background:rgba(8,10,20,.7);display:flex;align-items:center;justify-content:center}
.edge svg{width:18px;height:18px;color:var(--ink)}
.edge[disabled]{display:none}

/* controls */
.bar{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink-2)}
.dot b{font-family:var(--f-display);color:var(--ink)}
.dot:hover{border-color:var(--ink-2)}
.dot[aria-current="true"]{background:var(--ink);color:var(--room);border-color:var(--ink)}
.dot[aria-current="true"] b{color:var(--room)}
.dot:focus-visible{outline:2px solid var(--when);outline-offset:2px}
.ctl{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible{outline:2px solid var(--when);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--room);border-color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
.btn svg{width:16px;height:16px}
.btn.main{font-weight:600}
.now{font-size:14px;color:var(--ink-2);margin-right:auto;min-width:0}
.now b{color:var(--ink);font-family:var(--f-display)}
.hint{font-size:12px;color:var(--muted)}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.6;color:var(--ink)}
.notes small{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}

/* motion primitives: base style is the final state, so reduced motion simply shows it */
.in{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) backwards}
.drop{animation:drop .7s cubic-bezier(.2,.9,.3,1.25) backwards}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.still #host *{animation:none!important}
.still .arc,.still .ln{stroke-dashoffset:0!important}

/* shared bits */
.pill{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.08em;padding:1px 8px;border-radius:4px;border:2px solid currentColor}
.pcard{position:relative;background:#1F2440;border-radius:18px;padding:30px 12px 12px;box-shadow:0 14px 30px rgba(0,0,0,.4);transform:rotate(var(--r,0deg));cursor:pointer;transition:transform .35s}
.pcard:hover,.pcard.sel{transform:rotate(0) translateY(-6px)}
.pcard.sel{box-shadow:0 14px 30px rgba(0,0,0,.4),0 0 0 3px var(--k)}
.pcard .pin{position:absolute;top:7px;left:50%;width:22px;height:26px;transform:translateX(-50%);color:var(--k)}
.pcard .inner{display:block;border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--k) 12%,#1F2440);border:1px solid color-mix(in srgb,var(--k) 30%,#1F2440)}
.pcard .row{display:flex;justify-content:space-between;align-items:center}
.pcard .n{font-family:var(--f-hand);font-size:34px;line-height:1;color:var(--k)}
.pcard .w{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--k);border:1.5px solid currentColor;border-radius:4px;padding:0 6px}
.pcard .t{display:block;font-family:var(--f-display);font-weight:600;font-size:19px;margin-top:8px}
.note{font-size:15px;color:var(--muted)}

/* scene specifics */
.title-wrap{margin:auto 0;display:flex;flex-direction:column;gap:24px}
.title-wrap .big{font-family:var(--f-display);font-weight:700;font-size:72px;line-height:1.08;margin:0;max-width:1100px;text-wrap:balance}
.title-wrap .big em{font-style:normal;color:var(--what)}
.pins{display:flex;gap:18px;align-items:center}
.pins span{width:30px;height:36px;color:var(--k)}
.meta{font-family:var(--f-mono);font-size:15px;color:var(--muted);letter-spacing:.06em}

.pains{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pain{display:grid;grid-template-columns:1fr 40px 1fr;border-radius:14px;overflow:hidden;border:1px solid var(--line);font-size:19px}
.pain>div{padding:16px 18px}
.pain .p{background:color-mix(in srgb,var(--bad) 14%,var(--stage))}
.pain .s{background:color-mix(in srgb,var(--good) 14%,var(--stage))}
.pain .a{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;background:var(--panel)}
.pain small{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}

.mods{display:grid;grid-template-columns:repeat(5,1fr);column-gap:22px;row-gap:26px;align-items:start}
.mods>*{min-width:0}
.mods .learn{grid-column:1;grid-row:2}.mods .how{grid-column:3 / span 2;justify-self:center;width:calc(50% - 11px);grid-row:2}
.mods .how .inner{border-style:dashed;border-width:2px}
.modinfo{grid-column:2 / span 1;grid-row:2;align-self:center;font-size:17px;color:var(--ink-2);min-height:120px}
.modinfo b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.mods .info2{grid-column:5;grid-row:2}

.loop{display:grid;grid-template-columns:540px 1fr;gap:70px;align-items:center;flex:1}
.loop svg{width:520px;height:auto;overflow:visible}
.loop .arc{fill:none;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease forwards}
.loop .nd circle{stroke-width:3}
.loop text{font-family:var(--f-body);fill:var(--ink)}
.loop .lb{font-size:14px;fill:var(--ink-2)}
.loop .nw{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em}
.steps{display:flex;flex-direction:column;gap:12px;font-size:19px}
.steps div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}

.princ{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.princ div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.princ .k{font-family:var(--f-hand);font-size:54px;line-height:1;grid-row:span 2;color:var(--what)}
.princ h3{margin:0;font-family:var(--f-display);font-size:22px}
.princ p{margin:0;color:var(--ink-2);font-size:16px}

.price{display:grid;grid-template-columns:1fr 360px;gap:36px;align-items:start}
.price svg{width:100%;height:auto;overflow:visible}
.price .bar-r{animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards;transform-box:fill-box;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}}
.price text{font-family:var(--f-body);fill:var(--ink)}
.price .ax{fill:var(--muted);font-size:13px}
.callout{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.callout .v{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.callout .v small{font-size:18px;font-weight:500;color:var(--muted)}
.callout ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:16px;display:flex;flex-direction:column;gap:4px}

.proj{display:grid;grid-template-columns:1fr 470px;gap:32px;align-items:start}
.proj svg{width:100%;height:auto;overflow:visible}
.proj .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
.proj text{font-family:var(--f-body);fill:var(--ink)}
.proj .ax{fill:var(--muted);font-size:13px}
.proj .gl{stroke:var(--paper-line);stroke-width:1.5}
.kgrid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
.kgrid>div{padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px}
.kgrid .hd{font-family:var(--f-display);font-weight:600;background:var(--panel);text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.kgrid .hd.l{justify-content:flex-start}
.kgrid .v{text-align:right;font-family:var(--f-display);font-weight:600;font-size:18px}
.kgrid .r{color:var(--ink-2)}
.kgrid .sel{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.sw{display:inline-block;width:14px;height:4px;border-radius:2px}

.road{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:30px}
.road::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;background:var(--line)}
.road .fill{position:absolute;left:0;top:9px;height:3px;width:100%;background:var(--ink);transform-origin:left;animation:grow 4s linear backwards}
.road>div.ph{position:relative;padding-top:34px;display:flex;flex-direction:column;gap:6px}
.road>div.ph::before{content:"";position:absolute;top:0;left:0;width:21px;height:21px;border-radius:50%;background:var(--stage);border:3px solid var(--ink)}
.road .when{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.road h3{margin:0;font-family:var(--f-display);font-size:21px}
.road ul{margin:0;padding-left:18px;font-size:15px;color:var(--ink-2)}

.asks{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.ask .n{font-family:var(--f-hand);font-size:48px;line-height:1;color:var(--what)}
.ask h3{margin:0;font-family:var(--f-display);font-size:23px}
.ask p{margin:0;color:var(--ink-2);font-size:16.5px}
.ask .opt{font-size:14.5px;color:var(--ink);border-top:1px dashed var(--line);padding-top:10px}

.close{margin:auto 0;display:flex;flex-direction:column;gap:20px}
.close .big{font-family:var(--f-display);font-weight:700;font-size:58px;line-height:1.12;margin:0;max-width:1050px}
.close a{color:var(--ink);font-size:20px}
.close .row{display:flex;gap:14px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  .in,.pop,.drop,.price .bar-r,.road .fill{animation:none}
  .loop .arc,.proj .ln{animation:none;stroke-dashoffset:0}
  .pcard{transition:none}
}
@media (max-width:640px){.hint{display:none}.top .t{font-size:14px}}
</style>

  <div class="screen" id="screen">

      <button class="btn main" id="next">ถัดไป<svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M7 3l7 7-7 7-1.4-1.4L11.2 10 5.6 4.4z"/></svg></button>

<script>
/* ---------- data (same figures as the full HRIS document) ---------- */
const MODS=[
  {k:"who",w:"WHO",t:"Employee Data",q:"แฟ้มพนักงานกลาง ข้อมูลตั้งต้นของทุกโมดูล นำเข้าจาก Excel ได้ใน 1 วัน"},
  {k:"what",w:"WHAT",t:"JD + KPI",q:"หน้าที่และ KPI ที่ดึงตัวเลขจริงจากโมดูลอื่น ไม่ต้องกรอกเองปลายปี"},
  {k:"where",w:"WHERE",t:"Company + Culture",q:"คู่มือที่ถามตอบได้ และ Rules Engine กลางสำหรับลา OT กะ ตามกฎหมายไทย"},
  {k:"when",w:"WHEN",t:"Check-in · Leave",q:"ลงเวลาผ่าน LINE ลา/OT ใน 2 แตะ และ timesheet ตามโปรเจกต์"},
  {k:"why",w:"WHY",t:"Timeline + Progress",q:"โปรเจกต์ผูกเป้าหมาย เห็นต้นทุนคนจริงเทียบงบระหว่างทาง"},
  {k:"how",w:"HOW",t:"ERP + Cash Flow",q:"P&L รายโปรเจกต์/รายคน เชื่อม ERP เดิมของลูกค้าได้"},
  {k:"learn",w:"HRD",t:"E-Learning",q:"เรียนบนมือถือ แผนพัฒนารายคนจาก competency gap และ certificate กลับเข้าแฟ้ม"}
];
const PKGS=[{id:"starter",name:"HR Starter",mods:["who","when","where"],price:59,sum:85},{id:"perf",name:"Performance",mods:["who","what","where"],price:65,sum:90},
  {id:"project",name:"Project & Manpower",mods:["who","when","why"],price:85,sum:115},{id:"hrd",name:"Learning (HRD)",mods:["who","what","learn"],price:79,sum:110},
  {id:"suite",name:"Full Suite",mods:["who","what","where","when","why","how","learn"],price:169,sum:280}];
const BUNDLE={starter:{price:59,setup:0},perf:{price:65,setup:9900},project:{price:85,setup:9900},hrd:{price:79,setup:9900},suite:{price:169,setup:39000}};
const MIX={starter:.35,perf:.15,project:.15,hrd:.10,suite:.25};
const SEG=[{emp:50,share:.50},{emp:150,share:.35},{emp:500,share:.15}];
const MONTHS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const SCN=[{n:20,c:"var(--s1)"},{n:50,c:"var(--s2)"},{n:100,c:"var(--s3)"}];
const disc=e=>e>=1000?.2:e>=300?.1:0, seats=e=>Math.max(e,30);
function model(N,start=3,churn=.01,prepay=.4){
  const W=MONTHS.reduce((a,_,m)=>a+(m>=start?m-start+1:0),0);
  const o={mrr:Array(12).fill(0),rev:0,setup:0,cash:0,gp:0,cust:0,emp:0};
  Object.keys(MIX).forEach(p=>SEG.forEach(g=>{
    const share=MIX[p]*g.share,list=BUNDLE[p].price*seats(g.emp)*(1-disc(g.emp));let A=0,P=0;
    for(let m=0;m<12;m++){const nw=m>=start?N*(m-start+1)/W*share:0;A=A*(1-churn)+nw*(1-prepay);const nP=nw*prepay;P+=nP;
      const sub=A*list+P*list*10/12,set=nw*BUNDLE[p].setup;o.mrr[m]+=sub;o.rev+=sub;o.setup+=set;o.cash+=A*list+nP*list*10+set;
      o.gp+=sub-(A+P)*seats(g.emp)*15+set*.4;}
    o.cust+=A+P;o.emp+=(A+P)*g.emp;}));
  return o;
}
const R=SCN.map(s=>model(s.n));
const mb=n=>n>=1e6?(n/1e6).toFixed(2)+" ล้าน":Math.round(n/1e3)+"K";
const PIN=`<svg class="pin" viewBox="0 0 24 28" aria-hidden="true"><path fill="currentColor" d="M7 2h10v2l-1.6 1.4.9 6.1 3.2 2.6V16H13.2l-.7 9.5h-1L10.8 16H4.5v-1.9l3.2-2.6.9-6.1L7 4z"/></svg>`;
const pill=k=>{const m=MODS.find(x=>x.k===k);return `<span class="pill" style="color:var(--${k})">${m.w}</span>`;};
const d=(s)=>`style="animation-delay:${s}s"`;

/* ---------- scenes ---------- */
const SCENES=[
{title:"เปิดเรื่อง",dur:11,
 say:"วันนี้เราจะเสนอระบบ HRIS ที่เชื่อมข้อมูลคน เวลา งาน และกำไร ไว้ในวงจรเดียว ขายได้ทั้งแยกโมดูลและขายเป็นชุดแบบ subscription รายเดือน",

{title:"วงจรข้อมูล",dur:20,
 say:"จุดต่างที่สำคัญที่สุดคือข้อมูลไหลเป็นวงจรเดียว เวลาทำงานของพนักงานกลายเป็นต้นทุนโปรเจกต์ ต้นทุนและรายได้รวมเป็นกำไรขาดทุน แล้วเป้ากำไรถูกส่งกลับไปตั้ง KPI ช่องว่างของ KPI กลายเป็นแผนพัฒนาคน และ certificate กลับเข้าแฟ้มพนักงาน ผู้บริหารจึงเห็นว่าคนและเวลาสร้างกำไรเท่าไร",
 html:()=>{const ring=[["who","WHO","คน"],["when","WHEN","เวลา"],["why","WHY","โปรเจกต์"],["how","HOW","P&L"],["what","WHAT","KPI"],["learn","HRD","พัฒนาคน"]];
  const lab=["Manhour × อัตราต้นทุน","Timesheet ตามโปรเจกต์","ต้นทุน & มูลค่างาน","เป้า P&L → KPI","Competency gap → IDP","Certificate → Skill"];
  const cx=300,cy=235,r=185;const pt=i=>{const a=-Math.PI/2+i*2*Math.PI/6;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let s="";ring.forEach((_,i)=>{const [x1,y1]=pt(i),[x2,y2]=pt((i+1)%6);const mx=(x1+x2)/2,my=(y1+y2)/2,ox=(mx-cx)*.35,oy=(my-cy)*.35;
    s+=`<path class="arc" pathLength="1" d="M${x1},${y1} Q${mx+ox},${my+oy} ${x2},${y2}" style="stroke:var(--${ring[(i+1)%6][0]});animation-delay:${1.6+i*1.9}s" marker-end="url(#m)"/>`;
    const lx=mx+ox*1.3,ly=my+oy*1.3+4;s+=`<text class="lb in" x="${lx}" y="${ly}" text-anchor="${lx<cx-20?"end":lx>cx+20?"start":"middle"}" style="animation-delay:${2.2+i*1.9}s">${lab[i]}</text>`;});
  ring.forEach(([k,w,t],i)=>{const [x,y]=pt(i);s+=`<g class="nd pop" style="animation-delay:${.5+i*.15}s;transform-box:fill-box;transform-origin:center"><circle cx="${x}" cy="${y}" r="40" style="fill:#1F2440;stroke:var(--${k})"/><text class="nw" x="${x}" y="${y-2}" text-anchor="middle" style="fill:var(--${k})">${w}</text><text x="${x}" y="${y+17}" text-anchor="middle" style="font-size:13px;fill:var(--ink-2)">${t}</text></g>`;});
  s+=`<g class="pop" style="animation-delay:.3s;transform-box:fill-box;transform-origin:center"><text x="${cx}" y="${cy-6}" text-anchor="middle" style="font-family:var(--f-display);font-weight:700;font-size:21px;fill:var(--where)">WHERE</text><text x="${cx}" y="${cy+18}" text-anchor="middle" style="font-size:14px;fill:var(--ink-2)">กฎ · ค่านิยม ใช้ร่วมทุกโมดูล</text></g>`;
  return `<span class="eyebrow in">จุดต่าง</span><h2 class="h in" ${d(.2)}>ข้อมูลชุดเดียว ไหลเป็นวงจร ไม่ต้องกรอกซ้ำ</h2>
   <div class="loop"><svg viewBox="0 0 600 470" role="img" aria-label="วงจรข้อมูลระหว่างโมดูล"><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ink-2)"/></marker></defs>${s}</svg>
   <div class="steps">${[["คน → เวลา","ลงเวลาผ่าน LINE กลายเป็น manhour"],["เวลา → งาน","timesheet ผูกกับโปรเจกต์"],["งาน → กำไร","ต้นทุนคนจริงเทียบรายได้ = P&L"],["กำไร → KPI","เป้า P&L ไหลกลับไปตั้ง KPI"],["KPI → พัฒนาคน","ช่องว่าง competency กลายเป็นแผนเรียน"]].map((r,i)=>`<div class="in" style="animation-delay:${2+i*1.9}s"><span class="pill" style="color:var(--${["when","why","how","what","learn"][i]})">${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div></div>`;}},
{title:"ทำไมลูกค้าเลือกเรา",dur:14,
 say:"หลักการออกแบบมีหกข้อ งานประจำวันจบในสามแตะ ไม่ต้องกรอกข้อมูลซ้ำ ใช้ผ่าน LINE โดยไม่ต้องลงแอปใหม่ ถามเป็นภาษาพูดได้ ระบบเตือนก่อนเกิดปัญหา และเริ่มใช้งานได้ภายในเจ็ดวัน",

  <div class="princ">${[["3","จบใน 3 แตะ","ลงเวลา ขอลา อนุมัติ"],["0","ไม่กรอกซ้ำ","ระบบเติมให้ ผู้ใช้แค่ยืนยัน"],["L","LINE ก่อนแอป","ไม่ต้องติดตั้งแอปใหม่"],["?","ถามเป็นภาษาพูด","“ลาบวชได้กี่วัน” ได้คำตอบพร้อมอ้างข้อ"],["!","เตือนก่อนเกิดปัญหา","งบเกิน งานช้า เอกสารหมดอายุ"],["7","Go-live ใน 7 วัน","นำเข้า Excel เดิมได้ทันที"]]
   .map((r,i)=>`<div class="pop" ${d(1+i*1.6)}><span class="k">${r[0]}</span><h3>${r[1]}</h3><p>${r[2]}</p></div>`).join("")}</div>`},
{title:"ราคา",dur:20,
 say:"ด้านราคา เราคิดต่อพนักงานต่อเดือน ขั้นต่ำสามสิบคน แพ็กเกจเริ่มต้น HR Starter ห้าสิบเก้าบาท อยู่ในช่วงเดียวกับคู่แข่งที่เผยแพร่ราคาห้าสิบถึงแปดสิบบาท ส่วน Full Suite ร้อยหกสิบเก้าบาท ครบทุกโมดูล ประหยัดสี่สิบเปอร์เซ็นต์เทียบกับซื้อแยก และแทนการซื้อระบบ HR ระบบโปรเจกต์ และ E-Learning จากหลายเจ้า",
 html:()=>{const W=760,L=190,max=180,sc=v=>L+(W-L-60)*v/max,rowH=58;let s="";
  s+=`<rect x="${sc(50)}" y="0" width="${sc(80)-sc(50)}" height="${PKGS.length*rowH+6}" style="fill:color-mix(in srgb,var(--ink) 8%,transparent)" class="in" ${d(1)}></rect><text class="ax in" x="${(sc(50)+sc(80))/2}" y="${PKGS.length*rowH+30}" text-anchor="middle" ${d(1)}>ช่วงราคาคู่แข่งที่เผยแพร่ ฿50–80</text>`;
  [0,50,100,150].forEach(v=>{s+=`<text class="ax" x="${sc(v)}" y="${PKGS.length*rowH+52}" text-anchor="middle">฿${v}</text>`;});
  PKGS.forEach((p,i)=>{const y=i*rowH+12;s+=`<text x="${L-14}" y="${y+22}" text-anchor="end" style="font-size:17px;font-weight:600">${p.name}</text>
   <rect class="bar-r" x="${L}" y="${y}" width="${sc(p.price)-L}" height="32" rx="4" style="fill:${p.id==="suite"?"var(--ink)":"var(--ink-2)"};animation-delay:${2+i*.9}s"/>
   <text class="in" x="${sc(p.price)+10}" y="${y+22}" style="font-family:var(--f-display);font-weight:700;font-size:18px;animation-delay:${2.6+i*.9}s">฿${p.price}<tspan style="font-family:var(--f-body);font-weight:400;font-size:13px;fill:var(--muted)"> · ประหยัด ${Math.round((1-p.price/p.sum)*100)}%</tspan></text>`;});
  return `<span class="eyebrow in">Subscription รายเดือน · บาท / คน / เดือน · ไม่รวม VAT</span><h2 class="h in" ${d(.2)}>ราคาเข้าถึงได้ แข่งขันได้ และซื้อแยกได้</h2>
   <div class="price"><svg viewBox="0 0 ${W} ${PKGS.length*rowH+60}" role="img" aria-label="ราคาแพ็กเกจเทียบช่วงราคาคู่แข่ง">${s}</svg>
   <div class="callout pop" ${d(7)}><span class="note">Full Suite · ครบ 7 โมดูล</span><span class="v">฿169 <small>/ คน / เดือน</small></span>
   <ul><li>ซื้อแยกรวม ฿280 · ประหยัด 40%</li><li>บริษัท 150 คน ≈ ฿25,350 / เดือน (≈ 0.9% ของค่าจ้าง*)</li><li>จ่ายรายปีฟรี 2 เดือน · 300+ คนลด 10%</li></ul>
   <span class="note">*สมมติค่าจ้างเฉลี่ย 18,000 บาท</span></div></div>`;}},
{title:"Projection 2570",dur:22,
 say:"ถ้าเริ่มขายเดือนเมษายนปีหน้า และปิดลูกค้าได้หนึ่งร้อยรายภายในธันวาคม รายได้ประจำจะอยู่ที่ประมาณหนึ่งจุดสองสี่ล้านบาทต่อเดือน หรือ ARR ราวสิบสี่จุดเก้าล้านบาท แต่รายได้ที่รับรู้ทั้งปีจะอยู่ที่ประมาณห้าจุดเก้าสี่ล้านบาท เพราะลูกค้าส่วนใหญ่เข้ามาช่วงครึ่งปีหลัง ส่วนเงินสดรับสูงกว่า เพราะลูกค้าที่จ่ายรายปีจ่ายล่วงหน้า คลิกหัวคอลัมน์เพื่อไฮไลต์แต่ละฉากทัศน์",
 html:()=>{const W=640,H=300,L=60,T=10,B=34,iw=W-L-140,ih=H-T-B,ym=1.4e6;const x=m=>L+iw*m/11,y=v=>T+ih*(1-v/ym);let s="";
  [0,.5e6,1e6].forEach(v=>{s+=`<line class="gl" x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-10}" y="${y(v)+4}" text-anchor="end">${v?v/1e6+" ล้าน":"0"}</text>`;});
  [0,3,6,9,11].forEach(m=>{s+=`<text class="ax" x="${x(m)}" y="${H-8}" text-anchor="middle">${MONTHS[m]}</text>`;});
  const ends=R.map((r,i)=>({i,y:y(r.mrr[11])})).sort((a,b)=>a.y-b.y);for(let k=1;k<3;k++)if(ends[k].y-ends[k-1].y<20)ends[k].y=ends[k-1].y+20;
  R.forEach((r,i)=>{s+=`<path class="ln sc${i}" pathLength="1" style="stroke:${SCN[i].c};animation-delay:${1.5+i*.6}s" d="${r.mrr.map((v,m)=>(m?"L":"M")+x(m)+","+y(v)).join("")}"/>
   <text class="in sc${i}" x="${x(11)+12}" y="${ends.find(e=>e.i===i).y+5}" style="font-size:15px;animation-delay:${3.6+i*.6}s">${SCN[i].n} ราย · ${mb(r.mrr[11])}</text>`;});
  const rows=[["MRR ธ.ค. 2570",r=>mb(r.mrr[11])],["ARR run-rate",r=>mb(r.mrr[11]*12)],["รายได้รวมปี 2570",r=>mb(r.rev+r.setup)],["เงินสดรับปี 2570",r=>mb(r.cash)],["กำไรขั้นต้น",r=>Math.round(r.gp/(r.rev+r.setup)*100)+"%"],["พนักงานบนระบบ",r=>Math.round(r.emp).toLocaleString("th-TH")+" คน"]];
  return `<span class="eyebrow in">Projection · ม.ค. – ธ.ค. 2570</span><h2 class="h in" ${d(.2)}>ปิดได้ 100 ราย = ARR ราว ${(R[2].mrr[11]*12/1e6).toFixed(1)} ล้านบาท ณ สิ้นปีหน้า</h2>
   <div class="proj"><div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="MRR รายเดือนปี 2570 สามฉากทัศน์">${s}</svg>
   <p class="note in" ${d(5)}>สมมติฐาน: เริ่มขาย เม.ย. 2570 · ยกเลิก 1%/เดือน · จ่ายรายปี 40% · Full Suite 25% ของลูกค้า · ยังไม่รวมเงินเดือนทีมพัฒนาและการตลาด</p></div>
   <div class="kgrid in" ${d(4)} id="kg"><div class="hd l">ถึง ธ.ค. 2570</div>${SCN.map((c,i)=>`<div class="hd sc" data-i="${i}" role="button" tabindex="0"><i class="sw" style="background:${c.c}"></i>${c.n} ราย</div>`).join("")}
   ${rows.map(([l,f])=>`<div class="r">${l}</div>${R.map((r,i)=>`<div class="v c${i}">${f(r)}</div>`).join("")}`).join("")}</div></div>`;},
 after:el=>{el.querySelectorAll(".kgrid .sc").forEach(h=>{const f=()=>{const i=+h.dataset.i;el.querySelectorAll(".kgrid .v").forEach(v=>v.classList.toggle("sel",v.classList.contains("c"+i)));
   el.querySelectorAll(".proj .ln,.proj text[class*=sc]").forEach(p=>p.style.opacity=p.classList.contains("sc"+i)?"1":".25");};h.addEventListener("click",f);h.addEventListener("keydown",e=>{if(e.key==="Enter")f();});});}},

/* ---------- presenter: click-through slides ---------- */
const $=s=>document.querySelector(s);
const st={i:0,notes:false};
const stage=$("#stage"),host=$("#host"),screen=$("#screen");
const PACE=.4; /* scene timings were written for narration; compress them for a live presenter */

$("#dots").innerHTML=SCENES.map((s,i)=>`<button class="dot" data-i="${i}"><b>${i+1}</b>${s.title}</button>`).join("");
document.querySelectorAll(".dot").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.i)));

function fit(){const pw=screen.parentElement.clientWidth,ah=Math.max(220,window.innerHeight-(document.fullscreenElement?110:(st.notes?260:200)));const s=Math.min(pw/1280,ah/720);
  screen.style.width=1280*s+"px";screen.style.height=720*s+"px";stage.style.transform=`scale(${s})`;}
new ResizeObserver(fit).observe(screen.parentElement);window.addEventListener("resize",fit);document.addEventListener("fullscreenchange",fit);fit();

function go(i,still){
  st.i=Math.max(0,Math.min(SCENES.length-1,i));
  const sc=SCENES[st.i];
  screen.classList.toggle("still",!!still);
  host.innerHTML=`<div class="scene">${sc.html()}</div>`;sc.after&&sc.after(host);
  host.querySelectorAll("[style*='animation-delay']").forEach(el=>{const v=parseFloat(el.style.animationDelay);if(!isNaN(v))el.style.animationDelay=(v*PACE).toFixed(2)+"s";});
  $("#now").innerHTML=`<b>${st.i+1} / ${SCENES.length}</b> · ${sc.title}`;
  $("#notes-txt").textContent=sc.say;
  document.querySelectorAll(".dot").forEach((b,k)=>b.setAttribute("aria-current",k===st.i));
  const first=st.i===0,last=st.i===SCENES.length-1;
  $("#prev").disabled=first;$("#edge-prev").disabled=first;$("#next").disabled=last;$("#edge-next").disabled=last;
  try{history.replaceState(null,"","#scene-"+(st.i+1));}catch(e){}
}
const next=()=>go(st.i+1),prev=()=>go(st.i-1);
$("#next").addEventListener("click",next);$("#prev").addEventListener("click",prev);
$("#edge-next").addEventListener("click",next);$("#edge-prev").addEventListener("click",prev);
$("#replay").addEventListener("click",()=>go(st.i));
$("#notes-btn").addEventListener("click",()=>{st.notes=!st.notes;$("#notes").hidden=!st.notes;$("#notes-btn").setAttribute("aria-pressed",st.notes);fit();});
$("#fs").addEventListener("click",()=>{const el=document.documentElement;(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?el.requestFullscreen():Promise.reject()).catch(()=>{});});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,select,textarea"))return;
  if(e.target.closest("[role=button]")&&(e.key===" "||e.key==="Enter"))return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();next();}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==="Home")go(0);else if(e.key==="End")go(SCENES.length-1);
  else if(e.key==="n"||e.key==="N")$("#notes-btn").click();
  else if(e.key==="f"||e.key==="F")$("#fs").click();
});
let sx=null;screen.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
screen.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)(dx<0?next:prev)();sx=null;});

/* open on #scene-N or the title, fully drawn */
const m=/^#scene-(\d+)$/.exec(location.hash);
go(m?(+m[1]-1):0,true);
window.addEventListener("hashchange",()=>{const k=/^#scene-(\d+)$/.exec(location.hash);if(k&&+k[1]-1!==st.i)go(+k[1]-1);});
</script>
